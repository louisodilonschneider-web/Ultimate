  /* ------------------------------------------------------------- import CSV */

  function detectDelimiter(text) {
    var head = text.split(/\r?\n/).slice(0, 5).join('\n');
    var cands = [';', ',', '\t', '|'];
    var best = ';', bestScore = -1;
    cands.forEach(function (d) {
      var n = head.split(d).length - 1;
      if (n > bestScore) { bestScore = n; best = d; }
    });
    return bestScore > 0 ? best : ';';
  }

  function parseCSV(text, delim) {
    text = text.replace(/^﻿/, '');
    delim = delim || detectDelimiter(text);
    var rows = [], row = [], field = '', inQ = false, i = 0;
    while (i < text.length) {
      var ch = text[i];
      if (inQ) {
        if (ch === '"') {
          if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
          inQ = false; i++; continue;
        }
        field += ch; i++; continue;
      }
      if (ch === '"') { inQ = true; i++; continue; }
      if (ch === delim) { row.push(field); field = ''; i++; continue; }
      if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
      if (ch === '\r') { i++; continue; }
      field += ch; i++;
    }
    row.push(field);
    if (row.length > 1 || row[0] !== '') rows.push(row);
    return rows.filter(function (r) { return r.some(function (c) { return String(c).trim() !== ''; }); });
  }

  /* Lecture d'un fichier avec repli sur Windows-1252 si l'UTF-8 produit des
     caractères de remplacement (cas classique des exports Pronote / Excel FR). */
  function readFileSmart(file, cb) {
    var fr = new FileReader();
    fr.onload = function () {
      var txt = fr.result;
      if (/�/.test(txt)) {
        var fr2 = new FileReader();
        fr2.onload = function () { cb(fr2.result); };
        fr2.onerror = function () { cb(txt); };
        try { fr2.readAsText(file, 'windows-1252'); }
        catch (e) { cb(txt); }
      } else cb(txt);
    };
    fr.onerror = function () { notify('Lecture du fichier impossible.'); };
    fr.readAsText(file, 'utf-8');
  }

  var HEADER_HINTS = {
    last: /^(nom|nom de famille|nom d.?[eé]l[eè]ve|nomeleve|name|lastname)$/i,
    first: /^(pr[eé]nom|prenom|firstname|pr[eé]nom de l.?[eé]l[eè]ve)$/i,
    full: /^(nom.?pr[eé]nom|[eé]l[eè]ves?|eleves?|nom complet|identit[eé])$/i,
    sex: /^(sexe|genre|civilit[eé]|s|sex|gender|m\/f)$/i,
    group: /^(classe|division|groupe|class)$/i
  };

  /* Colonnes des exports d'appel qu'on ne veut jamais confondre avec un nom :
     l'export type du collège comporte « encouragement/valorisation » et
     « Né(e) le » entre la colonne des élèves et celle du sexe. */
  var HEADER_IGNORE = /^(encouragement|valorisation|encouragement.?\/?.?valorisation|n[ée]\(?e\)? le|date de naissance|naissance|observations?|remarques?|appr[eé]ciation)/i;

  function guessMapping(header) {
    var map = { last: -1, first: -1, full: -1, sex: -1, group: -1 };
    header.forEach(function (h, i) {
      var key = String(h).trim();
      if (HEADER_IGNORE.test(key)) return;          // colonne à ne pas utiliser
      Object.keys(HEADER_HINTS).forEach(function (k) {
        if (map[k] === -1 && HEADER_HINTS[k].test(key)) map[k] = i;
      });
    });
    /* Repli sur l'ordre de l'export type du collège :
       1 = Élèves · 2 = encouragement · 3 = Né(e) le · 4 = Sexe */
    if (map.full === -1 && map.last === -1 && map.first === -1 && header.length) map.full = 0;
    if (map.sex === -1 && header.length >= 4) {
      for (var i = 0; i < header.length; i++) {
        if (i === map.full || i === map.last || i === map.first) continue;
        if (HEADER_IGNORE.test(String(header[i]).trim())) continue;
        if (/^sexe?$/i.test(String(header[i]).trim())) { map.sex = i; break; }
      }
    }
    return map;
  }

  /* Repli sur le contenu : si aucun en-tête ne dit « sexe », on cherche la
     colonne dont les valeurs ressemblent à Masculin / Féminin. */
  function guessSexColumn(rows, startRow, exclude) {
    if (!rows.length) return -1;
    var cols = rows[0].length;
    for (var c = 0; c < cols; c++) {
      if (exclude.indexOf(c) > -1) continue;
      var seen = 0, ok = 0;
      for (var r = startRow; r < Math.min(rows.length, startRow + 12); r++) {
        var v = String((rows[r] || [])[c] || '').trim();
        if (!v) continue;
        seen++;
        if (normSex(v) !== 'X') ok++;
      }
      if (seen >= 2 && ok === seen) return c;
    }
    return -1;
  }

  function normSex(v) {
    var s = String(v || '').trim().toUpperCase();
    if (/^(F|FEM|FEMININ|FÉMININ|FILLE|MME|MADEMOISELLE|2)$/.test(s)) return 'F';
    if (/^(M|G|MAS|MASCULIN|GARCON|GARÇON|H|HOMME|1)$/.test(s)) return 'M';
    return 'X';
  }

  function splitFullName(v) {
    /* « DUPONT Marie » ou « Dupont, Marie » — heuristique : les mots tout en
       majuscules sont le nom de famille. */
    var s = String(v || '').trim().replace(/\s+/g, ' ');
    if (s.indexOf(',') > -1) {
      var p = s.split(',');
      return { last: p[0].trim(), first: (p[1] || '').trim() };
    }
    var words = s.split(' ');
    var upper = [], rest = [];
    words.forEach(function (w) {
      if (w.length > 1 && w === w.toLocaleUpperCase('fr') && /[A-ZÀ-Ý]/.test(w) && !rest.length) upper.push(w);
      else rest.push(w);
    });
    if (upper.length && rest.length) return { last: upper.join(' '), first: rest.join(' ') };
    return { last: words.slice(0, 1).join(' '), first: words.slice(1).join(' ') };
  }

  function rowsToStudents(rows, map, hasHeader) {
    var out = [], start = hasHeader ? 1 : 0;
    for (var i = start; i < rows.length; i++) {
      var r = rows[i], first = '', last = '';
      if (map.full > -1 && map.first === -1 && map.last === -1) {
        var sp = splitFullName(r[map.full]);
        first = sp.first; last = sp.last;
      } else {
        first = map.first > -1 ? String(r[map.first] || '').trim() : '';
        last = map.last > -1 ? String(r[map.last] || '').trim() : '';
      }
      if (!first && !last) continue;
      out.push({
        id: uid('stu'),
        first: titleCase(first),
        last: last.toLocaleUpperCase('fr'),
        sex: map.sex > -1 ? normSex(r[map.sex]) : 'X',
        group: map.group > -1 ? String(r[map.group] || '').trim() : '',
        note: ''
      });
    }
    return out;
  }

  function titleCase(s) {
    return String(s || '').toLocaleLowerCase('fr').replace(/(^|[\s'\-])([\p{L}])/gu, function (m, a, b) {
      return a + b.toLocaleUpperCase('fr');
    });
  }

  /* ----------------------------------------------------------------- images
     Les images jointes aux messages sont stockées en clair dans la sauvegarde :
     on les réduit avant enregistrement, sinon deux photos suffisent à saturer
     le stockage local du navigateur. */
  /* ------------------------------------------------------- poids du stockage
     Tout tient dans le stockage local du navigateur, plafonné à ~5 Mo par
     adresse. Le texte ne pèse rien ; ce sont les images (schémas et
     illustrations de messages) qui remplissent l'espace, chacune quelques
     dizaines de kilo-octets. D'où ces trois outils : mesurer, détailler,
     et alléger. */
  var STORAGE_LIMIT = 5 * 1024 * 1024;

  /* Parcourt toutes les images du modèle, quelles qu'en soient les clés. */
  function eachImage(obj, fn, chemin) {
    if (!obj || typeof obj !== 'object') return;
    Object.keys(obj).forEach(function (k) {
      var v = obj[k];
      if (typeof v === 'string') {
        if (v.slice(0, 11) === 'data:image/') fn(obj, k, v, (chemin || '') + '/' + k);
      } else if (v && typeof v === 'object') {
        eachImage(v, fn, (chemin || '') + '/' + k);
      }
    });
  }

  function storageInfo() {
    var raw = '';
    try { raw = JSON.stringify(state); } catch (e) { raw = ''; }
    var total = raw.length;
    var images = 0, nb = 0;
    eachImage(state, function (o, k, v) { images += v.length; nb++; });
    return {
      total: total, images: images, nbImages: nb,
      texte: Math.max(0, total - images),
      limite: STORAGE_LIMIT,
      pct: Math.min(100, Math.round(total / STORAGE_LIMIT * 100)),
      ok: lastSaveOk
    };
  }

  /* Recompresse sur place toutes les images enregistrées. C'est le geste qui
     débloque un stockage plein : l'écriture qui suit est plus petite que ce
     qui est déjà en place, elle passe donc même quand tout est saturé. */
  function shrinkImages(opts, cb) {
    opts = opts || {};
    var maxPx = opts.maxPx || 720, q = opts.quality || 0.7;
    var cibles = [];
    eachImage(state, function (o, k, v) { cibles.push({ o: o, k: k, v: v }); });
    if (!cibles.length) { cb && cb({ nb: 0, avant: 0, apres: 0 }); return; }

    var avant = cibles.reduce(function (a, x) { return a + x.v.length; }, 0);
    var restant = cibles.length, change = 0;

    cibles.forEach(function (x) {
      var img = new Image();
      img.onload = function () {
        try {
          var scale = Math.min(1, maxPx / Math.max(img.width, img.height));
          var w = Math.max(1, Math.round(img.width * scale));
          var h = Math.max(1, Math.round(img.height * scale));
          var c = document.createElement('canvas');
          c.width = w; c.height = h;
          var ctx = c.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          var out = c.toDataURL('image/jpeg', q);
          if (out.length < x.v.length) { x.o[x.k] = out; change++; }
        } catch (err) { /* image illisible : on la laisse telle quelle */ }
        if (!--restant) fin();
      };
      img.onerror = function () { if (!--restant) fin(); };
      img.src = x.v;
    });

    function fin() {
      var apres = 0;
      eachImage(state, function (o, k, v) { apres += v.length; });
      save(true);
      emit();
      cb && cb({ nb: change, total: cibles.length, avant: avant, apres: apres });
    }
  }

  function readImageCompressed(file, maxPx, cb) {
    /* 800 px et une compression franche : un schéma de terrain reste lisible
       sur une tablette, et pèse trois fois moins qu'une photo brute. */
    maxPx = maxPx || 800;
    var fr = new FileReader();
    fr.onload = function () {
      var src = fr.result;
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, maxPx / Math.max(img.width, img.height));
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));
        try {
          var c = document.createElement('canvas');
          c.width = w; c.height = h;
          var ctx = c.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          var out = c.toDataURL('image/jpeg', 0.75);
          cb(out.length < src.length ? out : src);
        } catch (err) { cb(src); }
      };
      img.onerror = function () { cb(null); };
      img.src = src;
    };
    fr.onerror = function () { cb(null); };
    fr.readAsDataURL(file);
  }

  function pickImage(cb, maxPx) {
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*';
    inp.onchange = function () {
      var f = inp.files && inp.files[0];
      if (!f) return;
      readImageCompressed(f, maxPx, function (data) {
        if (!data) { notify('Image illisible.'); return; }
        if (data.length > 1500000) { notify('Image trop lourde même après réduction — choisis-en une plus petite.'); return; }
        cb(data);
      });
    };
    inp.click();
  }

  /* ------------------------------------------------- sauvegarde / restauration */

  function exportJSON() {
    return JSON.stringify(state, null, 2);
  }

  function importJSON(text, mergeMode) {
    var obj = JSON.parse(text);
    if (!obj || obj.app !== 'ultimate-eps') throw new Error('Ce fichier ne vient pas de Ultimate EPS.');
    var incoming = migrate(obj);
    if (mergeMode === 'replace') {
      state = incoming;
    } else {
      Object.keys(incoming.classes).forEach(function (k) { state.classes[k] = incoming.classes[k]; });
      Object.keys(incoming.lessons).forEach(function (k) { state.lessons[k] = incoming.lessons[k]; });
      Object.keys(incoming.grids).forEach(function (k) { state.grids[k] = incoming.grids[k]; });
    }
    save(true); emit();
  }

  function download(filename, content, mime) {
    var blob = new Blob([content], { type: mime || 'application/json;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);
  }

  function toCSV(rows) {
    return rows.map(function (r) {
      return r.map(function (c) {
        var s = String(c == null ? '' : c);
        return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(';');
    }).join('\r\n');
  }

  return {
    uid: uid, clamp: clamp, sum: sum, mean: mean, sd: sd, variance: variance,
    round: round, pct: pct, todayISO: todayISO, frDate: frDate, sortBy: sortBy,
    shuffle: shuffle, rngFrom: rngFrom, pearson: pearson, escapeHtml: escapeHtml,
    gaussSolve: gaussSolve, ridgeSparse: ridgeSparse,
    DEFAULT_CRITERIA: DEFAULT_CRITERIA, DEFAULT_LEVELS: DEFAULT_LEVELS,
    DEFAULT_STAT_FIELDS: DEFAULT_STAT_FIELDS, SOURCE_PRESETS: SOURCE_PRESETS,
    defaultMatchConfig: defaultMatchConfig,
    TEAM_COLORS: TEAM_COLORS, TEAM_NAMES: TEAM_NAMES, TEAM_PALETTE: TEAM_PALETTE,
    MIN_TEAM_SIZE: MIN_TEAM_SIZE, MAX_TEAM_SIZE: MAX_TEAM_SIZE,
    KIOSK_CODE: KIOSK_CODE,
    TERRAINS: TERRAINS, MAX_TERRAINS: MAX_TERRAINS,
    defaultSettings: defaultSettings, newState: newState, migrate: migrate,
    load: load, save: save, get: get, set: set, setQuiet: setQuiet, persistAs: persistAs,
    onChange: onChange, emit: emit,
    notify: notify, setNotifier: setNotifier,
    currentClass: currentClass, currentLesson: currentLesson,
    classLessons: classLessons, studentsOf: studentsOf, studentById: studentById,
    displayName: displayName, shortName: shortName, criteria: criteria, critById: critById,
    newClass: newClass, newLesson: newLesson,
    parseCSV: parseCSV, detectDelimiter: detectDelimiter, readFileSmart: readFileSmart,
    guessMapping: guessMapping, guessSexColumn: guessSexColumn,
    rowsToStudents: rowsToStudents, normSex: normSex, HEADER_IGNORE: HEADER_IGNORE,
    exportJSON: exportJSON, importJSON: importJSON, download: download, toCSV: toCSV,
    readImageCompressed: readImageCompressed, pickImage: pickImage,
    storageInfo: storageInfo, shrinkImages: shrinkImages, saveOk: saveOk,
    eachImage: eachImage, STORAGE_LIMIT: STORAGE_LIMIT
  };
})();
</script>
<script>
/* ============================================================================
   Ultimate EPS — progressivité individuelle dans les situations
   ----------------------------------------------------------------------------
   Une situation peut comporter plusieurs PALIERS ordonnés (ex. « passes à 5 m »,
   « à 8 m », « à 11 m »). Chaque palier définit deux seuils, qui découpent le
   score en trois bandes, chacune porteuse d'un message :

        score < seuil bas      →  AIDE          critères de réalisation
        entre les deux         →  RECOMMANDATION placement, intention, consigne
        score ≥ seuil haut     →  COMPLEXIFICATION  on monte d'un palier

   Le message produit est mémorisé par élève : il reste consultable même s'il a
   été fermé par mégarde, et il sert de recommandation au passage suivant. À ce
   passage, l'élève déclare le palier qu'il choisit — on enregistre s'il a suivi
   ou non la recommandation, ce qui est en soi une information intéressante.
   ========================================================================== */
'use strict';

var PROGRESS = (function () {

  var A = APP;

  var BANDS = {
    aide: { key: 'aide', label: 'Critères de réalisation', cls: 'warn', icon: '◆' },
    reco: { key: 'reco', label: 'Recommandation', cls: 'accent', icon: '▶' },
    plus: { key: 'plus', label: 'Complexification', cls: 'ok', icon: '▲' }
  };

  /* Déplacements possibles d'un palier à l'autre, programmables bande par bande. */
  var MOVES = [
    { id: 'prev2', label: 'Redescendre de 2 paliers', delta: -2 },
    { id: 'prev', label: 'Redescendre d\'un palier', delta: -1 },
    { id: 'stay', label: 'Rester à ce palier', delta: 0 },
    { id: 'next', label: 'Monter d\'un palier', delta: 1 },
    { id: 'next2', label: 'Sauter 2 paliers', delta: 2 }
  ];
  function deltaOf(move) {
    for (var i = 0; i < MOVES.length; i++) if (MOVES[i].id === move) return MOVES[i].delta;
    return 0;
  }

  function newLevel(order, name) {
    return {
      id: A.uid('lvl'),
      order: order,
      name: name || ('Palier ' + (order + 1)),
      consigne: '',
      seuilBas: null,
      seuilHaut: null,
      msgAide: '', msgReco: '', msgPlus: '',
      imgAide: '', imgReco: '', imgPlus: '',
      actionAide: 'stay',
      actionReco: 'stay',
      actionPlus: 'next'
    };
  }

  function levelsOf(sit) {
    return A.sortBy(sit.levels || [], function (l) { return l.order == null ? 0 : l.order; });
  }

  /* ------------------------------------------------ couleur d'un palier
     Le premier palier tire vers l'orange, le dernier vers le vert foncé :
     de loin, dans le gymnase, la couleur suffit à savoir où en est un groupe
     sans lire le nom du palier. Le dégradé s'étale toujours sur le nombre de
     paliers réellement définis, qu'il y en ait deux ou sept.
     Trois valeurs sortent d'ici : l'encre du thème clair, une version
     éclaircie pour le thème sombre, et un fond translucide qui convient aux
     deux. Elles voyagent dans des variables CSS posées sur l'élément. */
  var LEVEL_RAMP = [
    [191, 98, 16],    // orange
    [166, 122, 12],   // ambre
    [110, 140, 25],   // vert-olive
    [45, 122, 62],    // vert
    [17, 82, 46]      // vert foncé
  ];

  function levelShade(i, n) {
    var t = (n <= 1) ? 0 : Math.max(0, Math.min(1, i / (n - 1)));
    var pos = t * (LEVEL_RAMP.length - 1);
    var k = Math.min(LEVEL_RAMP.length - 2, Math.floor(pos));
    var f = pos - k;
    var c = [0, 1, 2].map(function (j) {
      return Math.round(LEVEL_RAMP[k][j] + (LEVEL_RAMP[k + 1][j] - LEVEL_RAMP[k][j]) * f);
    });
    var lite = c.map(function (v) { return Math.round(v + (255 - v) * 0.45); });
    var ink = 'rgb(' + c.join(',') + ')';
    return {
      ink: ink,
      lite: 'rgb(' + lite.join(',') + ')',
      soft: 'rgba(' + c.join(',') + ',.14)',
      style: '--lv:rgb(' + c.join(',') + ');--lv-lite:rgb(' + lite.join(',') +
        ');--lv-soft:rgba(' + c.join(',') + ',.14)'
    };
  }

  /* Couleur d'un palier donné à l'intérieur de sa situation. */
  function levelColor(sit, levelId) {
    var ls = levelsOf(sit);
    for (var i = 0; i < ls.length; i++) if (ls[i].id === levelId) return levelShade(i, ls.length);
    return levelShade(0, 1);
  }
  function levelById(sit, id) {
    var ls = sit.levels || [];
    for (var i = 0; i < ls.length; i++) if (ls[i].id === id) return ls[i];
    return null;
  }
  function firstLevel(sit) {
    var ls = levelsOf(sit);
    return ls.length ? ls[0] : null;
  }
  function neighbour(sit, levelId, dir) {
    var ls = levelsOf(sit);
    for (var i = 0; i < ls.length; i++) {
      if (ls[i].id === levelId) {
        var j = A.clamp(i + dir, 0, ls.length - 1);
        return ls[j];
      }
    }
    return ls.length ? ls[0] : null;
  }

  /* Quelle bande, quel message, quel palier ensuite ? */
  function evaluateAttempt(sit, levelId, value) {
    var lv = levelById(sit, levelId) || firstLevel(sit);
    if (!lv) return null;
    var v = +value;
    var high = sit.direction === 'low' ? false : true;
    var band;
    var lo = lv.seuilBas, hi = lv.seuilHaut;

    var above = function (x, t) { return high ? x >= t : x <= t; };

    if (hi != null && hi !== '' && above(v, +hi)) band = 'plus';
    else if (lo != null && lo !== '' && !above(v, +lo)) band = 'aide';
    else band = 'reco';

    var move = band === 'plus' ? (lv.actionPlus || 'next')
      : band === 'aide' ? (lv.actionAide || 'stay')
      : (lv.actionReco || 'stay');
    var d = deltaOf(move);
    var nextLevel = d ? neighbour(sit, lv.id, d) : lv;

    var text = band === 'plus' ? lv.msgPlus : (band === 'aide' ? lv.msgAide : lv.msgReco);
    var image = band === 'plus' ? lv.imgPlus : (band === 'aide' ? lv.imgAide : lv.imgReco);
    if (!text) {
      text = band === 'plus'
        ? 'Objectif atteint. Passe au palier suivant.'
        : (band === 'aide' ? 'Reprends les critères de réalisation avant de complexifier.'
          : 'Continue à ce palier et cherche à stabiliser ta réussite.');
    }

    return {
      band: band,
      bandInfo: BANDS[band],
      text: text,
      image: image || '',
      move: move,
      levelId: lv.id,
      levelName: lv.name,
      nextLevelId: nextLevel ? nextLevel.id : lv.id,
      nextLevelName: nextLevel ? nextLevel.name : lv.name,
      changed: !!(nextLevel && nextLevel.id !== lv.id),
      nextConsigne: nextLevel ? nextLevel.consigne : ''
    };
  }

  /* Après enregistrement d'une tentative, on met à jour l'état de chaque membre
     du groupe : palier recommandé pour la prochaine fois + message consultable. */
  function applyAttempt(sit, attempt) {
    if (!sit.levels || !sit.levels.length) return null;
    var ev = evaluateAttempt(sit, attempt.levelId, attempt.value);
    if (!ev) return null;
    sit.progress = sit.progress || {};
    (attempt.members || []).forEach(function (sid) {
      var p = sit.progress[sid] || { history: [] };
      p.levelId = ev.levelId;
      p.recommendedLevelId = ev.nextLevelId;
      p.message = {
        band: ev.band, text: ev.text, image: ev.image, levelName: ev.levelName,
        nextLevelId: ev.nextLevelId, nextLevelName: ev.nextLevelName, changed: ev.changed,
        nextConsigne: ev.nextConsigne,
        score: attempt.value,
        /* l'horodatage vient de la tentative : rejouer l'historique après une
           suppression ne doit pas faire croire que tout vient d'arriver */
        at: attempt.ts || new Date().toISOString(),
        dismissed: false,
        attemptId: attempt.id
      };
      p.history = (p.history || []).concat([{
        attemptId: attempt.id, levelId: ev.levelId, value: attempt.value,
        band: ev.band, at: p.message.at
      }]).slice(-30);
      sit.progress[sid] = p;
    });
    return ev;
  }

  /* ------------------------------------------------ effacer une tentative
     Supprimer une tentative ne suffit pas : le palier atteint, la
     recommandation et le message qui en découlaient resteraient en place, et
     un essai fait par l'enseignant avant le cours fausserait les
     recommandations données aux élèves. On reconstruit donc tout l'état de la
     situation en rejouant, dans l'ordre, les tentatives qui restent.
     Les messages déjà lus le restent : inutile de les rouvrir. */
  function rebuild(sit) {
    var lus = {};
    Object.keys(sit.progress || {}).forEach(function (sid) {
      var m = sit.progress[sid].message;
      if (m && m.dismissed && m.attemptId) lus[m.attemptId] = 1;
    });

    sit.progress = {};
    var ordre = (sit.attempts || []).slice().sort(function (a, b) {
      return String(a.ts || '').localeCompare(String(b.ts || ''));
    });
    ordre.forEach(function (at) { applyAttempt(sit, at); });

    Object.keys(sit.progress).forEach(function (sid) {
      var m = sit.progress[sid].message;
      if (m && lus[m.attemptId]) m.dismissed = true;
    });
    return sit;
  }

  /* Efface une tentative et tout ce qu'elle avait produit. */
  function removeAttempt(sit, attemptId) {
    var avant = (sit.attempts || []).length;
    sit.attempts = (sit.attempts || []).filter(function (a) { return a.id !== attemptId; });
    rebuild(sit);
    return avant !== (sit.attempts || []).length;
  }

  /* Remise à zéro complète : plus aucun score, plus aucune recommandation.
     C'est ce qu'il faut après avoir essayé la situation soi-même. */
  function clearAttempts(sit) {
    var n = (sit.attempts || []).length;
    sit.attempts = [];
    sit.progress = {};
    return n;
  }

  /* Palier recommandé pour un élève au prochain passage. */
  function recommendedLevel(sit, sid) {
    var p = (sit.progress || {})[sid];
    if (p && p.recommendedLevelId && levelById(sit, p.recommendedLevelId)) return p.recommendedLevelId;
    var f = firstLevel(sit);
    return f ? f.id : null;
  }

  /* Recommandation pour un groupe : le palier le plus bas de ses membres, pour
     que personne ne soit mis en difficulté par la tâche commune. */
  function recommendedLevelForGroup(sit, members) {
    var ls = levelsOf(sit);
    if (!ls.length) return null;
    var best = null, bestOrder = Infinity;
    (members || []).forEach(function (sid) {
      var id = recommendedLevel(sit, sid);
      var lv = levelById(sit, id);
      var o = lv ? (lv.order == null ? 0 : lv.order) : 0;
      if (o < bestOrder) { bestOrder = o; best = id; }
    });
    return best || ls[0].id;
  }

  function messageFor(sit, sid) {
    var p = (sit.progress || {})[sid];
    return p && p.message ? p.message : null;
  }
  function dismissMessage(sit, sid, val) {
    var p = (sit.progress || {})[sid];
    if (p && p.message) p.message.dismissed = val !== false;
  }

  /* Taux de suivi de la recommandation, indicateur d'autonomie de la classe. */
  function followRate(sit) {
    var n = 0, ok = 0;
    (sit.attempts || []).forEach(function (a) {
      if (!a.recommendedLevelId) return;
      n++;
      if (a.levelId === a.recommendedLevelId) ok++;
    });
    return n ? { n: n, ok: ok, rate: ok / n } : null;
  }

  /* Répartition de la classe par palier, pour la vue enseignant. */
  function levelSpread(sit, studentIds) {
    var ls = levelsOf(sit), out = {};
    ls.forEach(function (l) { out[l.id] = []; });
    (studentIds || []).forEach(function (sid) {
      var id = recommendedLevel(sit, sid);
      if (out[id]) out[id].push(sid);
      else if (ls.length) out[ls[0].id].push(sid);
    });
    return { levels: ls, byLevel: out };
  }

  return {
    BANDS: BANDS, MOVES: MOVES, deltaOf: deltaOf,
    newLevel: newLevel, levelsOf: levelsOf, levelById: levelById,
    firstLevel: firstLevel, neighbour: neighbour,
    evaluateAttempt: evaluateAttempt, applyAttempt: applyAttempt,
    recommendedLevel: recommendedLevel, recommendedLevelForGroup: recommendedLevelForGroup,
    messageFor: messageFor, dismissMessage: dismissMessage,
    followRate: followRate, levelSpread: levelSpread,
    levelShade: levelShade, levelColor: levelColor,
    rebuild: rebuild, removeAttempt: removeAttempt, clearAttempts: clearAttempts
  };
})();
</script>
<script>
/* ============================================================================
   Ultimate EPS — moteur d'indices
   ----------------------------------------------------------------------------
   Chaîne de calcul, dans l'ordre :

   1. SITUATIONS D'ENTRAÎNEMENT
      Les scores bruts d'une situation sont normalisés en z-score au sein de la
      classe (une situation n'a pas d'échelle universelle : « 14 passes » ne veut
      rien dire seul). Quand une tentative est réalisée par un groupe de 2 à 8
      élèves, on ne peut pas attribuer le score à un seul : on résout un système
      de moindres carrés régularisé (ridge) où chaque élève a une contribution
      individuelle inconnue, et où chaque tentative dit « la moyenne des
      contributions de ce groupe vaut z ». Si les partenaires tournent entre les
      tentatives, le système devient identifiable et sépare l'élève de ses
      partenaires — c'est le principe du « plus-minus ajusté ».

   2. STATISTIQUES DE MATCH
      Les comptages bruts ne sont pas comparables d'un match à l'autre. On passe
      par des indicateurs dérivés rapportés aux possessions, puis z-score.

   3. OBSERVATION ENSEIGNANT
      Des + / − convertis en petit signal.

   4. RÉSULTAT DES MATCHS
      Calculé APRÈS les trois précédents, pour éviter toute circularité : on
      compare l'écart réel à l'écart attendu vu les indices des deux équipes, et
      seule la « surprise » alimente l'indice global (jamais les critères).

   Agrégation : moyenne glissante pondérée (EWMA) sur les leçons, puis régression
   vers la moyenne de classe proportionnelle au nombre d'observations, pour ne
   pas sur-interpréter un élève vu deux fois.
   ========================================================================== */
'use strict';

var RATINGS = (function () {

  var A = APP;
  var cache = { key: null, val: null };

  function zScale(values) {
    var m = A.mean(values), s = A.sd(values);
    return function (v) {
      if (!s) return 0;
      return A.clamp((v - m) / s, -2.5, 2.5);
    };
  }

  /* --------------------------------------------- 1. situations d'entraînement */

  /* Retourne { sid: contribution } pour une situation donnée, plus un
     diagnostic de brassage des partenaires.

     Attention aux PALIERS : 15 passes à 5 m et 15 passes à 8 m ne valent pas
     la même chose. On normalise donc À L'INTÉRIEUR de chaque palier (dès qu'il
     compte assez de tentatives), puis on ajoute une prime de palier
     proportionnelle à l'écart au palier moyen de la classe. Sans cela, un élève
     qui accepte de se complexifier la tâche serait pénalisé pour l'avoir fait. */
  function situationContributions(sit, lambda) {
    var attempts = (sit.attempts || []).filter(function (a) {
      return a && a.members && a.members.length && isFinite(+a.value);
    });
    var out = { contrib: {}, n: {}, attempts: attempts.length, mixing: null, partners: {}, levelUse: {} };
    if (!attempts.length) return out;

    var flip = sit.direction === 'low' ? -1 : 1;
    var levels = sit.levels || [];
    var orderOf = {};
    levels.forEach(function (lv, i) { orderOf[lv.id] = (lv.order != null ? lv.order : i); });
    var step = sit.levelStep == null ? 0.8 : +sit.levelStep;

    /* Échelle globale (repli) + une échelle par palier suffisamment fourni */
    var zGlobal = zScale(attempts.map(function (a) { return +a.value; }));
    var byLevel = {};
    attempts.forEach(function (a) {
      var k = a.levelId || '_';
      (byLevel[k] = byLevel[k] || []).push(+a.value);
    });
    var zByLevel = {};
    Object.keys(byLevel).forEach(function (k) {
      out.levelUse[k] = byLevel[k].length;
      zByLevel[k] = byLevel[k].length >= 3 ? zScale(byLevel[k]) : null;
    });
    var meanOrder = APP.mean(attempts.map(function (a) {
      return orderOf[a.levelId] != null ? orderOf[a.levelId] : 0;
    }));

    var z = function (a) {
      var k = a.levelId || '_';
      var base = (zByLevel[k] || zGlobal)(+a.value) * flip;
      if (levels.length > 1 && a.levelId && orderOf[a.levelId] != null)
        base += (orderOf[a.levelId] - meanOrder) * step;
      return APP.clamp(base, -2.8, 2.8);
    };

    var cols = [], index = {};
    attempts.forEach(function (a) {
      a.members.forEach(function (sid) {
        if (index[sid] === undefined) { index[sid] = cols.length; cols.push(sid); }
      });
    });

    var rows = [], ys = [];
    attempts.forEach(function (a) {
      var r = {}, w = 1 / a.members.length;
      a.members.forEach(function (sid) { r[index[sid]] = (r[index[sid]] || 0) + w; });
      rows.push(r);
      ys.push(z(a));
      a.members.forEach(function (sid) {
        out.n[sid] = (out.n[sid] || 0) + 1;
        out.partners[sid] = out.partners[sid] || {};
        a.members.forEach(function (o) { if (o !== sid) out.partners[sid][o] = 1; });
      });
    });

    var w = A.ridgeSparse(rows, ys, cols.length, lambda);
    cols.forEach(function (sid, i) { out.contrib[sid] = A.clamp(w[i], -2.5, 2.5); });

    /* Diagnostic de brassage : combien de partenaires distincts en moyenne ? */
    var solo = attempts.every(function (a) { return a.members.length === 1; });
    if (solo) out.mixing = { solo: true, avgPartners: 0, ok: true };
    else {
      var counts = cols.map(function (sid) { return Object.keys(out.partners[sid] || {}).length; });
      var avg = A.mean(counts);
      out.mixing = { solo: false, avgPartners: A.round(avg, 1), ok: avg >= 3 };
    }
    return out;
  }

  /* ------------------------------------------------ 2. indicateurs de match */

  /* Trois comptages seulement, donc trois indicateurs simples et lisibles.
     Le pourcentage de réussite dit la maîtrise technique ; le volume de passes
     réussies dit la capacité à faire vivre le disque ; les interceptions disent
     l'activité défensive. */
  function indicatorValues(s) {
    var pOk = +s.passOk || 0, pKo = +s.passKo || 0;
    return {
      passAcc: (pOk + pKo) > 0 ? pOk / (pOk + pKo) : null,
      passVol: pOk,
      intercepts: +s.intercept || 0
    };
  }

  /* Une interception de l'adversaire EST une passe ratée : inutile de la
     compter deux fois à la main. L'observateur ne tape « passe ratée » que
     pour les pertes non interceptées (lâcher, sortie de terrain) ; les
     interceptions relevées en face viennent s'y ajouter automatiquement.
     Vrai uniquement en relevé par équipe : par joueur, on ne sait pas à qui
     de l'équipe adverse attribuer la passe manquée. */
  function effectiveTeamStats(m, teamId) {
    var raw = (m.stats || {})[teamId];
    if (!raw) return null;
    var otherId = teamId === m.teamA ? m.teamB : m.teamA;
    var other = (m.stats || {})[otherId] || {};
    var auto = m.granularity === 'player' ? 0 : (+other.intercept || 0);
    return {
      passOk: +raw.passOk || 0,
      passKo: (+raw.passKo || 0) + auto,
      passKoSaisies: +raw.passKo || 0,
      passKoInterceptees: auto,
      intercept: +raw.intercept || 0
    };
  }

  /* Quel critère porte le fair-play ? L'enseignant peut les renommer : on le
     repère par son nom, et à défaut on prend le dernier de la liste. */
  function fairCriterion(crits) {
    crits = crits || APP.criteria();
    return crits.filter(function (c) { return /fair|esprit/i.test(c.name); })[0] || crits[crits.length - 1] || null;
  }

  /* Qui a réellement joué ? Un élève déclaré blessé ou absent APRÈS la
     composition reste inscrit dans son équipe : sans ce filtre, il recevrait
     les relevés collectifs d'un match qu'il a regardé depuis le banc. Son
     indice ne doit bouger que par l'appréciation de son rôle. */
  function playing(lesson, ids) {
    var att = lesson.attendance || {};
    return (ids || []).filter(function (sid) { return (att[sid] || 'present') === 'present'; });
  }

  function teamMembers(lesson, teamId) {
    for (var i = 0; i < (lesson.teams || []).length; i++)
      if (lesson.teams[i].id === teamId) return playing(lesson, lesson.teams[i].members);
    return [];
  }

  /* --------------------------------------------------- moteur principal */

  function compute(classId) {
    var st = A.get();
    var key = classId + '|' + st.savedAt + '|' + JSON.stringify(st.settings.sources) +
      '|' + st.settings.ewma + '|' + st.settings.shrinkK + '|' + st.settings.ridgeLambda +
      '|' + st.settings.criteria.map(function (c) { return c.id + c.weight; }).join(',');
    if (cache.key === key) return cache.val;

    var cls = st.classes[classId];
    var crits = st.settings.criteria;
    var srcW = st.settings.sources;
    var lessons = A.classLessons(classId);
    var res = {
      classId: classId,
      byStudent: {},
      lessons: lessons.map(function (l) { return { id: l.id, title: l.title, date: l.date }; }),
      diagnostics: { situations: [], matchFit: null, statPools: {} },
      warnings: []
    };
    if (!cls) { cache = { key: key, val: res }; return res; }

    cls.students.forEach(function (s) {
      var c = {};
      crits.forEach(function (cr) { c[cr.id] = { z: 0, n: 0, series: [] }; });
      res.byStudent[s.id] = {
        id: s.id, crit: c, global: { z: 0, n: 0, series: [] },
        result: { z: 0, n: 0 }, nObs: 0, history: []
      };
    });

    /* ---- Pass 0 : pools de normalisation pour les indicateurs de match ---- */
    var poolsTeam = {}, poolsPlayer = {};
    st.settings.statIndicators.forEach(function (ind) { poolsTeam[ind.id] = []; poolsPlayer[ind.id] = []; });

    lessons.forEach(function (lesson) {
      (lesson.matches || []).forEach(function (m) {
        if (!m.stats) return;
        var entries = Object.keys(m.stats);
        if (m.granularity === 'player') {
          entries.forEach(function (sid) {
            var iv = indicatorValues(m.stats[sid]);
            Object.keys(iv).forEach(function (k) { if (iv[k] != null && isFinite(iv[k])) poolsPlayer[k] && poolsPlayer[k].push(iv[k]); });
          });
        } else {
          [m.teamA, m.teamB].forEach(function (tid) {
            var s = effectiveTeamStats(m, tid); if (!s) return;
            var iv = indicatorValues(s);
            Object.keys(iv).forEach(function (k) { if (iv[k] != null && isFinite(iv[k])) poolsTeam[k] && poolsTeam[k].push(iv[k]); });
          });
        }
      });
    });
    var zTeam = {}, zPlayer = {};
    Object.keys(poolsTeam).forEach(function (k) {
      zTeam[k] = poolsTeam[k].length > 2 ? zScale(poolsTeam[k]) : null;
      zPlayer[k] = poolsPlayer[k].length > 2 ? zScale(poolsPlayer[k]) : null;
      res.diagnostics.statPools[k] = { team: poolsTeam[k].length, player: poolsPlayer[k].length };
    });

    /* ---- Pass 1 : signaux par leçon (hors résultat de match) ---- */
    var perLesson = [];   // [{lessonId, sig: {sid: {critId: [{v, wt}]}}}]

    lessons.forEach(function (lesson) {
      var sig = {};
      var push = function (sid, critId, v, wt) {
        if (!res.byStudent[sid] || !isFinite(v) || !wt) return;
        sig[sid] = sig[sid] || {};
        sig[sid][critId] = sig[sid][critId] || [];
        sig[sid][critId].push({ v: v, wt: wt });
      };

      /* 1a. situations */
      (lesson.situations || []).forEach(function (sit) {
        /* Échauffement mené en confrontation : pas de paliers ni de ridge,
           mais deux équipes et deux scores. L'écart relatif entre les deux
           donne un signal collectif, dilué comme celui des relevés d'équipe :
           il ne distingue pas les joueurs à l'intérieur d'une équipe. */
        if (sit.format === 'match') {
          var targetsD = sit.targets || {};
          /* L'échauffement peut s'être composé ses propres équipes : c'est là
             qu'il faut lire les effectifs, pas dans celles de la leçon. */
          var eqD = (sit.ownTeams && (sit.teams || []).length) ? sit.teams : (lesson.teams || []);
          var membresD = function (tid) {
            for (var q = 0; q < eqD.length; q++) if (eqD[q].id === tid) return playing(lesson, eqD[q].members);
            return [];
          };
          (sit.duels || []).forEach(function (du) {
            if (du.scoreA == null || du.scoreB == null) return;
            var a = +du.scoreA, b = +du.scoreB;
            if (!isFinite(a) || !isFinite(b)) return;
            var total = Math.max(1, a + b);
            var marge = (a - b) / total;             // −1 … +1, indépendant du barème
            [[du.teamA, marge], [du.teamB, -marge]].forEach(function (pair) {
              var mem = membresD(pair[0]);
              if (!mem.length) return;
              var zv = A.clamp(pair[1] * 1.8, -2, 2);
              crits.forEach(function (cr) {
                var t = +targetsD[cr.id] || 0;
                if (t <= 0) return;
                mem.forEach(function (sid) { push(sid, cr.id, zv, t * srcW.situations * 0.6); });
              });
            });
          });
          return;
        }
        var r = situationContributions(sit, st.settings.ridgeLambda);
        if (!r.attempts) return;
        res.diagnostics.situations.push({
          lessonId: lesson.id, lessonTitle: lesson.title, sitId: sit.id, name: sit.name,
          attempts: r.attempts, mixing: r.mixing
        });
        var targets = sit.targets || {};
        Object.keys(r.contrib).forEach(function (sid) {
          var reps = Math.min(3, r.n[sid] || 1);  // un élève vu 3 fois pèse plus qu'une fois
          crits.forEach(function (cr) {
            var t = +targets[cr.id] || 0;
            if (t > 0) push(sid, cr.id, r.contrib[sid], t * srcW.situations * reps);
          });
        });
      });

      /* 1b. statistiques de match */
      (lesson.matches || []).forEach(function (m) {
        if (!m.stats) return;
        if (m.granularity === 'player') {
          Object.keys(m.stats).forEach(function (sid) {
            if (playing(lesson, [sid]).length === 0) return;
            var iv = indicatorValues(m.stats[sid]);
            st.settings.statIndicators.forEach(function (ind) {
              var raw = iv[ind.id];
              if (raw == null || !isFinite(raw) || !zPlayer[ind.id]) return;
              var zv = zPlayer[ind.id](raw);
              Object.keys(ind.targets || {}).forEach(function (cid) {
                push(sid, cid, zv, ind.targets[cid] * srcW.matchStats);
              });
            });
          });
        } else {
          [m.teamA, m.teamB].forEach(function (tid) {
            var s = effectiveTeamStats(m, tid); if (!s) return;
            var members = teamMembers(lesson, tid);
            if (!members.length) return;
            var iv = indicatorValues(s);
            st.settings.statIndicators.forEach(function (ind) {
              var raw = iv[ind.id];
              if (raw == null || !isFinite(raw) || !zTeam[ind.id]) return;
              var zv = zTeam[ind.id](raw);
              Object.keys(ind.targets || {}).forEach(function (cid) {
                members.forEach(function (sid) {
                  /* signal collectif : dilué à 60 % car il ne distingue pas les joueurs */
                  push(sid, cid, zv, ind.targets[cid] * srcW.matchStats * 0.6);
                });
              });
            });
          });
        }
      });

      /* 1b bis. fair-play relevé sur les matchs.
         « Rien à signaler » crédite toute l'équipe d'un signal positif modéré ;
         les élèves explicitement distingués ou repris sont ajustés plus fort. */
      var fairCrit = fairCriterion(crits);
      (lesson.matches || []).forEach(function (m) {
        var fp = m.fairplay;
        if (!fp || !fairCrit) return;
        [m.teamA, m.teamB].forEach(function (tid) {
          var status = (fp.teams || {})[tid];
          if (!status) return;
          teamMembers(lesson, tid).forEach(function (sid) {
            var adj = (fp.adjust || {})[sid];
            var v = adj === 'plus' ? 1.6 : adj === 'minus' ? -1.6 : (status === 'ok' ? 0.6 : 0);
            if (!v && !adj) return;
            push(sid, fairCrit.id, v, srcW.observation * (adj ? 2 : 1));
          });
        });
      });

      /* 1b ter. fair-play relevé sur une situation ou un échauffement.
         Même barème que sur les matchs : « rien à signaler » crédite tout le
         groupe d'un signal positif modéré, les élèves distingués ou repris
         pèsent plus lourd. Cela ne concerne que les fiches où le fair-play est
         explicitement visé — sinon l'enseignant ne l'a pas observé. */
      (lesson.situations || []).forEach(function (sit) {
        var fp = sit.fairplay;
        if (!fp || !fairCrit) return;
        if (!((sit.targets || {})[fairCrit.id] > 0)) return;
        var unites = fp.units || {};
        Object.keys(unites).forEach(function (uid) {
          if (unites[uid] !== 'ok') return;
          playing(lesson, (fp.members && fp.members[uid]) || []).forEach(function (sid) {
            var adj = (fp.adjust || {})[sid];
            var v = adj === 'plus' ? 1.6 : adj === 'minus' ? -1.6 : 0.6;
            push(sid, fairCrit.id, v, srcW.observation * (adj ? 2 : 1));
          });
        });
        /* un élève ajusté dans une unité non validée compte quand même :
           l'enseignant l'a explicitement désigné */
        Object.keys(fp.adjust || {}).forEach(function (sid) {
          var dansUnite = Object.keys(unites).some(function (uid) {
            return unites[uid] === 'ok' && (fp.members && fp.members[uid] || []).indexOf(sid) > -1;
          });
          if (dansUnite) return;
          var v = fp.adjust[sid] === 'plus' ? 1.6 : -1.6;
          push(sid, fairCrit.id, v, srcW.observation * 2);
        });
      });

      /* 1c. observation enseignant */
      var obs = lesson.observations || {};
      Object.keys(obs).forEach(function (sid) {
        Object.keys(obs[sid] || {}).forEach(function (cid) {
          var o = obs[sid][cid] || {};
          var plus = +o.plus || 0, minus = +o.minus || 0;
          if (!plus && !minus) return;
          var net = plus - minus;
          push(sid, cid, A.clamp(net * 0.6, -2.2, 2.2), srcW.observation * Math.min(3, plus + minus));
        });
      });

      perLesson.push({ lessonId: lesson.id, lesson: lesson, sig: sig });
    });

    /* ---- Pass 2 : agrégation EWMA + régression vers la moyenne ---- */
    var alpha = A.clamp(st.settings.ewma, 0.05, 1);
    var K = Math.max(0, st.settings.shrinkK);

    var running = {};   // sid -> critId -> {s, n, started}
    cls.students.forEach(function (s) {
      running[s.id] = {};
      crits.forEach(function (cr) { running[s.id][cr.id] = { s: 0, n: 0, started: false }; });
    });

    perLesson.forEach(function (pl) {
      Object.keys(running).forEach(function (sid) {
        var sigS = pl.sig[sid] || {};
        crits.forEach(function (cr) {
          var arr = sigS[cr.id];
          var r = running[sid][cr.id];
          if (arr && arr.length) {
            var num = 0, den = 0;
            arr.forEach(function (o) { num += o.v * o.wt; den += o.wt; });
            var lv = den ? num / den : 0;
            r.s = r.started ? (alpha * lv + (1 - alpha) * r.s) : lv;
            r.started = true;
            r.n += arr.length;
          }
          res.byStudent[sid].crit[cr.id].series.push({
            lessonId: pl.lessonId,
            z: r.started ? r.s * (r.n / (r.n + K)) : null
          });
        });
      });
    });

    cls.students.forEach(function (s) {
      var tot = 0;
      crits.forEach(function (cr) {
        var r = running[s.id][cr.id];
        var z = r.started ? r.s * (r.n / (r.n + K)) : 0;
        res.byStudent[s.id].crit[cr.id].z = z;
        res.byStudent[s.id].crit[cr.id].n = r.n;
        res.byStudent[s.id].crit[cr.id].raw = r.started ? r.s : null;
        tot += r.n;
      });
      res.byStudent[s.id].nObs = tot;
    });

    /* Indice « de base » : moyenne pondérée des critères (sans résultat de match) */
    function baseZ(sid) {
      var num = 0, den = 0;
      crits.forEach(function (cr) {
        var w = +cr.weight || 0;
        if (!w) return;
        num += res.byStudent[sid].crit[cr.id].z * w;
        den += w;
      });
      return den ? num / den : 0;
    }
    cls.students.forEach(function (s) { res.byStudent[s.id].base = baseZ(s.id); });

    /* ---- Pass 3 : résultat des matchs (après coup, donc non circulaire) ---- */
    var fitX = [], fitY = [];
    var runRes = {};
    cls.students.forEach(function (s) { runRes[s.id] = { s: 0, n: 0, started: false }; });

    lessons.forEach(function (lesson) {
      (lesson.matches || []).forEach(function (m) {
        if (m.scoreA == null || m.scoreB == null) return;
        var ma = teamMembers(lesson, m.teamA), mb = teamMembers(lesson, m.teamB);
        if (!ma.length || !mb.length) return;
        var sA = +m.scoreA || 0, sB = +m.scoreB || 0;
        var tot = sA + sB;
        /* Marge normalisée : indépendante du barème (buts à 1 ou à 10 points). */
        var mn = tot > 0 ? (sA - sB) / tot : 0;
        var idxA = A.mean(ma.map(function (x) { return res.byStudent[x] ? res.byStudent[x].base : 0; }));
        var idxB = A.mean(mb.map(function (x) { return res.byStudent[x] ? res.byStudent[x].base : 0; }));
        var expected = A.clamp(0.35 * (idxA - idxB), -0.7, 0.7);
        var surprise = A.clamp(mn - expected, -1, 1);
        fitX.push(A.round(idxA - idxB, 3)); fitY.push(A.round(mn, 3));
        ma.forEach(function (sid) { if (runRes[sid]) { runRes[sid].s = runRes[sid].started ? alpha * surprise + (1 - alpha) * runRes[sid].s : surprise; runRes[sid].started = true; runRes[sid].n++; } });
        mb.forEach(function (sid) { if (runRes[sid]) { runRes[sid].s = runRes[sid].started ? alpha * (-surprise) + (1 - alpha) * runRes[sid].s : -surprise; runRes[sid].started = true; runRes[sid].n++; } });
      });
    });

    cls.students.forEach(function (s) {
      var r = runRes[s.id];
      var z = r.started ? r.s * (r.n / (r.n + K)) * 1.5 : 0;   // surprise ∈ [-1,1] → échelle z
      res.byStudent[s.id].result = { z: A.clamp(z, -2, 2), n: r.n };
      var wRes = A.clamp(srcW.matchResult, 0, 0.5);
      res.byStudent[s.id].global.z = (1 - wRes) * res.byStudent[s.id].base + wRes * res.byStudent[s.id].result.z;
      res.byStudent[s.id].global.n = res.byStudent[s.id].nObs + r.n;
      res.byStudent[s.id].index = display(res.byStudent[s.id].global.z);
      res.byStudent[s.id].reliability = reliability(res.byStudent[s.id].global.n);
    });

    /* Historique lisible pour la courbe de progression */
    cls.students.forEach(function (s) {
      var h = [];
      lessons.forEach(function (l, i) {
        var num = 0, den = 0, any = false;
        crits.forEach(function (cr) {
          var pt = res.byStudent[s.id].crit[cr.id].series[i];
          var w = +cr.weight || 0;
          if (pt && pt.z != null && w) { num += pt.z * w; den += w; any = true; }
        });
        h.push({ lessonId: l.id, title: l.title, date: l.date, index: any ? display(num / den) : null });
      });
      res.byStudent[s.id].history = h;
    });

    var r = A.pearson(fitX, fitY);
    res.diagnostics.matchFit = { r: r, n: fitX.length, points: fitX.map(function (x, i) { return { dx: x, margin: fitY[i] }; }) };

    cache = { key: key, val: res };
    return res;
  }

  function display(z) { return A.round(A.clamp(5 + 2 * z, 0, 10), 1); }
  function reliability(n) {
    if (n < 4) return { level: 'faible', cls: 'bad', n: n };
    if (n < 12) return { level: 'moyenne', cls: 'warn', n: n };
    return { level: 'bonne', cls: 'ok', n: n };
  }

  /* Indice utilisé pour composer les équipes : 5.0 par défaut si aucune donnée. */
  function indexOf(ratings, sid) {
    var r = ratings.byStudent[sid];
    return r ? r.index : 5;
  }

  function critDisplay(ratings, sid, critId) {
    var r = ratings.byStudent[sid];
    if (!r || !r.crit[critId]) return null;
    if (!r.crit[critId].n) return null;
    return display(r.crit[critId].z);
  }

  return {
    compute: compute, display: display, indexOf: indexOf, critDisplay: critDisplay,
    reliability: reliability, situationContributions: situationContributions,
    indicatorValues: indicatorValues, teamMembers: teamMembers,
    effectiveTeamStats: effectiveTeamStats, fairCriterion: fairCriterion, playing: playing
  };
})();

<script>
/* ============================================================================
   Ultimate EPS — composition des équipes
   ----------------------------------------------------------------------------
   On minimise une fonction de coût par recherche locale (échanges deux à deux)
   avec un peu de recuit simulé pour ne pas rester coincé dans un minimum local.

   Termes du coût :
     · équilibre des indices moyens entre équipes
     · équilibre des « locomotives » (le meilleur joueur de chaque équipe)
     · homogénéité interne (on évite « 3 forts + 2 faibles » face à 5 moyens)
     · mixité (équilibrée, non mixte, ou libre)
     · contraintes dures : élèves à séparer / à garder ensemble
     · churn : nombre d'élèves qui changent d'équipe par rapport à la leçon
       précédente, pondéré par le curseur de stabilité
   ========================================================================== */
'use strict';

var TEAMS = (function () {

  var A = APP;

  var W = {
    balance: 100,      // variance des moyennes d'équipe
    anchor: 26,        // variance du meilleur joueur par équipe
    spread: 14,        // écart d'homogénéité interne entre équipes
    mixite: 40,
    nonMix: 400,
    apart: 1000,
    together: 1000,
    size: 500,
    churn: 1           // multiplié par le curseur de stabilité (0 → 100)
  };

  function idealSizes(n, t) {
    var base = Math.floor(n / t), rest = n % t, out = [];
    for (var i = 0; i < t; i++) out.push(base + (i < rest ? 1 : 0));
    return out;
  }

  function cost(assign, ctx) {
    var t = ctx.teamCount, i, j;
    var members = [], idx = [];
    for (i = 0; i < t; i++) { members.push([]); idx.push([]); }
    for (i = 0; i < ctx.list.length; i++) {
      var a = assign[i];
      members[a].push(i);
      idx[a].push(ctx.list[i].index);
    }

    var c = 0;

    /* Tailles */
    for (i = 0; i < t; i++) {
      var d = Math.abs(members[i].length - ctx.sizes[i]);
      c += W.size * d * d;
      if (members[i].length < ctx.minSize || members[i].length > ctx.maxSize) c += W.size * 4;
    }

    /* Équilibre des moyennes */
    var means = idx.map(function (a) { return a.length ? A.mean(a) : ctx.globalMean; });
    c += W.balance * A.variance(means);

    /* Locomotives et homogénéité interne */
    var maxes = idx.map(function (a) { return a.length ? Math.max.apply(null, a) : ctx.globalMean; });
    c += W.anchor * A.variance(maxes);
    var spreads = idx.map(function (a) { return a.length > 1 ? A.sd(a) : 0; });
    c += W.spread * A.variance(spreads);

    /* Mixité */
    if (ctx.mixite === 'mixte' && ctx.girlsRatio > 0 && ctx.girlsRatio < 1) {
      for (i = 0; i < t; i++) {
        if (!members[i].length) continue;
        var g = 0;
        for (j = 0; j < members[i].length; j++) if (ctx.list[members[i][j]].sex === 'F') g++;
        var r = g / members[i].length;
        c += W.mixite * (r - ctx.girlsRatio) * (r - ctx.girlsRatio) * members[i].length;
      }
    } else if (ctx.mixite === 'nonmixte') {
      for (i = 0; i < t; i++) {
        var hasF = false, hasM = false;
        for (j = 0; j < members[i].length; j++) {
          if (ctx.list[members[i][j]].sex === 'F') hasF = true;
          else if (ctx.list[members[i][j]].sex === 'M') hasM = true;
        }
        if (hasF && hasM) c += W.nonMix;
      }
    }

    /* Contraintes dures */
    for (i = 0; i < ctx.apart.length; i++)
      if (assign[ctx.apart[i][0]] === assign[ctx.apart[i][1]]) c += W.apart;
    for (i = 0; i < ctx.together.length; i++)
      if (assign[ctx.together[i][0]] !== assign[ctx.together[i][1]]) c += W.together;

    /* Stabilité */
    if (ctx.churnWeight > 0 && ctx.prevSlot) {
      var moved = 0;
      for (i = 0; i < assign.length; i++) {
        var p = ctx.prevSlot[i];
        if (p != null && p !== assign[i]) moved++;
      }
      c += W.churn * ctx.churnWeight * moved;
    }

    return c;
  }

  function seedAssign(ctx, rng) {
    var n = ctx.list.length, t = ctx.teamCount;
    var assign = new Array(n).fill(-1);
    var counts = new Array(t).fill(0);

    /* 1. on replace d'abord les élèves dans l'équipe de la leçon précédente */
    if (ctx.prevSlot && ctx.churnWeight > 0) {
      for (var i = 0; i < n; i++) {
        var p = ctx.prevSlot[i];
        if (p != null && p >= 0 && p < t && counts[p] < ctx.maxSize) { assign[i] = p; counts[p]++; }
      }
    }

    /* 2. les autres en serpentin selon leur indice (fort / faible en alternance) */
    var rest = [];
    for (var k = 0; k < n; k++) if (assign[k] === -1) rest.push(k);
    rest.sort(function (a, b) {
      var d = ctx.list[b].index - ctx.list[a].index;
      return d !== 0 ? d : (rng() - 0.5);
    });
    var dir = 1, slot = 0;
    /* on commence par l'équipe la moins remplie */
    var order = [];
    for (var q = 0; q < t; q++) order.push(q);
    order.sort(function (a, b) { return counts[a] - counts[b]; });
    for (var r = 0; r < rest.length; r++) {
      var tries = 0, placed = false;
      while (tries < t && !placed) {
        var team = order[slot];
        if (counts[team] < ctx.maxSize) { assign[rest[r]] = team; counts[team]++; placed = true; }
        slot += dir;
        if (slot >= t) { slot = t - 1; dir = -1; }
        else if (slot < 0) { slot = 0; dir = 1; }
        tries++;
      }
      if (!placed) { // sécurité : équipe la moins remplie
        var best = 0;
        for (var z = 1; z < t; z++) if (counts[z] < counts[best]) best = z;
        assign[rest[r]] = best; counts[best]++;
      }
    }
    return assign;
  }

  function optimize(ctx, rng, iterations) {
    var best = null, bestCost = Infinity;
    var restarts = ctx.churnWeight > 0 ? 2 : 4;

    for (var rs = 0; rs < restarts; rs++) {
      var assign = seedAssign(ctx, rng);
      if (rs > 0 && ctx.churnWeight === 0) {
        /* perturbation initiale pour explorer d'autres configurations */
        for (var p = 0; p < ctx.list.length; p++)
          if (rng() < 0.25) assign[p] = Math.floor(rng() * ctx.teamCount);
      }
      var cur = cost(assign, ctx);
      var T0 = Math.max(1, cur * 0.02);
      for (var it = 0; it < iterations; it++) {
        var temp = T0 * (1 - it / iterations);
        var i = Math.floor(rng() * assign.length);
        var j = Math.floor(rng() * assign.length);
        var mode = rng() < 0.7 ? 'swap' : 'move';
        var old_i = assign[i], old_j = assign[j];
        if (mode === 'swap') {
          if (old_i === old_j) continue;
          assign[i] = old_j; assign[j] = old_i;
        } else {
          var tgt = Math.floor(rng() * ctx.teamCount);
          if (tgt === old_i) continue;
          assign[i] = tgt;
        }
        var nc = cost(assign, ctx);
        var d = nc - cur;
        if (d <= 0 || (temp > 0 && rng() < Math.exp(-d / temp))) {
          cur = nc;
        } else {
          assign[i] = old_i; assign[j] = old_j;
        }
      }
      /* descente finale stricte */
      var improved = true, guard = 0;
      while (improved && guard < 60) {
        improved = false; guard++;
        for (var a = 0; a < assign.length; a++) {
          for (var b = a + 1; b < assign.length; b++) {
            if (assign[a] === assign[b]) continue;
            var ta = assign[a], tb = assign[b];
            assign[a] = tb; assign[b] = ta;
            var c2 = cost(assign, ctx);
            if (c2 < cur - 1e-9) { cur = c2; improved = true; }
            else { assign[a] = ta; assign[b] = tb; }
          }
        }
      }
      if (cur < bestCost) { bestCost = cur; best = assign.slice(); }
    }
    return { assign: best, cost: bestCost };
  }

  /* --------------------------------------------------------------- API */

  /* opts = { students:[{id,sex,index}], teamCount, mixite, stability(0-100),
              constraints:{together:[[id,id]],apart:[[id,id]]},
              previousTeams:[{id,members:[]}], minSize, maxSize, seed } */
  function compose(opts) {
    var list = opts.students.slice();
    var t = A.clamp(opts.teamCount | 0, 1, 9);
    var minSize = opts.minSize || 3, maxSize = opts.maxSize || 7;
    var rng = A.rngFrom(opts.seed || (list.length + '-' + t + '-' + Date.now()));
    var warnings = [];

    if (!list.length) return { teams: [], warnings: ['Aucun élève présent.'], cost: 0 };

    /* Mode non mixte : on scinde en deux sous-problèmes indépendants. */
    if (opts.mixite === 'nonmixte') {
      var F = list.filter(function (s) { return s.sex === 'F'; });
      var M = list.filter(function (s) { return s.sex !== 'F'; });
      if (!F.length || !M.length) {
        warnings.push('Mode non mixte demandé mais un seul genre est présent : composition classique.');
      } else {
        var tF = Math.max(1, Math.round(t * F.length / list.length));
        var tM = Math.max(1, t - tF);
        if (tF + tM !== t) tF = t - tM;
        var rF = compose(Object.assign({}, opts, { students: F, teamCount: tF, mixite: 'libre' }));
        var rM = compose(Object.assign({}, opts, { students: M, teamCount: tM, mixite: 'libre' }));
        var merged = rF.teams.concat(rM.teams).map(function (tm, i) {
          return { id: tm.id, name: TEAMS_NAME(i), color: A.TEAM_COLORS[i % 9], members: tm.members };
        });
        (opts.constraints && opts.constraints.together || []).forEach(function (pair) {
          var a = list.filter(function (s) { return s.id === pair[0]; })[0];
          var b = list.filter(function (s) { return s.id === pair[1]; })[0];
          if (a && b && a.sex !== b.sex) warnings.push('Contrainte « ensemble » impossible en mode non mixte pour deux élèves de genres différents.');
        });
        return { teams: merged, warnings: warnings.concat(rF.warnings, rM.warnings), cost: rF.cost + rM.cost };
      }
    }

    /* ---------------------------------------------------------- mode NIVEAU
       Équipes homogènes en leur sein (des élèves de même niveau ensemble) et
       appariées deux à deux de force égale : les équipes 1 et 2 sont les plus
       fortes et se valent, les 3 et 4 viennent ensuite, etc. Chaque équipe a
       donc un adversaire à sa mesure — d'où le conseil d'un nombre pair. */
    if (opts.composition === 'niveau' && t >= 2) {
      var units = groupUnits(list, opts.constraints && opts.constraints.together);
      units.sort(function (a, b) { return b.index - a.index; });
      var sizes = idealSizes(list.length, t);
      var blocks = [], bi = 0;
      while (bi < t) {
        var take = (bi + 1 < t) ? 2 : 1;
        blocks.push({ teams: take, capacity: sizes[bi] + (take === 2 ? sizes[bi + 1] : 0), members: [] });
        bi += take;
      }
      var bIdx = 0;
      units.forEach(function (u) {
        while (bIdx < blocks.length - 1 &&
               blocks[bIdx].members.length + u.members.length > blocks[bIdx].capacity) bIdx++;
        blocks[bIdx].members = blocks[bIdx].members.concat(u.members);
      });

      var outTeams = [], warn = [];
      if (t % 2 === 1) warn.push('Mode Niveau avec ' + t + ' équipes : le nombre étant impair, ' +
        'la dernière équipe n\'a pas d\'équipe jumelle de même niveau.');
      blocks.forEach(function (blk) {
        if (!blk.members.length) return;
        var sub = compose({
          students: blk.members, teamCount: Math.min(blk.teams, Math.max(1, blk.members.length)),
          mixite: opts.mixite, stability: 0,
          constraints: opts.constraints, previousTeams: null,
          minSize: 1, maxSize: maxSize, composition: 'equilibre',
          seed: (opts.seed || '') + ':niv:' + outTeams.length
        });
        outTeams = outTeams.concat(sub.teams);
        warn = warn.concat(sub.warnings);
      });
      outTeams = outTeams.map(function (tm, i) {
        return { id: tm.id, name: TEAMS_NAME(i), color: A.TEAM_COLORS[i % 9], members: tm.members };
      });
      var small = outTeams.filter(function (x) { return x.members.length < minSize; }).length;
      if (small) warn.push(small + ' équipe(s) sous ' + minSize + ' joueurs : ajuste le nombre d\'équipes.');
      return { teams: outTeams, warnings: warn.filter(uniqueWarn()), cost: 0 };
    }

    var pos = {};
    list.forEach(function (s, i) { pos[s.id] = i; });

    var pairFilter = function (arr) {
      return (arr || []).filter(function (p) { return pos[p[0]] != null && pos[p[1]] != null; })
        .map(function (p) { return [pos[p[0]], pos[p[1]]]; });
    };
    var apart = pairFilter(opts.constraints && opts.constraints.apart);
    var together = pairFilter(opts.constraints && opts.constraints.together);

    /* Une contrainte « ensemble » transitive de plus de maxSize élèves est
       insatisfaisable : on prévient plutôt que de produire n'importe quoi. */
    var comp = connectedComponents(together, list.length);
    comp.forEach(function (c) {
      if (c.length > maxSize) warnings.push('Un groupe « toujours ensemble » compte ' + c.length +
        ' élèves, au-delà de la taille maximale d\'équipe (' + maxSize + ').');
    });

    var prevSlot = null;
    var churnWeight = A.clamp(opts.stability || 0, 0, 100) / 100 * 12;
    if (opts.previousTeams && opts.previousTeams.length && churnWeight > 0) {
      prevSlot = new Array(list.length).fill(null);
      opts.previousTeams.slice(0, t).forEach(function (pt, slot) {
        (pt.members || []).forEach(function (sid) {
          if (pos[sid] != null) prevSlot[pos[sid]] = slot;
        });
      });
    } else churnWeight = 0;

    var ctx = {
      list: list, teamCount: t, sizes: idealSizes(list.length, t),
      minSize: minSize, maxSize: maxSize,
      globalMean: A.mean(list.map(function (s) { return s.index; })),
      girlsRatio: list.filter(function (s) { return s.sex === 'F'; }).length / list.length,
      mixite: opts.mixite || 'libre',
      apart: apart, together: together,
      prevSlot: prevSlot, churnWeight: churnWeight
    };

    if (list.length < t * minSize) warnings.push('Avec ' + list.length + ' élèves présents, ' + t +
      ' équipes donnent des effectifs sous ' + minSize + '. Réduis le nombre d\'équipes.');
    if (list.length > t * maxSize) warnings.push('Avec ' + list.length + ' élèves présents, ' + t +
      ' équipes donnent des effectifs au-dessus de ' + maxSize + '. Augmente le nombre d\'équipes.');

    var r = optimize(ctx, rng, Math.min(9000, 1200 + list.length * 220));

    var teams = [];
    for (var i = 0; i < t; i++) teams.push({ id: A.uid('tm'), name: TEAMS_NAME(i), color: A.TEAM_COLORS[i % 9], members: [] });
    r.assign.forEach(function (slot, i) { teams[slot].members.push(list[i].id); });

    /* Réordonner chaque équipe par indice décroissant (lecture plus simple) */
    var byId = {};
    list.forEach(function (s) { byId[s.id] = s; });
    teams.forEach(function (tm) {
      tm.members.sort(function (a, b) { return byId[b].index - byId[a].index; });
    });

    apart.forEach(function (p) {
      if (r.assign[p[0]] === r.assign[p[1]])
        warnings.push('Impossible de séparer ' + list[p[0]].label + ' et ' + list[p[1]].label + ' avec ces effectifs.');
    });
    together.forEach(function (p) {
      if (r.assign[p[0]] !== r.assign[p[1]])
        warnings.push('Impossible de réunir ' + list[p[0]].label + ' et ' + list[p[1]].label + ' avec ces effectifs.');
    });

    return { teams: teams, warnings: warnings, cost: r.cost };
  }

  function TEAMS_NAME(i) { return 'Équipe ' + A.TEAM_NAMES[i % 9]; }

  function uniqueWarn() {
    var seen = {};
    return function (w) { if (seen[w]) return false; seen[w] = 1; return true; };
  }

  /* Regroupe les élèves liés par une contrainte « toujours ensemble » : en mode
     Niveau, ils doivent tomber dans le même bloc de niveau, sinon la contrainte
     serait impossible à tenir. */
  function groupUnits(list, togetherPairs) {
    var pos = {};
    list.forEach(function (s, i) { pos[s.id] = i; });
    var parent = list.map(function (_, i) { return i; });
    function find(x) { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
    (togetherPairs || []).forEach(function (p) {
      if (pos[p[0]] == null || pos[p[1]] == null) return;
      var a = find(pos[p[0]]), b = find(pos[p[1]]);
      if (a !== b) parent[a] = b;
    });
    var groups = {};
    list.forEach(function (s, i) {
      var r = find(i);
      (groups[r] = groups[r] || []).push(s);
    });
    return Object.keys(groups).map(function (k) {
      return { members: groups[k], index: A.mean(groups[k].map(function (s) { return s.index; })) };
    });
  }

  function connectedComponents(pairs, n) {
    var parent = [], i;
    for (i = 0; i < n; i++) parent.push(i);
    function find(x) { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
    pairs.forEach(function (p) { var a = find(p[0]), b = find(p[1]); if (a !== b) parent[a] = b; });
    var groups = {};
    for (i = 0; i < n; i++) { var r = find(i); (groups[r] = groups[r] || []).push(i); }
    return Object.keys(groups).map(function (k) { return groups[k]; }).filter(function (g) { return g.length > 1; });
  }

  /* Diagnostic d'un jeu d'équipes existant, pour affichage en direct. */
  function evaluate(teams, indexOf, sexOf, constraints, previousTeams) {
    var means = [], sizes = [], report = { teams: [], violations: [], churn: null };
    teams.forEach(function (tm) {
      var idx = tm.members.map(indexOf);
      var g = tm.members.filter(function (s) { return sexOf(s) === 'F'; }).length;
      var m = idx.length ? A.mean(idx) : 0;
      means.push(m); sizes.push(tm.members.length);
      report.teams.push({
        id: tm.id, name: tm.name, size: tm.members.length,
        mean: A.round(m, 2), sd: A.round(A.sd(idx), 2),
        top: idx.length ? A.round(Math.max.apply(null, idx), 1) : 0,
        girls: g, boys: tm.members.length - g
      });
    });
    report.spread = means.length ? A.round(Math.max.apply(null, means) - Math.min.apply(null, means), 2) : 0;
    report.meanOfMeans = A.round(A.mean(means), 2);

    var teamOf = {};
    teams.forEach(function (tm) { tm.members.forEach(function (s) { teamOf[s] = tm.id; }); });
    (constraints && constraints.apart || []).forEach(function (p) {
      if (teamOf[p[0]] && teamOf[p[0]] === teamOf[p[1]]) report.violations.push({ type: 'apart', pair: p });
    });
    (constraints && constraints.together || []).forEach(function (p) {
      if (teamOf[p[0]] && teamOf[p[1]] && teamOf[p[0]] !== teamOf[p[1]]) report.violations.push({ type: 'together', pair: p });
    });

    if (previousTeams && previousTeams.length) {
      /* Appariement glouton ancienne équipe → nouvelle équipe par recouvrement */
      var used = {}, moved = 0, counted = 0;
      teams.forEach(function (tm) {
        var best = null, bestOv = -1;
        previousTeams.forEach(function (pt) {
          if (used[pt.id]) return;
          var ov = tm.members.filter(function (s) { return pt.members.indexOf(s) > -1; }).length;
          if (ov > bestOv) { bestOv = ov; best = pt; }
        });
        if (best) { used[best.id] = 1; moved += tm.members.length - bestOv; }
        else moved += tm.members.length;
        counted += tm.members.length;
      });
      report.churn = { moved: moved, total: counted, rate: counted ? A.round(moved / counted, 2) : 0 };
    }
    return report;
  }

  return { compose: compose, evaluate: evaluate, idealSizes: idealSizes };
})();
</script>
<script>
/* ============================================================================
   Ultimate EPS — briques d'interface
   Rendu par chaînes HTML + délégation d'événements (data-act / data-chg).
   ========================================================================== */
'use strict';

var UI = (function () {

  var A = APP;
  var e = A.escapeHtml;

  /* ------------------------------------------------------------ notifications */

  var toastTimer = null;
  function toast(msg) {
    var old = document.querySelector('.toast');
    if (old) old.remove();
    var d = document.createElement('div');
    d.className = 'toast';
    d.textContent = msg;
    document.body.appendChild(d);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { d.remove(); }, 3200);
  }

  /* ------------------------------------------------------------------ modale
     Panneau maison plutôt que l'élément <dialog> natif : showModal() est
     refusé dans les aperçus en bac à sable (iframe sans allow-modals), et le
     clic sur « Valider » semblait alors ne rien faire. Ici, rien ne dépend du
     navigateur. */

  var openModals = 0;

  function modal(opts) {
    opts = opts || {};
    var back = document.createElement('div');
    back.className = 'modal-back';

    var panel = document.createElement('div');
    panel.className = 'modal-panel';
    panel.setAttribute('role', 'dialog');
    panel.setAttribute('aria-modal', 'true');
    panel.innerHTML =
      '<div class="modal-head"><h2>' + e(opts.title || '') + '</h2>' +
      '<button type="button" class="modal-x" data-mrole="cancel" aria-label="Fermer">✕</button></div>' +
      '<div class="modal-body">' + (opts.body || '') + '</div>' +
      '<div class="modal-foot">' +
      (opts.cancel === false ? '' : '<button type="button" class="btn-ghost" data-mrole="cancel">' + e(opts.cancelLabel || 'Annuler') + '</button>') +
      '<button type="button" class="btn-primary" data-mrole="ok">' + e(opts.okLabel || 'Valider') + '</button>' +
      '</div>';

    back.appendChild(panel);
    document.body.appendChild(back);
    openModals++;
    document.body.classList.add('modal-open');

    var closed = false;
    function finish(ok) {
      if (closed) return;
      /* un gestionnaire peut refuser la fermeture en retournant false
         (saisie incomplète, deux fois le même élève, etc.) */
      if (ok && opts.onOk && opts.onOk(panel) === false) return;
      if (!ok && opts.onCancel) opts.onCancel(panel);
      closed = true;
      document.removeEventListener('keydown', onKey, true);
      back.remove();
      openModals = Math.max(0, openModals - 1);
      if (!openModals) document.body.classList.remove('modal-open');
    }

    function onKey(ev) {
      if (!back.isConnected) return;
      if (ev.key === 'Escape') { ev.stopPropagation(); ev.preventDefault(); finish(false); return; }
      if (ev.key === 'Enter' && ev.target && ev.target.tagName === 'INPUT' &&
          ev.target.type !== 'checkbox' && ev.target.type !== 'radio') {
        ev.preventDefault(); finish(true);
      }
    }

    back.addEventListener('click', function (ev) {
      if (ev.target === back && opts.dismissible !== false) { ev.stopPropagation(); finish(false); }
    });
    panel.addEventListener('click', function (ev) {
      var b = ev.target.closest ? ev.target.closest('[data-mrole]') : null;
      if (!b || !panel.contains(b)) return;
      ev.stopPropagation();
      ev.preventDefault();
      finish(b.getAttribute('data-mrole') === 'ok');
    }, true);

    document.addEventListener('keydown', onKey, true);

    /* API de compatibilité : le reste du code interroge le panneau comme avant */
    panel.close = function () { finish(false); };
    panel.submit = function () { finish(true); };

    var first = panel.querySelector('.modal-body input, .modal-body select, .modal-body textarea');
    if (first) setTimeout(function () {
      try { first.focus(); if (first.select) first.select(); } catch (err) {}
    }, 40);

    if (opts.onOpen) opts.onOpen(panel);
    return panel;
  }

  function ask(title, label, value, cb, opts) {
    opts = opts || {};
    modal({
      title: title,
      body: '<label class="field"><span>' + e(label) + '</span>' +
        (opts.multiline
          ? '<textarea name="v">' + e(value || '') + '</textarea>'
          : '<input name="v" type="' + (opts.type || 'text') + '" value="' + e(value == null ? '' : value) + '">') +
        '</label>' + (opts.hint ? '<p class="small muted">' + opts.hint + '</p>' : ''),
      onOk: function (dlg) {
        var v = dlg.querySelector('[name=v]').value;
        cb(v);
      }
    });
  }

  function confirm(title, message, cb, okLabel) {
    modal({
      title: title,
      body: '<p>' + message + '</p>',
      okLabel: okLabel || 'Confirmer',
      onOk: function () { cb(); }
    });
  }

  /* -------------------------------------------------------------- graphiques */

  /* Radar des critères. values : [{label, v (0-10 ou null)}] ; alt = 2e série */
  function radar(values, alt, size) {
    size = size || 200;
    var cx = size / 2, cy = size / 2, R = size * 0.36, n = values.length;
    if (n < 3) return '<p class="muted small center">Il faut au moins 3 critères pour le radar.</p>';
    var rings = [0.25, 0.5, 0.75, 1];
    var pt = function (i, r) {
      var ang = -Math.PI / 2 + i * 2 * Math.PI / n;
      return [cx + Math.cos(ang) * R * r, cy + Math.sin(ang) * R * r];
    };
    var poly = function (arr) {
      return arr.map(function (p) { return A.round(p[0], 1) + ',' + A.round(p[1], 1); }).join(' ');
    };
    var s = '<svg class="radar" viewBox="0 0 ' + size + ' ' + size + '" role="img">';
    rings.forEach(function (r) {
      var p = [];
      for (var i = 0; i < n; i++) p.push(pt(i, r));
      s += '<polygon class="grid-line" points="' + poly(p) + '"/>';
    });
    for (var i = 0; i < n; i++) {
      var p2 = pt(i, 1);
      s += '<line class="axis" x1="' + cx + '" y1="' + cy + '" x2="' + A.round(p2[0], 1) + '" y2="' + A.round(p2[1], 1) + '"/>';
    }
    var mk = function (vals, cls) {
      var any = vals.some(function (v) { return v.v != null; });
      if (!any) return '';
      var p = vals.map(function (v, i) { return pt(i, A.clamp((v.v == null ? 5 : v.v) / 10, 0.04, 1)); });
      return '<polygon class="shape ' + cls + '" points="' + poly(p) + '"/>';
    };
    if (alt) s += mk(alt, 'alt');
    s += mk(values, '');
    for (var j = 0; j < n; j++) {
      var lp = pt(j, 1.19);
      var anchor = Math.abs(lp[0] - cx) < 6 ? 'middle' : (lp[0] > cx ? 'start' : 'end');
      s += '<text x="' + A.round(lp[0], 1) + '" y="' + A.round(lp[1] + 3, 1) + '" text-anchor="' + anchor + '">' +
        e(values[j].label) + '</text>';
    }
    s += '</svg>';
    return s;
  }

  /* Courbe de progression simple */
  function sparkline(points, w, h) {
    w = w || 240; h = h || 60;
    var pts = points.filter(function (p) { return p != null && isFinite(p); });
    if (pts.length < 2) return '<span class="muted tiny">pas assez de leçons</span>';
    var min = 0, max = 10;
    var step = (w - 8) / (points.length - 1);
    var path = '', started = false;
    points.forEach(function (v, i) {
      if (v == null || !isFinite(v)) return;
      var x = 4 + i * step, y = h - 4 - (v - min) / (max - min) * (h - 8);
      path += (started ? ' L' : 'M') + A.round(x, 1) + ' ' + A.round(y, 1);
      started = true;
    });
    var s = '<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" style="max-width:' + w + 'px">';
    s += '<line class="ax" x1="0" y1="' + (h - 4 - 0.5 * (h - 8)) + '" x2="' + w + '" y2="' + (h - 4 - 0.5 * (h - 8)) + '" stroke-dasharray="3 3"/>';
    s += '<path class="line" d="' + path + '"/>';
    points.forEach(function (v, i) {
      if (v == null || !isFinite(v)) return;
      var x = 4 + i * step, y = h - 4 - (v - min) / (max - min) * (h - 8);
      s += '<circle class="pt" cx="' + A.round(x, 1) + '" cy="' + A.round(y, 1) + '" r="2.6"/>';
    });
    s += '</svg>';
    return s;
  }

  /* Nuage de points + droite d'ajustement (page fiabilité) */
  function scatter(points, xlabel, ylabel, w, h) {
    w = w || 420; h = h || 260;
    if (!points.length) return '<p class="muted">Aucun match enregistré.</p>';
    var xs = points.map(function (p) { return p.dx; }), ys = points.map(function (p) { return p.margin; });
    var xmin = Math.min.apply(null, xs), xmax = Math.max.apply(null, xs);
    if (xmax - xmin < 0.2) { xmin -= 0.5; xmax += 0.5; }
    var ymin = -1, ymax = 1;
    var pad = 34;
    var X = function (v) { return pad + (v - xmin) / (xmax - xmin) * (w - pad - 12); };
    var Y = function (v) { return h - pad - (v - ymin) / (ymax - ymin) * (h - pad - 12); };
    var s = '<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '">';
    s += '<line class="ax" x1="' + pad + '" y1="' + Y(0) + '" x2="' + (w - 8) + '" y2="' + Y(0) + '"/>';
    s += '<line class="ax" x1="' + X(0) + '" y1="12" x2="' + X(0) + '" y2="' + (h - pad) + '" stroke-dasharray="3 3"/>';
    /* régression linéaire */
    var mx = A.mean(xs), my = A.mean(ys), num = 0, den = 0;
    xs.forEach(function (x, i) { num += (x - mx) * (ys[i] - my); den += (x - mx) * (x - mx); });
    if (den > 0) {
      var b = num / den, a = my - b * mx;
      s += '<path class="fit" d="M' + X(xmin) + ' ' + Y(A.clamp(a + b * xmin, ymin, ymax)) +
        ' L' + X(xmax) + ' ' + Y(A.clamp(a + b * xmax, ymin, ymax)) + '"/>';
    }
    points.forEach(function (p) {
      s += '<circle class="pt" cx="' + A.round(X(p.dx), 1) + '" cy="' + A.round(Y(p.margin), 1) + '" r="4"/>';
    });
