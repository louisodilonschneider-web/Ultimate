    s += '<text x="' + (w / 2) + '" y="' + (h - 6) + '" text-anchor="middle">' + e(xlabel) + '</text>';
    s += '<text x="10" y="16">' + e(ylabel) + '</text>';
    s += '</svg>';
    return s;
  }

  /* ---------------------------------------------------------- petits blocs */

  function bar(v, max, cls) {
    var p = A.clamp(v / (max || 10), 0, 1) * 100;
    var color = cls === 'auto'
      ? (v >= 6.5 ? 'var(--ok)' : v >= 4 ? 'var(--accent)' : 'var(--warn)')
      : 'var(--accent)';
    return '<span class="bar" title="' + A.round(v, 1) + '"><i style="width:' + A.round(p, 0) + '%;background:' + color + '"></i></span>';
  }

  function badge(text, cls) { return '<span class="badge ' + (cls || '') + '">' + e(text) + '</span>'; }

  function empty(title, text, actionHtml) {
    return '<div class="empty"><h3>' + e(title) + '</h3><p class="muted">' + text + '</p>' + (actionHtml || '') + '</div>';
  }

  function indexBadge(v, reliability) {
    var cls = v >= 6.5 ? 'ok' : v >= 4 ? 'accent' : 'warn';
    return '<span class="badge ' + cls + '" title="Indice global sur 10' +
      (reliability ? ' — fiabilité ' + reliability.level + ' (' + reliability.n + ' observations)' : '') + '">' +
      A.round(v, 1).toFixed(1) + '</span>';
  }

  function sexMark(s) {
    return s === 'F' ? '<span class="sx" title="Fille">F</span>'
      : s === 'M' ? '<span class="sx" title="Garçon">G</span>' : '';
  }

  function selectOpts(items, current, valueKey, labelKey) {
    return items.map(function (it) {
      var v = valueKey ? it[valueKey] : it.value;
      var l = labelKey ? it[labelKey] : it.label;
      return '<option value="' + e(v) + '"' + (v === current ? ' selected' : '') + '>' + e(l) + '</option>';
    }).join('');
  }

  return {
    toast: toast, modal: modal, ask: ask, confirm: confirm,
    radar: radar, sparkline: sparkline, scatter: scatter,
    bar: bar, badge: badge, empty: empty, indexBadge: indexBadge, sexMark: sexMark,
    selectOpts: selectOpts, e: e
  };
})();
</script>
<script>
/* ============================================================================
   Ultimate EPS — synchronisation Realtime Database (Firebase)
   ----------------------------------------------------------------------------
   Objectif : retrouver exactement les mêmes données sur l'ordinateur et sur la
   tablette. La configuration du projet est intégrée ci-dessous ; il suffit de se
   connecter avec le même compte enseignant sur les deux appareils.

   Ce qui est important à comprendre :

   · L'application reste LOCALE d'abord. Tout est enregistré dans le navigateur,
     et la synchronisation vient par-dessus. Sans réseau — dans un gymnase — tout
     continue de fonctionner, et le rattrapage se fait au retour du réseau.

   · La connexion anonyme ne convient PAS ici : elle donne un identifiant
     différent sur chaque appareil, donc deux espaces séparés. On utilise donc un
     compte e-mail + mot de passe, le même des deux côtés. C'est aussi ce qui
     permet d'écrire des règles de sécurité sérieuses (voir le README).

   · Le chemin des données est `espaces/<identifiant du compte>` : personne
     d'autre que ce compte ne peut le lire si les règles sont en place.
   ========================================================================== */
'use strict';

APP.cloud = (function () {

  var A = APP;

  /* Configuration du projet, intégrée pour n'avoir rien à saisir.
     Une clé d'API web Firebase n'est pas un secret : elle identifie le projet.
     Ce qui protège réellement les données, ce sont les règles de la base. */
  var DEFAULT_CONFIG = {
    apiKey: 'AIzaSyAJgRygktg-zkVSiTHgP2Co7AWb-E0I0Qw',
    authDomain: 'eps-pasteur.firebaseapp.com',
    databaseURL: 'https://eps-pasteur-default-rtdb.europe-west1.firebasedatabase.app',
    projectId: 'eps-pasteur',
    storageBucket: 'eps-pasteur.firebasestorage.app',
    messagingSenderId: '501398220240',
    appId: '1:501398220240:web:9df6a7c04d66f5d62b5dd5'
  };

  var SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';

  var state = {
    phase: 'off',        // off | loading | signed-out | on | error | offline
    message: '',
    email: '',
    uid: null,
    lastSync: null,
    pending: false,      // des modifications locales attendent d'être envoyées
    remoteNewer: null    // horodatage distant plus récent, en attente de choix
  };

  var db = null, ref = null, user = null;
  var applying = false;      // on applique des données distantes : ne pas renvoyer
  var lastSynced = null;     // horodatage de la dernière version échangée
  var pushTimer = null;
  var listeners = [];

  function onStatus(fn) { listeners.push(fn); }
  function emit() {
    listeners.forEach(function (f) { try { f(status()); } catch (e) { console.error(e); } });
  }
  function set(phase, message) {
    state.phase = phase;
    state.message = message || '';
    emit();
  }
  function status() {
    return {
      phase: state.phase, message: state.message, email: state.email,
      uid: state.uid, lastSync: state.lastSync, pending: state.pending,
      remoteNewer: state.remoteNewer, isOn: state.phase === 'on'
    };
  }

  function config() {
    var c = A.get().settings.firebase;
    return (c && c.apiKey) ? c : DEFAULT_CONFIG;
  }

  /* ------------------------------------------------------- chargement du SDK */

  var sdkPromise = null;
  function loadSDK() {
    if (sdkPromise) return sdkPromise;
    if (typeof Promise === 'undefined') return null;
    sdkPromise = ['firebase-app-compat.js', 'firebase-auth-compat.js', 'firebase-database-compat.js']
      .reduce(function (p, file) {
        return p.then(function () {
          return new Promise(function (res, rej) {
            var s = document.createElement('script');
            s.src = SDK + file;
            s.onload = res;
            s.onerror = function () { rej(new Error('réseau indisponible')); };
            document.head.appendChild(s);
          });
        });
      }, Promise.resolve());
    return sdkPromise;
  }

  /* --------------------------------------------------------------- démarrage */

  /* Appelé au lancement : on se reconnecte tout seul si une session existe. */
  function init() {
    var s = A.get().settings;
    if (!s.cloudEnabled) { set('off'); return; }
    start();
  }

  function start() {
    if (!navigator.onLine) { set('offline', 'Pas de réseau — tout reste enregistré sur cet appareil.'); return; }
    set('loading', 'Connexion au serveur…');
    loadSDK().then(function () {
      if (!window.firebase.apps.length) window.firebase.initializeApp(config());
      db = window.firebase.database();
      window.firebase.auth().onAuthStateChanged(function (u) {
        user = u;
        if (!u) {
          ref = null;
          state.uid = null;
          set('signed-out', 'Connecte-toi avec ton compte enseignant pour synchroniser.');
          return;
        }
        state.uid = u.uid;
        state.email = u.email || '';
        ref = db.ref('espaces/' + u.uid);
        attach();
      });
    }).catch(function (err) {
      set('offline', 'Serveur injoignable (' + err.message + '). L\'application continue en local.');
    });
  }

  /* Première lecture puis écoute en continu. */
  function attach() {
    set('on', 'Connecté — lecture des données…');
    ref.once('value').then(function (snap) {
      var remote = snap.val();
      var localAt = A.get().savedAt || '';
      if (remote && remote.savedAt && remote.savedAt > localAt) {
        /* Version distante plus récente : on demande, on n'écrase jamais sans dire. */
        state.remoteNewer = remote.savedAt;
        set('on', 'Une version plus récente existe sur un autre appareil.');
        proposePull(remote);
      } else if (!remote || (localAt && localAt > (remote.savedAt || ''))) {
        pushNow();
      } else {
        lastSynced = remote && remote.savedAt;
        state.lastSync = new Date().toISOString();
        set('on', 'Synchronisé.');
      }
      listen();
    }).catch(function (err) {
      set('error', messageOf(err));
    });
  }

  function listen() {
    ref.on('value', function (snap) {
      var remote = snap.val();
      if (!remote || !remote.savedAt) return;
      if (remote.savedAt === lastSynced) return;             // c'est notre propre envoi
      var localAt = A.get().savedAt || '';
      if (remote.savedAt <= localAt) return;                 // rien de plus récent

      if (localAt === lastSynced || !lastSynced) {
        /* Rien n'a été modifié ici depuis le dernier échange : on peut appliquer
           sans risque de perdre une saisie en cours. */
        applyRemote(remote);
        UI.toast('Données mises à jour depuis un autre appareil.');
      } else {
        /* Des modifications locales existent : on ne tranche pas à la place de
           l'enseignant, on signale et on laisse choisir. */
        state.remoteNewer = remote.savedAt;
        set('on', 'Un autre appareil a envoyé des modifications.');
      }
    }, function (err) { set('error', messageOf(err)); });
  }

  function applyRemote(remote) {
    try {
      applying = true;
      A.importJSON(remote.payload, 'replace');
      A.persistAs(remote.savedAt);
      lastSynced = remote.savedAt;
      state.lastSync = new Date().toISOString();
      state.remoteNewer = null;
      state.pending = false;
      set('on', 'Synchronisé.');
    } catch (err) {
      set('error', 'Données distantes illisibles : ' + err.message);
    } finally {
      applying = false;
    }
  }

  function proposePull(remote) {
    UI.confirm('Version plus récente sur un autre appareil',
      'Une sauvegarde du ' + new Date(remote.savedAt).toLocaleString('fr-FR') +
      ' existe sur le serveur, plus récente que celle de cet appareil.<br><br>' +
      'La récupérer remplacera les données locales. Si tu as travaillé ici sans réseau, ' +
      'choisis plutôt « Annuler » puis « Envoyer mes données » dans les réglages.',
      function () { applyRemote(remote); }, 'Récupérer');
  }

  /* ------------------------------------------------------------- envoi */

  function push(st) {
    if (applying || !ref) return;
    state.pending = true;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(pushNow, 2000);
    emit();
  }

  function pushNow() {
    if (!ref) return;
    var st = A.get();
    var payload = JSON.stringify(st);
    if (payload.length > 6000000) {
      set('error', 'Sauvegarde trop lourde pour la synchronisation (' +
        Math.round(payload.length / 1048576) + ' Mo). Allège les images des situations.');
      return;
    }
    var at = st.savedAt || new Date().toISOString();
    ref.set({ savedAt: at, payload: payload, device: deviceName() })
      .then(function () {
        lastSynced = at;
        state.pending = false;
        state.remoteNewer = null;
        state.lastSync = new Date().toISOString();
        set('on', 'Synchronisé.');
      })
      .catch(function (err) { set('error', messageOf(err)); });
  }

  /* Récupération forcée, demandée depuis les réglages. */
  function pull() {
    if (!ref) { UI.toast('Connecte-toi d\'abord.'); return; }
    ref.once('value').then(function (snap) {
      var remote = snap.val();
      if (!remote || !remote.payload) { UI.toast('Rien à récupérer sur le serveur.'); return; }
      UI.confirm('Récupérer les données du serveur',
        'Les données de cet appareil seront remplacées par la version du ' +
        new Date(remote.savedAt).toLocaleString('fr-FR') + '.',
        function () { applyRemote(remote); UI.toast('Données récupérées.'); }, 'Récupérer');
    }).catch(function (err) { UI.toast(messageOf(err)); });
  }

  /* ----------------------------------------------------------- connexion */

  function signIn(email, pass, create, done) {
    if (!navigator.onLine) { UI.toast('Pas de réseau.'); if (done) done(new Error('hors ligne')); return; }
    set('loading', 'Connexion…');
    loadSDK().then(function () {
      if (!window.firebase.apps.length) window.firebase.initializeApp(config());
      db = window.firebase.database();
      var auth = window.firebase.auth();
      var op = create
        ? auth.createUserWithEmailAndPassword(email, pass)
        : auth.signInWithEmailAndPassword(email, pass);
      return op;
    }).then(function () {
      A.set(function (s) { s.settings.cloudEnabled = true; s.settings.cloudEmail = email; });
      state.email = email;
      if (done) done(null);
    }).catch(function (err) {
      set('error', messageOf(err));
      if (done) done(err);
    });
  }

  function signOut() {
    clearTimeout(pushTimer);
    if (ref) { try { ref.off(); } catch (e) {} }
    ref = null; lastSynced = null;
    A.set(function (s) { s.settings.cloudEnabled = false; });
    if (window.firebase && window.firebase.apps.length) {
      window.firebase.auth().signOut().catch(function () {});
    }
    state.uid = null;
    state.pending = false;
    set('off', 'Synchronisation désactivée. Les données restent sur cet appareil.');
  }

  function deviceName() {
    var ua = navigator.userAgent || '';
    if (/iPad|Tablet|Android(?!.*Mobile)/i.test(ua)) return 'tablette';
    if (/Mobile|iPhone|Android/i.test(ua)) return 'téléphone';
    return 'ordinateur';
  }

  function messageOf(err) {
    var c = err && err.code || '';
    if (/auth\/invalid-email/.test(c)) return 'Adresse e-mail invalide.';
    if (/auth\/(user-not-found|invalid-login-credentials|invalid-credential)/.test(c))
      return 'Compte inconnu ou mot de passe incorrect. La première fois, utilise « Créer le compte ».';
    if (/auth\/wrong-password/.test(c)) return 'Mot de passe incorrect.';
    if (/auth\/email-already-in-use/.test(c)) return 'Ce compte existe déjà : utilise « Se connecter ».';
    if (/auth\/weak-password/.test(c)) return 'Mot de passe trop court (6 caractères minimum).';
    if (/auth\/operation-not-allowed/.test(c))
      return 'Active d\'abord « E-mail/Mot de passe » dans Firebase → Authentication → Sign-in method.';
    if (/auth\/network-request-failed/.test(c)) return 'Réseau indisponible.';
    if (/PERMISSION_DENIED|permission_denied/i.test(err && (err.message || err.code) || ''))
      return 'Accès refusé par les règles de la base. Colle les règles indiquées dans les réglages.';
    return (err && err.message) || 'Erreur inconnue.';
  }

  /* Reprise automatique quand le réseau revient (sortie du gymnase). */
  window.addEventListener('online', function () {
    if (A.get().settings.cloudEnabled && state.phase !== 'on') start();
  });
  window.addEventListener('offline', function () {
    if (A.get().settings.cloudEnabled) set('offline', 'Pas de réseau — tout reste enregistré sur cet appareil.');
  });

  return {
    DEFAULT_CONFIG: DEFAULT_CONFIG,
    init: init, start: start, push: push, pushNow: pushNow, pull: pull,
    signIn: signIn, signOut: signOut, status: status, onStatus: onStatus,
    isOn: function () { return state.phase === 'on'; },
    off: signOut
  };
})();
</script>
<script>
/* ============================================================================
   Ultimate EPS — vues principales (classes, élèves, contraintes, modèle,
   réglages). Les vues de leçon sont dans lesson.js, le kiosque dans kiosk.js.
   ========================================================================== */
'use strict';

var VIEWS = (function () {

  var A = APP, e = APP.escapeHtml;

  /* ==================================================================== CLASSES */

  function classes() {
    var st = A.get();
    var ids = Object.keys(st.classes);
    var h = '';

    h += '<div class="card"><div class="card-head"><div>' +
      '<h2>Mes classes</h2>' +
      '<p class="muted small" style="margin:0">Importe la liste depuis un export Pronote (CSV), ou saisis les élèves à la main.</p>' +
      '</div><div class="row tight">' +
      '<button class="btn-primary" data-act="class.import">Importer un CSV</button>' +
      '<button data-act="class.new">Classe vide</button>' +
      '</div></div>';

    if (!ids.length) {
      h += UI.empty('Aucune classe pour l\'instant',
        'Commence par importer le CSV de ta classe. Le fichier reste sur cet appareil, rien n\'est envoyé nulle part.',
        '<button class="btn-primary" data-act="class.import" style="margin-top:8px">Importer un CSV</button>' +
        ' <button data-act="demo.seed" style="margin-top:8px">Charger une classe de démonstration</button>');
    } else {
      h += '<div class="grid cols-3">';
      A.sortBy(ids.map(function (k) { return st.classes[k]; }), function (c) { return c.name; }).forEach(function (c) {
        var ls = A.classLessons(c.id);
        var r = RATINGS.compute(c.id);
        var withData = c.students.filter(function (s) { return r.byStudent[s.id] && r.byStudent[s.id].nObs > 0; }).length;
        h += '<div class="card" style="margin:0">' +
          '<h3>' + e(c.name) + '</h3>' +
          '<p class="small muted">' + c.students.length + ' élèves · ' + ls.length + ' leçon' + (ls.length > 1 ? 's' : '') +
          ' · ' + withData + ' élève' + (withData > 1 ? 's' : '') + ' avec données</p>' +
          '<div class="row tight">' +
          '<button class="btn-primary btn-sm" data-act="class.open" data-id="' + c.id + '">Ouvrir</button>' +
          '<button class="btn-sm" data-act="class.rename" data-id="' + c.id + '">Renommer</button>' +
          '<button class="btn-sm btn-danger" data-act="class.delete" data-id="' + c.id + '">Supprimer</button>' +
          '</div></div>';
      });
      h += '</div>';
    }
    h += '</div>';
    return h;
  }

  /* Import CSV : lecture → mappage des colonnes → création de la classe */
  function startImport() {
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = '.csv,.txt,text/csv';
    inp.onchange = function () {
      var f = inp.files && inp.files[0];
      if (!f) return;
      A.readFileSmart(f, function (text) { showMapping(text, f.name.replace(/\.[^.]+$/, '')); });
    };
    inp.click();
  }

  function showMapping(text, defaultName) {
    var delim = A.detectDelimiter(text);
    var rows = A.parseCSV(text, delim);
    if (!rows.length) { UI.toast('Fichier vide ou illisible.'); return; }
    var header = rows[0];
    var map = A.guessMapping(header);
    var hasHeader = Object.keys(map).some(function (k) { return map[k] > -1; });

    var colOpts = function (cur) {
      var s = '<option value="-1">— aucune —</option>';
      header.forEach(function (hname, i) {
        s += '<option value="' + i + '"' + (i === cur ? ' selected' : '') + '>' +
          e((hasHeader ? hname : 'Colonne ' + (i + 1)) + '  (ex. « ' + String(rows[hasHeader ? 1 : 0] ? rows[hasHeader ? 1 : 0][i] : '') + ' »)') + '</option>';
      });
      return s;
    };

    var body =
      '<label class="field"><span>Nom de la classe</span><input name="cname" value="' + e(defaultName || '5e B') + '"></label>' +
      '<div class="grid cols-2">' +
      '<label class="field"><span>Colonne « Nom »</span><select name="last">' + colOpts(map.last) + '</select></label>' +
      '<label class="field"><span>Colonne « Prénom »</span><select name="first">' + colOpts(map.first) + '</select></label>' +
      '<label class="field"><span>ou colonne « Nom Prénom » réunis</span><select name="full">' + colOpts(map.full) + '</select></label>' +
      '<label class="field"><span>Colonne « Sexe » (pour la mixité)</span><select name="sex">' + colOpts(map.sex) + '</select></label>' +
      '</div>' +
      '<label class="inline"><input type="checkbox" name="hdr"' + (hasHeader ? ' checked' : '') + '> La première ligne est une ligne d\'en-têtes</label>' +
      '<p class="small muted" style="margin-top:10px">Séparateur détecté : <code>' + e(delim === '\t' ? 'tabulation' : delim) + '</code> · ' +
      rows.length + ' lignes lues. Si les accents sont abîmés, réenregistre ton CSV en UTF-8.<br>' +
      'L\'export d\'appel habituel — <code>Élèves</code>, <code>encouragement/valorisation</code>, <code>Né(e) le</code>, <code>Sexe</code> — ' +
      'est reconnu tout seul : la première colonne donne NOM et Prénom, les deux du milieu sont ignorées, la dernière donne le sexe.</p>' +
      '<div id="preview" class="table-wrap" style="max-height:180px;overflow:auto;margin-top:8px"></div>';

    var dlg = UI.modal({
      title: 'Importer une classe', okLabel: 'Importer', body: body,
      onOpen: function (d) {
        var upd = function () {
          var m = {
            last: +d.querySelector('[name=last]').value,
            first: +d.querySelector('[name=first]').value,
            full: +d.querySelector('[name=full]').value,
            sex: +d.querySelector('[name=sex]').value,
            group: -1
          };
          var students = A.rowsToStudents(rows, m, d.querySelector('[name=hdr]').checked);
          var p = '<table class="compact"><thead><tr><th>Nom</th><th>Prénom</th><th>Sexe</th></tr></thead><tbody>';
          students.slice(0, 40).forEach(function (s) {
            p += '<tr><td>' + e(s.last) + '</td><td>' + e(s.first) + '</td><td>' + e(s.sex) + '</td></tr>';
          });
          p += '</tbody></table><p class="small muted">' + students.length + ' élèves détectés.</p>';
          d.querySelector('#preview').innerHTML = p;
        };
        d.querySelectorAll('select,[name=hdr]').forEach(function (el) { el.addEventListener('change', upd); });
        if (map.sex === -1) {
          var guess = A.guessSexColumn(rows, hasHeader ? 1 : 0, [map.full, map.last, map.first]);
          if (guess > -1) d.querySelector('[name=sex]').value = String(guess);
        }
        upd();
      },
      onOk: function (d) {
        var m = {
          last: +d.querySelector('[name=last]').value,
          first: +d.querySelector('[name=first]').value,
          full: +d.querySelector('[name=full]').value,
          sex: +d.querySelector('[name=sex]').value,
          group: -1
        };
        var students = A.rowsToStudents(rows, m, d.querySelector('[name=hdr]').checked);
        if (!students.length) { UI.toast('Aucun élève détecté — vérifie le mappage des colonnes.'); return false; }
        var name = d.querySelector('[name=cname]').value.trim() || 'Classe';
        A.set(function (s) {
          var c = A.newClass(name);
          c.students = students;
          s.ui.classId = c.id;
          s.ui.view = 'stats';
        });
        UI.toast(students.length + ' élèves importés.');
      }
    });
    return dlg;
  }

  /* ============================================================= STATISTIQUES
     Regroupe ce qui relève du suivi et non de la conduite de séance :
     le niveau des élèves, l'évaluation, et la qualité des données récoltées. */

  var STAT_TABS = [
    { k: 'eleves', l: 'Élèves' },
    { k: 'eval', l: 'Évaluation' },
    { k: 'data', l: 'Qualité des données' }
  ];

  function stats() {
    var st = A.get(), cls = A.currentClass();
    if (!cls) return UI.empty('Choisis une classe', 'Ouvre une classe depuis l\'onglet Classes.');
    var tab = st.ui.statsTab || 'eleves';
    var h = '<div class="subnav">' + STAT_TABS.map(function (t) {
      return '<button data-act="stats.tab" data-t="' + t.k + '" aria-current="' + (tab === t.k) + '">' + t.l + '</button>';
    }).join('') + '</div>';
    return h + (tab === 'eval' ? evalSection() : tab === 'data' ? model() : students());
  }

  function evalSection() {
    var cls = A.currentClass();
    var ls = A.classLessons(cls.id);
    if (!ls.length) {
      return '<div class="card">' + UI.empty('Aucune leçon',
        'L\'évaluation s\'appuie sur une leçon : crée d\'abord une leçon dans l\'onglet Leçons.') + '</div>';
    }
    var cur = A.currentLesson() || ls[ls.length - 1];
    var h = '<div class="card"><div class="card-head"><div><h2>Évaluation</h2>' +
      '<p class="muted small" style="margin:0">Les niveaux proposés viennent des données récoltées ; tu gardes la main sur chaque case.</p></div>' +
      '<label class="inline"><span class="small muted">Leçon</span><select data-chg="stats.lesson">' +
      ls.map(function (l) {
        return '<option value="' + l.id + '"' + (l.id === cur.id ? ' selected' : '') + '>' +
          e(l.title + ' — ' + A.frDate(l.date)) + '</option>';
      }).join('') + '</select></label></div>';
    return h + EVAL.view(cur) + '</div>';
  }

  /* ==================================================================== ÉLÈVES */

  function students() {
    var st = A.get(), cls = A.currentClass();
    if (!cls) return UI.empty('Choisis une classe', 'Ouvre une classe depuis l\'onglet Classes.');
    var r = RATINGS.compute(cls.id);
    var crits = A.criteria();
    var sortKey = st.ui.studentSort || 'name';

    var h = '<div class="card"><div class="card-head"><div>' +
      '<h2>' + e(cls.name) + ' — ' + cls.students.length + ' élèves</h2>' +
      '<p class="muted small" style="margin:0">L\'indice est sur 10, centré sur 5 = moyenne de la classe. Clique sur un élève pour son profil.</p>' +
      '</div><div class="row tight">' +
      '<select data-chg="students.sort"><option value="name"' + (sortKey === 'name' ? ' selected' : '') + '>Tri alphabétique</option>' +
      '<option value="index"' + (sortKey === 'index' ? ' selected' : '') + '>Tri par indice</option></select>' +
      '<button data-act="student.add">Ajouter un élève</button>' +
      '<button data-act="students.exportCsv">Exporter CSV</button>' +
      '</div></div>';

    if (!cls.students.length) {
      h += UI.empty('Classe vide', 'Importe un CSV ou ajoute les élèves un à un.');
      return h + '</div>';
    }

    var list = sortKey === 'index'
      ? A.sortBy(cls.students, function (s) { return r.byStudent[s.id] ? r.byStudent[s.id].index : 5; }, true)
      : A.sortBy(cls.students, function (s) { return (s.last + ' ' + s.first).toLowerCase(); });

    h += '<div class="table-wrap"><table><thead><tr>' +
      '<th>Élève</th><th class="num">Indice</th><th>Fiabilité</th>';
    crits.forEach(function (c) { h += '<th class="num" title="' + e(c.desc || c.name) + '">' + e(c.short || c.name) + '</th>'; });
    h += '<th>Progression</th><th></th></tr></thead><tbody>';

    list.forEach(function (s) {
      var rs = r.byStudent[s.id] || { index: 5, reliability: RATINGS.reliability(0), crit: {}, history: [] };
      h += '<tr data-act="student.open" data-id="' + s.id + '" style="cursor:pointer">' +
        '<td><b>' + e(A.displayName(s)) + '</b> ' + UI.sexMark(s.sex) + '</td>' +
        '<td class="num">' + UI.indexBadge(rs.index, rs.reliability) + '</td>' +
        '<td>' + UI.badge(rs.reliability.level, rs.reliability.cls) + '</td>';
      crits.forEach(function (c) {
        var v = RATINGS.critDisplay(r, s.id, c.id);
        h += '<td class="num">' + (v == null ? '<span class="muted">–</span>' : A.round(v, 1).toFixed(1)) + '</td>';
      });
      h += '<td>' + UI.sparkline(rs.history.map(function (x) { return x.index; }), 110, 34) + '</td>' +
        '<td class="num"><button class="btn-sm btn-ghost" data-act="student.open" data-id="' + s.id + '">Profil →</button></td>' +
        '</tr>';
    });
    h += '</tbody></table></div>';
    h += '<p class="small muted" style="margin-top:10px">« – » signifie qu\'aucune donnée n\'a encore alimenté ce critère. ' +
      'Une fiabilité faible veut dire que l\'indice repose sur peu d\'observations : il est volontairement ramené vers la moyenne de la classe.</p>';
    return h + '</div>';
  }

  function studentProfile(sid) {
    var cls = A.currentClass();
    if (!cls) return;
    var s = A.studentById(cls.id, sid);
    if (!s) return;
    var r = RATINGS.compute(cls.id);
    var rs = r.byStudent[sid];
    var crits = A.criteria();

    var vals = crits.map(function (c) {
      var v = RATINGS.critDisplay(r, sid, c.id);
      return { label: c.short || c.name, v: v };
    });

    /* auto-évaluation la plus récente, pour comparaison */
    var selfVals = null, selfLesson = null;
    A.classLessons(cls.id).slice().reverse().some(function (l) {
      var sv = l.evaluation && l.evaluation.self && l.evaluation.self[sid];
      if (sv && Object.keys(sv).length) {
        selfLesson = l;
        selfVals = crits.map(function (c) {
          var lv = sv[c.id];
          return { label: c.short || c.name, v: lv == null ? null : (+lv) * 10 / 4 };
        });
        return true;
      }
      return false;
    });

    var body = '<div class="grid cols-2">' +
      '<div>' + UI.radar(vals, selfVals, 230) +
      '<p class="tiny center muted">' + (selfVals ? 'Trait plein : ton évaluation · pointillés : auto-évaluation de l\'élève (' + e(selfLesson.title) + ')' : 'Profil enseignant') + '</p>' +
      '</div><div>' +
      '<div class="row" style="margin-bottom:10px"><div class="stat" style="flex:1"><b>' + rs.index.toFixed(1) + '</b><span>Indice global /10</span></div>' +
      '<div class="stat" style="flex:1"><b>' + rs.global.n + '</b><span>observations</span></div></div>' +
      '<table class="compact"><tbody>';
    crits.forEach(function (c) {
      var v = RATINGS.critDisplay(r, sid, c.id);
      body += '<tr><td>' + e(c.name) + '</td><td style="width:90px">' + (v == null ? '<span class="muted">–</span>' : UI.bar(v, 10, 'auto')) + '</td>' +
        '<td class="num">' + (v == null ? '' : v.toFixed(1)) + '</td>' +
        '<td class="num tiny muted">' + (rs.crit[c.id].n || 0) + ' obs.</td></tr>';
    });
    body += '</tbody></table>';
    body += '<h4 style="margin-top:14px">Progression</h4>' +
      UI.sparkline(rs.history.map(function (x) { return x.index; }), 300, 70) +
      '<p class="tiny muted">' + rs.history.filter(function (x) { return x.index != null; }).length + ' leçons avec données</p>';
    body += '</div></div>';

    /* Parcours en match : bilan et équipes fréquentées */
    var parcours = matchRecord(cls.id, sid);
    body += '<h4 style="margin-top:16px">Parcours en match</h4>';
    if (!parcours.rows.length) {
      body += '<p class="small muted">Cet élève n\'a pas encore été intégré à une équipe.</p>';
    } else {
      body += '<div class="row" style="margin-bottom:10px">' +
        '<div class="stat"><b>' + parcours.v + '</b><span>victoires</span></div>' +
        '<div class="stat"><b>' + parcours.n + '</b><span>nuls</span></div>' +
        '<div class="stat"><b>' + parcours.d + '</b><span>défaites</span></div>' +
        '<div class="stat"><b>' + (parcours.pp - parcours.pc > 0 ? '+' : '') + (parcours.pp - parcours.pc) + '</b><span>différence</span></div>' +
        '</div>' +
        '<div class="table-wrap"><table class="compact"><thead><tr>' +
        '<th>Leçon</th><th>Équipe</th><th class="num">V</th><th class="num">N</th><th class="num">D</th>' +
        '<th>Coéquipiers</th></tr></thead><tbody>' +
        parcours.rows.map(function (r) {
          return '<tr><td class="nowrap">' + e(r.lesson) + '</td>' +
            '<td><b style="color:' + r.color + '">' + e(r.team) + '</b></td>' +
            '<td class="num">' + r.v + '</td><td class="num">' + r.n + '</td><td class="num">' + r.d + '</td>' +
            '<td class="small muted">' + e(r.mates.join(', ') || '—') + '</td></tr>';
        }).join('') + '</tbody></table></div>' +
        '<p class="tiny muted" style="margin-top:6px">' + parcours.distinctMates +
        ' coéquipiers différents sur l\'ensemble du cycle.</p>';
    }

    body += '<label class="field" style="margin-top:10px"><span>Remarque personnelle (non partagée)</span>' +
      '<textarea name="note" style="min-height:60px">' + e(s.note || '') + '</textarea></label>' +
      '<label class="field"><span>Sexe (utilisé pour la mixité)</span><select name="sex">' +
      '<option value="F"' + (s.sex === 'F' ? ' selected' : '') + '>Fille</option>' +
      '<option value="M"' + (s.sex === 'M' ? ' selected' : '') + '>Garçon</option>' +
      '<option value="X"' + (s.sex === 'X' ? ' selected' : '') + '>Non renseigné</option></select></label>';

    UI.modal({
      title: A.displayName(s), body: body, okLabel: 'Enregistrer',
      onOk: function (d) {
        var note = d.querySelector('[name=note]').value;
        var sex = d.querySelector('[name=sex]').value;
        A.set(function () { s.note = note; s.sex = sex; });
      }
    });
  }

  /* Parcours d'un élève en match : bilan et équipes fréquentées, leçon par leçon. */
  function matchRecord(classId, sid) {
    var st = A.get();
    var out = { rows: [], v: 0, n: 0, d: 0, pp: 0, pc: 0, distinctMates: 0 };
    var mates = {};
    A.classLessons(classId).forEach(function (l) {
      var team = (l.teams || []).filter(function (t) { return t.members.indexOf(sid) > -1; })[0];
      if (!team) return;
      var row = { lesson: l.title, team: team.name, color: team.color || 'var(--accent)', v: 0, n: 0, d: 0, mates: [] };
      team.members.forEach(function (m) {
        if (m === sid) return;
        var o = A.studentById(classId, m);
        if (o) { row.mates.push(A.shortName(o)); mates[m] = 1; }
      });
      (l.matches || []).forEach(function (m) {
        if (m.scoreA == null || m.scoreB == null) return;
        var own = m.teamA === team.id ? +m.scoreA : (m.teamB === team.id ? +m.scoreB : null);
        if (own == null) return;
        var opp = m.teamA === team.id ? +m.scoreB : +m.scoreA;
        out.pp += own; out.pc += opp;
        if (own > opp) { row.v++; out.v++; }
        else if (own < opp) { row.d++; out.d++; }
        else { row.n++; out.n++; }
      });
      out.rows.push(row);
    });
    out.distinctMates = Object.keys(mates).length;
    return out;
  }

  /* ============================================================== CONTRAINTES */

  function constraints() {
    var cls = A.currentClass();
    if (!cls) return UI.empty('Choisis une classe', 'Ouvre une classe depuis l\'onglet Classes.');
    var c = cls.constraints || (cls.constraints = { together: [], apart: [] });
    var nameOf = function (id) {
      var s = A.studentById(cls.id, id);
      return s ? A.displayName(s) : '(élève supprimé)';
    };

    var h = '<div class="card"><div class="card-head"><div><h2>Contraintes de composition</h2>' +
      '<p class="muted small" style="margin:0">Ces règles s\'appliquent à toutes les leçons de la classe. Elles sont prioritaires sur l\'équilibre des niveaux.</p>' +
      '</div></div>' +
      '<div class="notice">Une règle « toujours ensemble » portant sur plus d\'élèves que la taille maximale d\'équipe sera signalée comme impossible au moment de composer.</div>' +
      '<div class="grid cols-2">';

    var block = function (key, title, desc, cls2) {
      var s = '<div><div class="card-head"><h3>' + e(title) + '</h3>' +
        '<button class="btn-sm" data-act="constraint.add" data-kind="' + key + '">Ajouter</button></div>' +
        '<p class="small muted">' + desc + '</p><div class="pairs-list">';
      if (!c[key].length) s += '<p class="muted small">Aucune règle.</p>';
      c[key].forEach(function (p, i) {
        s += '<div class="pair ' + cls2 + '"><span style="flex:1">' + e(nameOf(p[0])) + ' &nbsp;·&nbsp; ' + e(nameOf(p[1])) + '</span>' +
          '<button class="btn-sm btn-ghost" data-act="constraint.del" data-kind="' + key + '" data-i="' + i + '" title="Supprimer">✕</button></div>';
      });
      return s + '</div></div>';
    };
    h += block('apart', 'À séparer', 'Ces élèves ne seront jamais dans la même équipe.', 'apart');
    h += block('together', 'À garder ensemble', 'Ces élèves seront toujours dans la même équipe.', 'together');
    h += '</div></div>';
    return h;
  }

  function addConstraint(kind) {
    var cls = A.currentClass();
    if (!cls || cls.students.length < 2) { UI.toast('Il faut au moins deux élèves.'); return; }
    var opts = A.sortBy(cls.students, function (s) { return (s.last + s.first).toLowerCase(); })
      .map(function (s) { return '<option value="' + s.id + '">' + e(A.displayName(s)) + '</option>'; }).join('');
    UI.modal({
      title: kind === 'apart' ? 'Élèves à séparer' : 'Élèves à garder ensemble',
      body: '<div class="grid cols-2">' +
        '<label class="field"><span>Élève A</span><select name="a">' + opts + '</select></label>' +
        '<label class="field"><span>Élève B</span><select name="b">' + opts + '</select></label></div>',
      onOk: function (d) {
        var a = d.querySelector('[name=a]').value, b = d.querySelector('[name=b]').value;
        if (a === b) { UI.toast('Choisis deux élèves différents.'); return false; }
        A.set(function () {
          var exists = cls.constraints[kind].some(function (p) {
            return (p[0] === a && p[1] === b) || (p[0] === b && p[1] === a);
          });
          if (!exists) cls.constraints[kind].push([a, b]);
        });
      }
    });
  }

  /* ================================================================== MODÈLE */

  function model() {
    var cls = A.currentClass();
    if (!cls) return UI.empty('Choisis une classe', 'Ouvre une classe depuis l\'onglet Classes.');
    var r = RATINGS.compute(cls.id);
    var fit = r.diagnostics.matchFit;
    var st = A.get();

    var h = '<div class="card"><h2>Fiabilité du modèle</h2>' +
      '<p class="muted small">Cette page ne calcule rien sur les élèves : elle vérifie si le modèle dit vrai sur <em>ta</em> classe. ' +
      'Un modèle qui ne se vérifie jamais ne doit pas servir à noter.</p>';

    /* 1. Corrélation indices ↔ écarts de points */
    h += '<h3 style="margin-top:18px">Les indices prédisent-ils les résultats des matchs ?</h3>';
    if (!fit || fit.n < 3) {
      h += '<p class="muted">Il faut au moins 3 matchs enregistrés. Actuellement : ' + (fit ? fit.n : 0) + '.</p>';
    } else {
      var rr = fit.r;
      var q = rr == null ? null : Math.abs(rr);
      var verdict = q == null ? ['Indéterminé', ''] :
        q >= 0.6 ? ['Relation forte', 'ok'] :
          q >= 0.35 ? ['Relation modérée', 'accent'] :
            ['Relation faible', 'warn'];
      h += '<div class="grid cols-2"><div>' +
        UI.scatter(fit.points, 'Écart d\'indice entre les deux équipes', 'Marge normalisée', 420, 250) +
        '</div><div>' +
        '<div class="row"><div class="stat" style="flex:1"><b>' + (rr == null ? '–' : A.round(rr, 2)) + '</b><span>corrélation r</span></div>' +
        '<div class="stat" style="flex:1"><b>' + fit.n + '</b><span>matchs</span></div></div>' +
        '<p style="margin-top:10px">' + UI.badge(verdict[0], verdict[1]) + '</p>' +
        '<p class="small">' + (q == null ? '' : q >= 0.6
          ? 'Les indices calculés prévoient bien l\'issue des rencontres : l\'équilibrage des équipes est sur de bonnes bases, et tu peux si tu le souhaites remonter un peu le poids du résultat de match.'
          : q >= 0.35
            ? 'La relation existe mais reste bruitée, ce qui est normal en ultimate au collège : le hasard, l\'engagement et la durée courte des matchs pèsent lourd. Garde un poids modeste pour le résultat de match.'
            : 'Le niveau estimé n\'explique presque pas les écarts de points. Deux causes possibles : trop peu de données d\'entraînement, ou des matchs trop courts pour être significatifs. Dans les deux cas, ne fais pas dépendre la note du résultat.') +
        '</p></div></div>';
    }

    /* 2. Brassage des partenaires */
    h += '<h3 style="margin-top:22px">Le brassage des partenaires est-il suffisant ?</h3>' +
      '<p class="small muted">Si les élèves travaillent toujours avec les mêmes partenaires, il est impossible de distinguer leur niveau de celui de leur binôme. ' +
      'L\'objectif est d\'au moins 3 partenaires différents par élève et par situation.</p>';
    if (!r.diagnostics.situations.length) {
      h += '<p class="muted">Aucune situation renseignée pour l\'instant.</p>';
    } else {
      h += '<div class="table-wrap"><table class="compact"><thead><tr><th>Leçon</th><th>Situation</th><th class="num">Tentatives</th>' +
        '<th class="num">Partenaires distincts (moy.)</th><th>Diagnostic</th></tr></thead><tbody>';
      r.diagnostics.situations.forEach(function (d) {
        var m = d.mixing || {};
        h += '<tr><td>' + e(d.lessonTitle) + '</td><td>' + e(d.name) + '</td><td class="num">' + d.attempts + '</td>' +
          '<td class="num">' + (m.solo ? '<span class="muted">individuel</span>' : m.avgPartners) + '</td><td>' +
          (m.solo ? UI.badge('mesure individuelle', 'ok')
            : m.ok ? UI.badge('brassage suffisant', 'ok') : UI.badge('brassage insuffisant', 'warn')) + '</td></tr>';
      });
      h += '</tbody></table></div>';
    }

    /* 3. Couverture des données */
    h += '<h3 style="margin-top:22px">Couverture des données</h3><div class="grid cols-4">';
    var crits = A.criteria();
    crits.forEach(function (c) {
      var n = cls.students.filter(function (s) { return r.byStudent[s.id] && r.byStudent[s.id].crit[c.id].n > 0; }).length;
      var p = cls.students.length ? Math.round(n / cls.students.length * 100) : 0;
      h += '<div class="stat"><b>' + p + ' %</b><span>' + e(c.name) + '</span>' +
        '<div class="tiny muted">' + n + '/' + cls.students.length + ' élèves</div></div>';
    });
    h += '</div>';

    var low = cls.students.filter(function (s) { return r.byStudent[s.id] && r.byStudent[s.id].global.n < 4; });
    if (low.length) {
      h += '<div class="notice warn" style="margin-top:14px"><b>' + low.length + ' élève' + (low.length > 1 ? 's ont' : ' a') +
        ' moins de 4 observations.</b> Leur indice est très proche de 5 par construction (régression vers la moyenne) : ' +
        'ils seront répartis comme des élèves moyens tant que tu n\'auras pas de données sur eux. ' +
        '<br><span class="small">' + e(low.slice(0, 12).map(function (s) { return A.displayName(s); }).join(', ')) +
        (low.length > 12 ? '…' : '') + '</span></div>';
    }

    h += '<h3 style="margin-top:22px">Poids actuels dans l\'indice global</h3><div class="grid cols-4">';
    [['situations', 'Situations d\'entraînement'], ['matchStats', 'Statistiques de match'],
     ['observation', 'Observation enseignant'], ['matchResult', 'Résultat des matchs']].forEach(function (p) {
      h += '<div class="stat"><b>' + Math.round(st.settings.sources[p[0]] * 100) + ' %</b><span>' + e(p[1]) + '</span></div>';
    });
    h += '</div><p class="small muted" style="margin-top:8px">Modifiable dans Réglages. Tout est recalculé instantanément sur l\'historique complet.</p>';

    return h + '</div>';
  }

  /* ================================================================ RÉGLAGES */

  function settings() {
    var st = A.get();
    var s = st.settings;
    var s2 = s;
    var h = '';

    /* Critères */
    h += '<div class="card"><div class="card-head"><div><h2>Critères d\'évaluation</h2>' +
      '<p class="muted small" style="margin:0">Quatre critères par défaut : Technique, Jeu en progression, Défense, Fair-play. Renomme-les pour une autre APSA. Un poids de 0 retire le critère de l\'indice sans effacer les données.</p>' +
      '</div><div class="row tight"><button class="btn-sm" data-act="crit.add">Ajouter</button>' +
      '<button class="btn-sm" data-act="crit.reset">Rétablir les 4 critères</button></div></div>' +
      '<div class="table-wrap"><table><thead><tr><th>Nom</th><th>Abrégé</th><th class="num">Poids</th><th>Description</th><th></th></tr></thead><tbody>';
    s.criteria.forEach(function (c, i) {
      h += '<tr>' +
        '<td><input data-chg="crit.name" data-i="' + i + '" value="' + e(c.name) + '" style="min-width:130px"></td>' +
        '<td><input data-chg="crit.short" data-i="' + i + '" value="' + e(c.short || '') + '" style="width:70px"></td>' +
        '<td class="num"><input type="number" step="0.1" min="0" max="3" data-chg="crit.weight" data-i="' + i + '" value="' + c.weight + '" style="width:75px"></td>' +
        '<td><input data-chg="crit.desc" data-i="' + i + '" value="' + e(c.desc || '') + '" style="min-width:200px;width:100%"></td>' +
        '<td><button class="btn-sm btn-ghost" data-act="crit.del" data-i="' + i + '">✕</button></td>' +
        '</tr>';
    });
    h += '</tbody></table></div></div>';

    /* Poids du modèle — expliqué en clair, avec des réglages tout prêts */
    var SRC = [
      ['situations', 'Ce qu\'ils réussissent dans les situations',
        'Les scores saisis pendant les ateliers, ramenés au niveau de la classe et au palier choisi. C\'est la mesure la plus fiable.'],
      ['matchStats', 'Ce qu\'ils font pendant les matchs',
        'Passes réussies, passes ratées, interceptions relevées par les observateurs.'],
      ['observation', 'Ce que tu observes toi-même',
        'Le fair-play noté sur les matchs et tes remarques directes pendant la séance.'],
      ['matchResult', 'Le résultat des matchs',
        'Victoire ou défaite, et l\'écart de points comparé à ce qu\'on pouvait attendre du niveau des deux équipes.']
    ];
    var total = SRC.reduce(function (t, p) { return t + (+s.sources[p[0]] || 0); }, 0) || 1;
    var cur = SRC.map(function (p) { return Math.round(s.sources[p[0]] / total * 100); });

    h += '<div class="card"><h2>D\'où vient l\'indice de chaque élève</h2>' +
      '<p class="muted small">L\'indice sur 10 est une moyenne de quatre sources. Ces curseurs disent simplement ' +
      '<b>combien chaque source compte</b>. Exemple : si « situations » est à 45 %, alors 45 % de l\'indice vient ' +
      'des scores d\'ateliers. Si tu n\'as pas d\'idée précise, garde le réglage « Équilibré » : ' +
      'il fonctionne bien dans la grande majorité des cycles.</p>';

    h += '<h4>Réglages tout prêts</h4><div class="next-grid" style="margin-bottom:16px">' +
      A.SOURCE_PRESETS.map(function (p) {
        var same = SRC.every(function (x, i) { return Math.abs((s.sources[x[0]] || 0) - p.values[x[0]]) < 0.005; });
        return '<button class="next-card' + (same ? ' active' : '') + '" data-act="src.preset" data-p="' + p.id + '">' +
          '<b>' + e(p.name) + '</b><span>' + e(p.hint || '') + '</span>' +
          '<span class="badge' + (same ? ' accent' : '') + '">' + (same ? 'réglage actuel' : 'appliquer') + '</span></button>';
      }).join('') + '</div>';

    h += '<div class="src-list">';
    SRC.forEach(function (p, i) {
      h += '<div class="src-row">' +
        '<div class="src-txt"><b>' + e(p[1]) + '</b><span class="small muted">' + e(p[2]) + '</span></div>' +
        '<div class="src-ctl">' +
        '<input type="range" min="0" max="100" value="' + Math.round(s.sources[p[0]] * 100) + '" data-chg="src.weight" data-k="' + p[0] + '">' +
        '<b class="src-val">' + cur[i] + ' %</b></div></div>';
    });
    h += '</div>';
    h += '<p class="small muted" style="margin-top:8px">La somme est ramenée à 100 % automatiquement, tu n\'as pas à la calculer. ' +
      'Un conseil : garde « résultat des matchs » bas. Un élève peut très bien jouer dans une équipe qui perd.</p>';

    h += '<details style="margin-top:14px"><summary class="small" style="cursor:pointer;font-weight:600">Réglages avancés du calcul</summary>' +
      '<div class="grid cols-3" style="margin-top:12px">' +
      '<label class="field"><span>Poids des dernières leçons — ' + A.round(s.ewma * 100, 0) + ' %</span>' +
      '<input type="range" min="5" max="100" value="' + Math.round(s.ewma * 100) + '" data-chg="set.ewma">' +
      '<span class="tiny muted">À 100 %, seule la dernière séance compte. 35 % laisse la progression s\'exprimer sans effacer le passé.</span></label>' +
      '<label class="field"><span>Prudence quand peu de données — ' + s.shrinkK + '</span>' +
      '<input type="range" min="0" max="12" value="' + s.shrinkK + '" data-chg="set.shrink">' +
      '<span class="tiny muted">Plus c\'est haut, plus un élève vu deux ou trois fois reste proche de la moyenne de la classe au lieu d\'être jugé trop vite.</span></label>' +
      '<label class="field"><span>Séparation élève / partenaires — ' + A.round(s.ridgeLambda, 1) + '</span>' +
      '<input type="range" min="1" max="40" value="' + Math.round(s.ridgeLambda * 10) + '" data-chg="set.ridge">' +
      '<span class="tiny muted">Prudence du calcul qui distingue un élève de ses partenaires dans un score de groupe. Baisse-la si tu brasses beaucoup les groupes.</span></label>' +
      '</div></details></div>';

    /* Installation matérielle */
    h += '<div class="card"><h2>Le gymnase</h2>' +
      '<p class="muted small">Le nombre de terrains décide du nombre de rencontres qui se jouent en même temps, ' +
      'donc du découpage des matchs en tours : les équipes qui ne jouent pas observent et tiennent les feuilles. ' +
      'C\'est la valeur par défaut ; chaque leçon et chaque échauffement peuvent s\'en écarter.</p>' +
      '<label class="field" style="max-width:260px"><span>Terrains disponibles</span>' +
      '<input type="number" min="1" max="' + A.MAX_TERRAINS + '" data-chg="set.terrains" value="' +
      (s.terrains || A.TERRAINS) + '"></label></div>';

    /* Mode kiosque */
    h += '<div class="card"><h2>Mode kiosque</h2>' +
      '<p class="muted small">Quand la tablette circule entre les élèves, l\'application se verrouille en plein écran. ' +
      'Pour en sortir, il faut ce code — les élèves ne peuvent donc pas aller voir les notes de la classe.</p>' +
      '<label class="field" style="max-width:260px"><span>Code de sortie</span>' +
      '<input inputmode="numeric" data-chg="set.kioskcode" value="' + e(s.kioskCode || A.KIOSK_CODE) + '"></label>' +
      '<p class="tiny muted">Laisse vide pour sortir sans code (déconseillé en classe).</p></div>';

    /* Confidentialité + sauvegarde */
    h += '<div class="card"><h2>Données et sauvegarde</h2>' +
      '<label class="inline" style="margin-bottom:10px"><input type="checkbox" data-chg="set.anon"' + (s.anonymize ? ' checked' : '') +
      '> Afficher les élèves en « Prénom N. » (utile en vidéoprojection et si tu actives la synchronisation)</label>' +
      '<p class="small muted">Tout est enregistré dans le navigateur de cet appareil. Rien n\'est envoyé sur Internet tant que tu n\'actives pas la synchronisation. ' +
      'Pense à exporter régulièrement : vider le cache du navigateur efface les données.</p>' +
      '<div class="row tight">' +
      '<button class="btn-primary" data-act="data.export">Exporter la sauvegarde (JSON)</button>' +
      '<button data-act="data.import">Importer une sauvegarde</button>' +
      '<button data-act="data.reset" class="btn-danger">Tout effacer</button>' +
      '</div>' +
      '<p class="tiny muted" style="margin-top:8px">Dernière sauvegarde locale : ' +
      (st.savedAt ? new Date(st.savedAt).toLocaleString('fr-FR') : 'jamais') + '</p></div>';

    /* ------------------------------------------------------------ stockage */
    var info = A.storageInfo();
    var ko = function (n) {
      return n > 1048576 ? (n / 1048576).toFixed(1) + ' Mo' : Math.round(n / 1024) + ' Ko';
    };
    var etat = info.pct >= 90 ? 'bad' : (info.pct >= 70 ? 'warn' : 'ok');

    h += '<div class="card"><h2>Stockage</h2>' +
      (!info.ok
        ? '<div class="notice bad"><b>Rien n\'est enregistré en ce moment.</b> Le navigateur refuse d\'écrire : ' +
          'l\'espace est plein. Allège les images ci-dessous, ou exporte ta sauvegarde puis efface ' +
          'des leçons anciennes. Tant que ce message est là, ce que tu saisis sera perdu au rechargement.</div>'
        : '') +
      '<p class="muted small">Le navigateur accorde environ <b>5 Mo</b> par adresse. Le texte ne pèse presque rien : ' +
      'ce sont les images — schémas de situations et illustrations des messages de palier — qui remplissent l\'espace.</p>' +
      '<div class="gauge"><div class="gauge-fill ' + etat + '" style="width:' + Math.max(2, info.pct) + '%"></div></div>' +
      '<div class="row tight" style="margin:8px 0 12px">' +
      UI.badge(ko(info.total) + ' sur ~5 Mo · ' + info.pct + ' %', etat) +
      UI.badge(info.nbImages + ' image' + (info.nbImages > 1 ? 's' : '') + ' — ' + ko(info.images)) +
      UI.badge('texte et notes — ' + ko(info.texte)) +
      '</div>' +
      (info.nbImages
        ? '<div class="row tight">' +
          '<button class="btn-primary" data-act="data.shrink">Alléger les images</button>' +
          '<span class="small muted">Recompresse les ' + info.nbImages + ' images en 720 px : ' +
          'elles restent lisibles sur tablette et occupent environ deux fois moins de place.</span></div>'
        : '<p class="small muted">Aucune image enregistrée : tu as toute la place.</p>') +
      (info.pct >= 70
        ? '<p class="small" style="margin-top:10px">Si cela ne suffit pas : exporte une sauvegarde, ' +
          'puis supprime les leçons des cycles terminés — leurs scores sont dans le fichier exporté.</p>'
        : '') +
      '</div>';

    /* Synchronisation Realtime Database */
    var cl = APP.cloud.status();
    var phaseBadge = {
      off: ['', 'désactivée'],
      loading: ['', 'connexion…'],
      'signed-out': ['warn', 'non connecté'],
      on: [cl.pending ? 'accent' : 'ok', cl.pending ? 'envoi en cours' : 'synchronisé'],
      offline: ['warn', 'hors ligne'],
      error: ['bad', 'erreur']
    }[cl.phase] || ['', cl.phase];

    h += '<div class="card"><div class="card-head"><div><h2>Synchronisation ordinateur ↔ tablette</h2>' +
      '<p class="muted small" style="margin:0">Projet <code>eps-pasteur</code> · base en <b>Europe</b> ' +
      '(europe-west1). La configuration est déjà intégrée : il n\'y a rien à coller.</p></div>' +
      UI.badge(phaseBadge[1], phaseBadge[0]) + '</div>';

    if (cl.message) {
      h += '<div class="notice ' + (cl.phase === 'error' ? 'bad' : cl.phase === 'offline' ? 'warn' : '') + '">' +
        e(cl.message) + '</div>';
    }

    if (cl.phase === 'on' && cl.uid) {
      h += '<p class="small">Connecté en tant que <b>' + e(cl.email || '—') + '</b>' +
        (cl.lastSync ? ' · dernier échange à ' + new Date(cl.lastSync).toLocaleTimeString('fr-FR') : '') + '</p>' +
        '<div class="row tight">' +
        '<button data-act="cloud.push">Envoyer mes données maintenant</button>' +
        '<button data-act="cloud.pull">Récupérer celles du serveur</button>' +
        '<button data-act="cloud.off" class="btn-danger">Désactiver sur cet appareil</button>' +
        '</div>' +
        '<p class="small muted" style="margin-top:10px">Ouvre l\'application sur ton autre appareil et connecte-toi ' +
        'avec <b>ce même compte</b> : les deux resteront à jour. En cas de modification simultanée, ' +
        'l\'application prévient au lieu d\'écraser.</p>';
    } else {
      h += '<p class="small muted">Connecte-toi avec le <b>même compte sur les deux appareils</b>. ' +
        'La première fois, utilise « Créer le compte » ; ensuite, « Se connecter ». ' +
        'Le mot de passe n\'est jamais enregistré par l\'application.</p>' +
        '<div class="grid cols-2">' +
        '<label class="field"><span>Adresse e-mail</span>' +
        '<input type="email" name="cloudemail" autocomplete="username" value="' + e(s2.cloudEmail || '') + '"></label>' +
        '<label class="field"><span>Mot de passe (6 caractères minimum)</span>' +
        '<input type="password" name="cloudpass" autocomplete="current-password"></label>' +
        '</div>' +
        '<div class="row tight">' +
        '<button class="btn-primary" data-act="cloud.signin">Se connecter</button>' +
        '<button data-act="cloud.signup">Créer le compte</button>' +
        '</div>';
    }

    h += '<div class="notice warn" style="margin-top:14px"><b>À faire une seule fois, côté Firebase.</b> ' +
      'Sans ces deux réglages, la synchronisation ne marchera pas — et surtout, les données de tes élèves ' +
      'seraient lisibles par n\'importe qui connaissant l\'adresse de la base.' +
      '<ol style="margin:8px 0 0 18px">' +
      '<li><b>Authentication → Sign-in method</b> : activer <b>E-mail/Mot de passe</b>.</li>' +
      '<li><b>Realtime Database → Règles</b> : coller les règles ci-dessous, puis publier.</li>' +
      '</ol>' +
      '<p style="margin:8px 0 0"><button class="btn-sm" data-act="cloud.rules">Voir les règles à coller</button></p></div>';

    h += '<details style="margin-top:10px"><summary class="small" style="cursor:pointer;font-weight:600">' +
      'Utiliser un autre projet Firebase</summary>' +
      '<label class="field" style="margin-top:10px"><span>Configuration (JSON) — vide = projet eps-pasteur</span>' +
      '<textarea data-chg="set.fbconfig" placeholder=\'{"apiKey":"…","databaseURL":"…"}\'>' +
      e(s2.firebase ? JSON.stringify(s2.firebase, null, 2) : '') + '</textarea></label>' +
      '<p class="tiny muted">Après modification, désactive puis reconnecte la synchronisation.</p></details>';

    h += '<p class="tiny muted" style="margin-top:10px"><b>RGPD.</b> Les noms des élèves quittent l\'appareil dès que ' +
      'la synchronisation est active. La base est hébergée en Europe, l\'accès est limité à ton compte, et ' +
      'l\'anonymisation ci-dessus (« Prénom N. ») n\'affecte que l\'affichage, pas ce qui est stocké. ' +
      'Préviens ton chef d\'établissement et, au moindre doute, reste en local.</p>';

    h += '</div>';

    /* Thème */
    h += '<div class="card"><h2>Affichage</h2><div class="row tight">' +
      ['auto', 'light', 'dark'].map(function (t) {
        return '<button data-act="theme.set" data-t="' + t + '"' + (s.theme === t ? ' class="btn-primary"' : '') + '>' +
          (t === 'auto' ? 'Automatique' : t === 'light' ? 'Clair' : 'Sombre') + '</button>';
      }).join('') + '</div></div>';

    return h;
  }

  /* Les règles de sécurité, prêtes à copier. */
  function showRules() {
    var rules =
      '{\n' +
      '  "rules": {\n' +
      '    "espaces": {\n' +
      '      "$uid": {\n' +
      '        ".read": "auth != null && auth.uid === $uid",\n' +
      '        ".write": "auth != null && auth.uid === $uid"\n' +
      '      }\n' +
      '    }\n' +
      '  }\n' +
      '}';
    UI.modal({
      title: 'Règles de la Realtime Database',
      cancel: false, okLabel: 'Fermer',
      body: '<p class="small">Dans la console Firebase : <b>Realtime Database → Règles</b>, remplace tout par ceci, ' +
        'puis <b>Publier</b>.</p>' +
        '<textarea readonly style="min-height:190px;font-family:var(--mono);font-size:.85rem">' + e(rules) + '</textarea>' +
        '<p class="small muted">Ce que ça dit : chaque compte ne peut lire et écrire que son propre espace. ' +
        'Un visiteur non connecté n\'a accès à rien. Tant que tu n\'as pas publié ces règles, ' +
        'la base est en mode test — ouverte à tous, et elle expire au bout de 30 jours.</p>' +
        '<p class="small"><button class="btn-sm" id="copyrules">Copier les règles</button></p>',
      onOpen: function (d) {
        d.querySelector('#copyrules').addEventListener('click', function () {
          var ta = d.querySelector('textarea');
          ta.select();
          try { document.execCommand('copy'); UI.toast('Règles copiées.'); }
          catch (err) { UI.toast('Sélectionne le texte et copie-le à la main.'); }
        });
      }
    });
  }

  return {
    classes: classes, startImport: startImport, students: students, stats: stats,
    showRules: showRules,
    studentProfile: studentProfile, constraints: constraints, addConstraint: addConstraint,
    model: model, settings: settings
  };
})();
</script>
<script>
/* ============================================================================
   Ultimate EPS — banque de situations
   ----------------------------------------------------------------------------
   Une fiche de la banque contient tout le travail de préparation : consigne,
   unité de mesure, paliers, seuils, messages et images. Elle ne contient aucun
   score : les tentatives appartiennent à la leçon où la situation est utilisée.

   On prépare donc une fois, puis on réutilise d'un cycle à l'autre en ajustant,
   au moment de l'insertion, les critères que la situation doit alimenter.
   ========================================================================== */
'use strict';

var BANK = (function () {

  var A = APP, e = APP.escapeHtml;

  function all(kind) {
    var b = A.get().bank || {};
    var list = Object.keys(b).map(function (k) { return b[k]; });
    if (kind) list = list.filter(function (t) { return TRAINING.kindOf(t) === kind; });
    return A.sortBy(list, function (t) { return t.name; });
  }
  function byId(id) { return (A.get().bank || {})[id] || null; }

  /* ------------------------------------------------------------- dossiers
     Une même situation se décline : « Passe à 10 » à 5 m, à 8 m, en mouvement.
     Les dossiers rassemblent ces variantes pour qu'elles ne se perdent pas au
     milieu de tout le reste. Une fiche sans dossier reste parfaitement
     utilisable : elle se range dans « Sans dossier », en bas. */
  function folders() {
    var f = A.get().bankFolders || {};
    return A.sortBy(Object.keys(f).map(function (k) { return f[k]; }), function (x) { return x.name; });
  }
  function folderById(id) { return (A.get().bankFolders || {})[id] || null; }
  function folderName(id) {
    var f = folderById(id);
    return f ? f.name : 'Sans dossier';
  }
  function newFolder(name, then) {
    UI.ask('Nouveau dossier', 'Nom du dossier', name || '', function (v) {
      if (!v || !v.trim()) return;
      var id = A.uid('dos');
      A.set(function (s) {
        s.bankFolders = s.bankFolders || {};
        s.bankFolders[id] = { id: id, name: v.trim(), createdAt: new Date().toISOString() };
      });
      UI.toast('Dossier « ' + v.trim() + ' » créé.');
      if (then) then(id);
    });
  }
  function renameFolder(id) {
    var f = folderById(id);
    if (!f) return;
    UI.ask('Renommer le dossier', 'Nom', f.name, function (v) {
      if (!v || !v.trim()) return;
      A.set(function (s) { s.bankFolders[id].name = v.trim(); });
    });
  }
  function removeFolder(id) {
    var f = folderById(id);
    if (!f) return;
    var dedans = all(null).filter(function (t) { return t.folderId === id; }).length;
    UI.confirm('Supprimer le dossier',
      'Le dossier <b>' + e(f.name) + '</b> sera supprimé. ' +
      (dedans
        ? 'Ses ' + dedans + ' fiche(s) ne sont pas perdues : elles retournent dans « Sans dossier ».'
        : 'Il est vide.'),
      function () {
        A.set(function (s) {
          Object.keys(s.bank).forEach(function (k) {
            if (s.bank[k].folderId === id) s.bank[k].folderId = null;
          });
          delete s.bankFolders[id];
        });
      }, 'Supprimer');
  }
  function moveTo(tplId, folderId) {
    A.set(function (s) {
      if (s.bank[tplId]) s.bank[tplId].folderId = folderId || null;
    });
  }
  /* Menu déroulant de rangement, réutilisé dans la table et dans les fenêtres. */
  function folderOptions(sel, sansLabel) {
    return '<option value="">' + (sansLabel || 'Sans dossier') + '</option>' +
      folders().map(function (f) {
        return '<option value="' + f.id + '"' + (sel === f.id ? ' selected' : '') + '>' + e(f.name) + '</option>';
      }).join('');
  }

  /* Une fiche de banque = une situation sans ses données de séance. */
  function toTemplate(sit) {
    var t = JSON.parse(JSON.stringify(sit));
    delete t.attempts; delete t.progress; delete t.groups; delete t.bankId;
    delete t.duels;   // les oppositions dépendent des équipes du jour
    delete t.teams;   // idem pour les équipes composées pour un échauffement
    t.levels = (t.levels || []).map(function (lv) { return lv; });
    return t;
  }

  function toSituation(tpl) {
    var sit = JSON.parse(JSON.stringify(tpl));
    sit.id = A.uid('sit');
    sit.bankId = tpl.id;
    /* nouveaux identifiants de paliers : les messages déjà reçus par les élèves
       d'une leçon précédente ne doivent pas se mélanger avec ceux d'aujourd'hui */
    var map = {};
    sit.levels = (sit.levels || []).map(function (lv) {
      var nid = A.uid('lvl');
      map[lv.id] = nid;
      lv.id = nid;
      return lv;
    });
    sit.attempts = [];
    sit.progress = {};
    sit.groups = [];
    sit.duels = [];
    sit.teams = [];
    return sit;
  }

  /* ==================================================================== vue */

  function view() {
    var st = A.get();
    var filtre = st.ui.bankKind || 'tous';
    var list = all(filtre === 'tous' ? null : filtre);
    var l = A.currentLesson();
    var dossiers = folders();

    var h = '<div class="card"><div class="card-head"><div>' +
      '<h2>Banque de situations</h2>' +
      '<p class="muted small" style="margin:0">Prépare une situation une fois, réutilise-la autant de fois que tu veux. ' +
      'La banque garde les paliers, les seuils, les messages et les images — jamais les scores, qui restent attachés à chaque leçon. ' +
      'Les <b>dossiers</b> regroupent les variantes d\'un même exercice. Une fiche n\'est pas enfermée ' +
      'dans sa famille : au moment de l\'insérer, tu choisis si elle sert d\'échauffement ou de situation.</p>' +
      '</div><div class="row tight">' +
      '<label class="inline"><span class="small muted">Afficher</span>' +
      '<select data-chg="bank.kind">' +
      [['tous', 'Tout'], ['echauffement', 'Échauffements'], ['apprentissage', 'Situations']].map(function (o) {
        return '<option value="' + o[0] + '"' + (filtre === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
      }).join('') + '</select></label>' +
      '<button class="btn-primary" data-act="bank.new" data-kind="apprentissage">Nouvelle situation</button>' +
      '<button data-act="bank.new" data-kind="echauffement">Nouvel échauffement</button>' +
      '<button data-act="bank.folderNew">Nouveau dossier</button>' +
      '<button data-act="bank.export">Exporter la banque</button>' +
      '<button data-act="bank.import">Importer</button>' +
      '</div></div>';

    if (!list.length && !dossiers.length) {
      return h + UI.empty('Banque vide',
        'Crée une fiche ici, ou copie une situation existante depuis une leçon ' +
        '— le bouton « Copier dans la banque » se trouve sur chaque fiche.') + '</div>';
    }

    /* Une section par dossier, puis les fiches non rangées. */
    var groupes = dossiers.map(function (f) {
      return { id: f.id, name: f.name, items: list.filter(function (t) { return t.folderId === f.id; }) };
    });
    var orphelines = list.filter(function (t) { return !t.folderId || !folderById(t.folderId); });
    if (orphelines.length || !dossiers.length) {
      groupes.push({ id: null, name: 'Sans dossier', items: orphelines });
    }

    var ligne = function (t) {
      var tg = Object.keys(t.targets || {}).filter(function (k) { return t.targets[k] > 0; });
      return '<tr><td><b>' + e(t.name) + '</b> ' +
        UI.badge(TRAINING.KINDS[TRAINING.kindOf(t)].label, TRAINING.kindOf(t) === 'echauffement' ? 'warn' : '') +
        (TRAINING.isMatchFormat(t) ? ' ' + UI.badge('confrontation', 'accent') : '') +
        (t.consigne ? '<div class="tiny muted" style="white-space:pre-wrap">' + e(t.consigne.slice(0, 110)) + '</div>' : '') +
        '<div class="tiny muted">' + (TRAINING.isMatchFormat(t)
          ? (t.bonuses || []).length + ' bonus'
          : 'mesure en ' + e(t.unit || '—')) + '</div></td>' +
        '<td>' + (tg.length
          ? tg.map(function (cid) {
              var c = A.critById(cid);
              return c ? UI.badge(c.short || c.name, 'accent') : '';
            }).join(' ')
          : '<span class="badge warn">aucun</span>') + '</td>' +
        '<td class="num">' + (TRAINING.isMatchFormat(t) ? '<span class="muted">—</span>' : (t.levels || []).length) + '</td>' +
        '<td class="num">' + (t.uses || 0) + '</td>' +
        '<td><select data-chg="bank.folder" data-id="' + t.id + '" class="folder-pick" ' +
        'title="Ranger cette fiche dans un dossier">' + folderOptions(t.folderId || '') +
        '<option value="__new">＋ Nouveau dossier…</option></select></td>' +
        '<td class="num nowrap">' +
        (l ? '<button class="btn-sm btn-primary" data-act="bank.use" data-id="' + t.id + '">Ajouter à la leçon</button> ' : '') +
        '<button class="btn-sm" data-act="bank.edit" data-id="' + t.id + '">Modifier</button> ' +
        '<button class="btn-sm" data-act="bank.dup" data-id="' + t.id + '" title="Créer une variante à côté">Dupliquer</button> ' +
        '<button class="btn-sm btn-ghost btn-danger" data-act="bank.del" data-id="' + t.id + '">✕</button>' +
        '</td></tr>';
    };

    groupes.forEach(function (g) {
      h += '<div class="bank-folder">' +
        '<div class="bank-folder-head">' +
        '<h3>' + (g.id ? '📁 ' : '') + e(g.name) + '</h3>' +
        UI.badge(g.items.length + ' fiche' + (g.items.length > 1 ? 's' : '')) +
        '<div class="spacer"></div>' +
        (g.id
          ? '<button class="btn-sm btn-ghost" data-act="bank.folderRename" data-id="' + g.id + '">Renommer</button>' +
            '<button class="btn-sm btn-ghost btn-danger" data-act="bank.folderDel" data-id="' + g.id + '">Supprimer</button>'
          : '') +
        '</div>';

      if (!g.items.length) {
        h += '<p class="small muted" style="margin:0 0 6px">' +
          (g.id
            ? 'Dossier vide : range une fiche dedans avec le menu « dossier » de sa ligne.'
            : 'Toutes les fiches sont rangées.') + '</p>';
      } else {
        h += '<div class="table-wrap"><table><thead><tr>' +
          '<th>Situation</th><th>Critères alimentés</th><th class="num">Paliers</th>' +
          '<th class="num">Utilisations</th><th>Dossier</th><th></th></tr></thead><tbody>' +
          g.items.map(ligne).join('') + '</tbody></table></div>';
      }
      h += '</div>';
    });

    h += '<p class="small muted" style="margin-top:10px">' +
      (l
        ? 'Leçon en cours : <b>' + e(l.title) + '</b>. « Ajouter à la leçon » y insère une copie ; tu ajustes ensuite les critères alimentés sans toucher à la fiche d\'origine.'
        : 'Ouvre une leçon pour pouvoir insérer une situation directement depuis cette page.') +
      '</p>';

    return h + '</div>';
  }

  /* ================================================================ actions */

  function create(kind, folderId) {
    TRAINING.openEditor(TRAINING.newSituation(kind), {
      title: kind === 'echauffement' ? 'Nouvel échauffement en banque' : 'Nouvelle situation en banque',
      onSave: function (draft) {
        A.set(function (s) {
          var t = toTemplate(draft);
          t.id = A.uid('bnk');
          t.uses = 0;
          t.folderId = folderId || null;
          t.updatedAt = new Date().toISOString();
          s.bank[t.id] = t;
        });
        UI.toast('Fiche ajoutée à la banque.');
      }
    });
  }

  function edit(id) {
    var t = byId(id);
    if (!t) return;
    TRAINING.openEditor(t, {
      title: 'Modifier la fiche — ' + t.name,
      onSave: function (draft) {
        A.set(function (s) {
          var nt = toTemplate(draft);
          nt.id = t.id;
          nt.uses = t.uses || 0;
          nt.folderId = t.folderId || null;
          nt.updatedAt = new Date().toISOString();
          s.bank[t.id] = nt;
        });
        UI.toast('Fiche mise à jour. Les situations déjà insérées dans des leçons ne changent pas.');
      }
    });
  }

  /* Dupliquer sert surtout à créer une variante : la copie reste dans le même
     dossier que l'originale, prête à être ajustée. */
  function duplicate(id) {
    var t = byId(id);
    if (!t) return;
    A.set(function (s) {
      var c = toTemplate(t);
      c.id = A.uid('bnk');
      c.name = t.name + ' (variante)';
      c.folderId = t.folderId || null;
      c.uses = 0;
      s.bank[c.id] = c;
    });
    UI.toast('Variante créée' + (t.folderId ? ' dans « ' + folderName(t.folderId) + ' »' : '') + '.');
  }

  function remove(id) {
    var t = byId(id);
    if (!t) return;
    UI.confirm('Retirer de la banque', 'La fiche <b>' + e(t.name) + '</b> sera supprimée. ' +
      'Les situations déjà insérées dans des leçons sont conservées.', function () {
      A.set(function (s) { delete s.bank[id]; });
    }, 'Retirer');
  }

  /* Insertion dans la leçon en cours, avec ajustement des critères : c'est
     là que la même situation peut servir la Technique une semaine et la
     Défense la suivante. */
  function useInLesson(id) {
    var t = byId(id);
    var l = A.currentLesson();
    if (!t || !l) { UI.toast('Ouvre d\'abord une leçon.'); return; }
    var kind = TRAINING.kindOf(t);
    var crits = A.criteria();
    var targets = JSON.parse(JSON.stringify(t.targets || {}));

    var body = '<p class="small muted">« ' + e(t.name) + ' » va être copiée dans <b>' + e(l.title) + '</b>. ' +
      'Ajuste au besoin les critères qu\'elle alimente pour cette leçon — la fiche d\'origine n\'est pas modifiée.</p>' +
      /* Le même exercice sert souvent des deux côtés : une passe à 10 met en
         train un jour et devient un contenu d'apprentissage le lendemain. */
      '<label class="field"><span>Insérer comme</span><select name="kind">' +
      '<option value="echauffement"' + (kind === 'echauffement' ? ' selected' : '') + '>Échauffement</option>' +
      '<option value="apprentissage"' + (kind === 'echauffement' ? '' : ' selected') + '>Situation d\'apprentissage</option>' +
      '</select><span class="tiny muted">Une même fiche peut servir dans les deux onglets : ' +
      'la copie ira dans celui que tu choisis ici.</span></label>' +
      crits.map(function (c) {
        var v = Math.round((targets[c.id] || 0) * 100);
        return '<label class="field" style="margin-bottom:8px"><span>' + e(c.name) +
          ' — <b data-tv="' + c.id + '">' + v + ' %</b></span>' +
          '<input type="range" min="0" max="100" step="10" data-target="' + c.id + '" value="' + v + '"></label>';
      }).join('');

    UI.modal({
      title: 'Ajouter à la leçon', body: body, okLabel: 'Ajouter',
      onOpen: function (d) {
        d.querySelectorAll('[data-target]').forEach(function (el) {
          el.addEventListener('input', function () {
            var cid = el.getAttribute('data-target');
            targets[cid] = +el.value / 100;
            var b = d.querySelector('[data-tv="' + cid + '"]');
            if (b) b.textContent = el.value + ' %';
          });
        });
      },
      onOk: function (d) {
        var choisi = d.querySelector('[name=kind]').value === 'echauffement' ? 'echauffement' : 'apprentissage';
        A.set(function (s) {
          var sit = toSituation(t);
          sit.targets = targets;
          sit.kind = choisi;
          l.situations.push(sit);
          if (s.bank[t.id]) s.bank[t.id].uses = (s.bank[t.id].uses || 0) + 1;
          s.ui.view = 'lessons';
          s.ui.tab = choisi === 'echauffement' ? 'warmup' : 'training';
        });
        UI.toast('Fiche ajoutée dans ' + (choisi === 'echauffement' ? 'l\'échauffement' : 'les situations') + '.');
      }
    });
  }

  /* Depuis une situation de leçon : l'envoyer dans la banque (ou la mettre à jour). */
  function saveFromSituation(sitId) {
    var l = A.currentLesson();
    var sit = TRAINING.sitById(l, sitId);
    if (!sit) return;
    var existing = sit.bankId ? byId(sit.bankId) : null;

    var body = (existing
      ? '<p>Cette situation vient de la fiche <b>' + e(existing.name) + '</b>.</p>' +
        '<label class="inline" style="display:flex;margin-bottom:8px"><input type="radio" name="m" value="update" checked> ' +
        'Mettre à jour cette fiche avec la version actuelle</label>' +
        '<label class="inline" style="display:flex;margin-bottom:10px"><input type="radio" name="m" value="new"> ' +
        'Créer une nouvelle fiche à côté (une variante)</label>'
      : '<p>La situation <b>' + e(sit.name) + '</b> sera copiée dans la banque, sans ses scores : ' +
        'la fiche de la leçon continue sa vie de son côté.</p>') +
      '<label class="field" id="dosBloc"><span>Dossier</span>' +
      '<select name="dos">' + folderOptions(existing ? existing.folderId : null) + '</select>' +
      '<span class="tiny muted">Range les variantes d\'un même exercice ensemble. ' +
      'Tu peux aussi laisser « Sans dossier » et classer plus tard.</span></label>' +
      '<label class="field" id="dosNew"><span>…ou créer un dossier</span>' +
      '<input name="dosnom" placeholder="ex. Passe à 10"></label>';

    UI.modal({
      title: 'Copier dans la banque', body: body, okLabel: 'Copier',
      onOk: function (d) {
        var mode = d.querySelector('[name=m]:checked');
        var update = existing && mode && mode.value === 'update';
        var dossier = d.querySelector('[name=dos]').value || null;
        var nouveau = (d.querySelector('[name=dosnom]').value || '').trim();
        A.set(function (s) {
          if (nouveau) {
            var fid = A.uid('dos');
            s.bankFolders = s.bankFolders || {};
            s.bankFolders[fid] = { id: fid, name: nouveau, createdAt: new Date().toISOString() };
            dossier = fid;
          }
          var t = toTemplate(sit);
          t.id = update ? existing.id : A.uid('bnk');
          t.uses = update ? (existing.uses || 0) : 0;
          t.folderId = dossier;
          t.updatedAt = new Date().toISOString();
          if (!update) t.name = sit.name;
          s.bank[t.id] = t;
          sit.bankId = t.id;
        });
        UI.toast((update ? 'Fiche de banque mise à jour' : 'Copiée dans la banque') +
          (dossier ? ' — dossier « ' + folderName(dossier) + ' »' : '') + '.');
      }
    });
  }

  /* Échange de banque entre collègues : un simple fichier JSON. */
  function exportBank() {
    var list = all();
    if (!list.length) { UI.toast('La banque est vide.'); return; }
    A.download('banque-situations-' + A.todayISO() + '.json',
      JSON.stringify({ app: 'ultimate-eps', kind: 'bank', bank: list, folders: folders() }, null, 2));
    UI.toast(list.length + ' fiche(s) exportée(s).');
  }

  function importBank() {
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = function () {
      var f = inp.files && inp.files[0];
      if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var obj = JSON.parse(fr.result);
          var items = obj.kind === 'bank' ? obj.bank
            : (obj.bank ? Object.keys(obj.bank).map(function (k) { return obj.bank[k]; }) : null);
          if (!items || !items.length) throw new Error('aucune fiche trouvée dans ce fichier');
          var dos = obj.folders || [];
          A.set(function (s) {
            s.bankFolders = s.bankFolders || {};
            /* un dossier du même nom est réutilisé plutôt que dupliqué */
            var map = {};
            dos.forEach(function (f) {
              var deja = Object.keys(s.bankFolders).filter(function (k) {
                return s.bankFolders[k].name === f.name;
              })[0];
              if (deja) { map[f.id] = deja; return; }
              var fid = A.uid('dos');
              s.bankFolders[fid] = { id: fid, name: f.name, createdAt: new Date().toISOString() };
              map[f.id] = fid;
            });
            items.forEach(function (t) {
              var c = JSON.parse(JSON.stringify(t));
              c.id = A.uid('bnk');
              c.uses = 0;
              c.folderId = c.folderId ? (map[c.folderId] || null) : null;
              s.bank[c.id] = c;
            });
          });
          UI.toast(items.length + ' fiche(s) importée(s)' +
            (dos.length ? ' dans ' + dos.length + ' dossier(s)' : '') + '.');
        } catch (err) { UI.toast('Import impossible : ' + err.message); }
      };
      fr.readAsText(f, 'utf-8');
    };
    inp.click();
  }

  return {
    view: view, all: all, byId: byId, create: create, edit: edit,
    duplicate: duplicate, remove: remove, useInLesson: useInLesson,
    saveFromSituation: saveFromSituation, exportBank: exportBank, importBank: importBank,
