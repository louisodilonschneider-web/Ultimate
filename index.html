    var names = (members || []).map(function (sid) {
      var s = A.studentById(cls.id, sid); return s ? A.shortName(s) : '';
    }).join(', ');
    var info = ev.bandInfo;
    var body = '<div class="feedback band-' + ev.band + '">' +
      '<div class="row" style="margin-bottom:6px">' + UI.badge(info.icon + ' ' + info.label, info.cls) +
      '<span class="small muted">' + e(names) + '</span></div>' +
      '<p style="margin:0;white-space:pre-wrap"><b>' + e(ev.text) + '</b></p>' +
      (ev.image ? '<div class="img-slot"><img src="' + ev.image + '" alt="Illustration de la consigne"></div>' : '') +
      '</div>';
    body += KIOSK.nextLevelBlock(ev);
    body += '<p class="small muted">Ce message reste consultable : il te sera reproposé au prochain passage, et tu peux le rouvrir depuis la fiche de la situation.</p>';
    UI.modal({
      title: 'Retour sur ta performance', body: body, cancel: false, okLabel: 'J\'ai compris',
      onOk: function () {
        A.set(function () {
          (members || []).forEach(function (sid) { PROGRESS.dismissMessage(sit, sid, true); });
        });
        if (onClose) onClose();
      },
      onCancel: function () { if (onClose) onClose(); }
    });
  }

  function reopenMessage(sit, sid) {
    var m = PROGRESS.messageFor(sit, sid);
    if (!m) { UI.toast('Aucun message pour cet élève.'); return; }
    var info = PROGRESS.BANDS[m.band];
    showMessage(sit, {
      band: m.band, bandInfo: info, text: m.text, image: m.image || '', changed: m.changed,
      nextLevelName: m.nextLevelName, nextConsigne: m.nextConsigne
    }, [sid]);
  }

  return {
    view: view, edit: edit, editGroups: editGroups, recordAttempt: recordAttempt,
    showMessage: showMessage, reopenMessage: reopenMessage, sitById: sitById,
    projectGroups: projectGroups, openEditor: openEditor,
    newSituation: newSituation, autoGroups: autoGroups,
    KINDS: KINDS, kindOf: kindOf, ofKind: ofKind,
    formatOf: formatOf, isMatchFormat: isMatchFormat,
    ownTeams: ownTeams, teamsOf: teamsOf, teamById: teamById, terrainsOf: terrainsOf,
    makeDuels: makeDuels, liveDuels: liveDuels, duelsFor: duelsFor, move: move,
    fairCrit: fairCrit, fairUnits: fairUnits, toggleFair: toggleFair, editFairplay: editFairplay,
    switchKind: switchKind,
    planDuels: planDuels, applyDuelPlan: applyDuelPlan, duelRounds: duelRounds,
    editDuels: editDuels
  };
})();
</script>
<script>
/* ============================================================================
   Ultimate EPS — évaluation, auto-évaluation, notes
   ========================================================================== */
'use strict';

var EVAL = (function () {

  var A = APP, e = APP.escapeHtml;

  var SPECIAL = {
    __global__: 'Indice global (toutes sources)',
    __result__: 'Résultat des matchs (écarts de points)'
  };

  function defaultGrid() {
    var crits = A.criteria();
    return {
      id: A.uid('grd'),
      name: 'Grille ultimate — cycle collège',
      scale: 20,
      levels: JSON.parse(JSON.stringify(A.DEFAULT_LEVELS)),
      items: crits.map(function (c) {
        return { id: A.uid('itm'), label: c.name, critId: c.id, coef: /fair|esprit/i.test(c.name) ? 2 : 3 };
      }).concat([
        { id: A.uid('itm'), label: 'Investissement en match', critId: '__result__', coef: 1 }
      ])
    };
  }

  function gridsList() {
    var st = A.get();
    return Object.keys(st.grids).map(function (k) { return st.grids[k]; });
  }

  function maxPoints(grid) {
    return grid.levels[grid.levels.length - 1].points;
  }

  /* Proposition automatique de niveau à partir de l'indice calculé */
  function proposeLevel(grid, ratings, sid, item) {
    var v = null;
    if (item.critId === '__global__') v = ratings.byStudent[sid] ? ratings.byStudent[sid].index : null;
    else if (item.critId === '__result__') {
      var r = ratings.byStudent[sid];
      v = r && r.result.n ? RATINGS.display(r.result.z) : null;
    } else v = RATINGS.critDisplay(ratings, sid, item.critId);
    if (v == null) return null;
    var n = grid.levels.length;
    /* 0–10 découpé en n bandes, avec une petite marge de prudence */
    var i = A.clamp(Math.floor(v / (10 / n)), 0, n - 1);
    return i;
  }

  function noteOf(grid, marks) {
    var num = 0, den = 0;
    grid.items.forEach(function (it) {
      var li = marks ? marks[it.id] : null;
      var coef = +it.coef || 0;
      if (li == null || !coef) return;
      num += grid.levels[li].points * coef;
      den += maxPoints(grid) * coef;
    });
    if (!den) return null;
    return A.round(num / den * grid.scale, 1);
  }

  /* ==================================================================== vue */

  function view(l) {
    var st = A.get(), cls = st.classes[l.classId];
    var ratings = RATINGS.compute(cls.id);
    var grids = gridsList();
    l.evaluation = l.evaluation || { gridId: null, teacher: {}, self: {}, comments: {} };
    var grid = l.evaluation.gridId ? st.grids[l.evaluation.gridId] : null;

    var h = '<div class="row" style="margin-bottom:12px">' +
      '<label class="inline"><span class="small muted">Grille</span>' +
      '<select data-chg="eval.grid"><option value="">— aucune —</option>' +
      grids.map(function (g) {
        return '<option value="' + g.id + '"' + (grid && g.id === grid.id ? ' selected' : '') + '>' + e(g.name) + '</option>';
      }).join('') + '</select></label>' +
      '<button data-act="grid.new">Nouvelle grille</button>' +
      (grid ? '<button data-act="grid.edit">Modifier la grille</button>' : '') +
      '<div class="spacer"></div>' +
      (grid ? '<button data-act="eval.propose" class="btn-primary">Proposer les niveaux depuis les indices</button>' +
        '<button class="btn-kiosk" data-act="kiosk.open" data-mode="self">Mode kiosque — auto-évaluation</button>' +
        '<button data-act="eval.export">Exporter les notes</button>' : '') +
      '</div>';

    if (!grid) {
      return h + UI.empty('Aucune grille sélectionnée',
        'Crée ta grille d\'évaluation : des items, chacun rattaché à un critère et affecté d\'un coefficient. ' +
        'L\'application pourra ensuite proposer un niveau par élève à partir des données récoltées — tu gardes la main pour ajuster.');
    }

    var present = LESSON.presentStudents(l);
    var mx = maxPoints(grid);

    h += '<div class="notice">La proposition automatique n\'est qu\'un point de départ : elle traduit les indices en niveaux de maîtrise. ' +
      'Tu peux modifier chaque case. Les élèves dont la fiabilité est faible sont signalés — leur proposition vaut peu.</div>';

    h += '<div class="table-wrap"><table class="compact"><thead><tr><th>Élève</th>';
    grid.items.forEach(function (it) {
      h += '<th title="coefficient ' + it.coef + '">' + e(it.label) + '<br><span class="tiny muted">coef. ' + it.coef + '</span></th>';
    });
    h += '<th class="num">Note /' + grid.scale + '</th><th class="num">Auto-éval.</th><th class="num">Écart</th></tr></thead><tbody>';

    A.sortBy(present, function (s) { return (s.last + s.first).toLowerCase(); }).forEach(function (s) {
      var marks = l.evaluation.teacher[s.id] || {};
      var note = noteOf(grid, marks);
      var selfMarks = l.evaluation.self[s.id] || {};
      var selfNote = selfNoteOf(grid, selfMarks);
      var rel = ratings.byStudent[s.id] ? ratings.byStudent[s.id].reliability : null;
      h += '<tr><td class="nowrap"><b>' + e(A.displayName(s)) + '</b>' +
        (rel && rel.level === 'faible' ? ' ' + UI.badge('peu de données', 'warn') : '') + '</td>';
      grid.items.forEach(function (it) {
        var cur = marks[it.id];
        h += '<td><select data-chg="eval.mark" data-sid="' + s.id + '" data-item="' + it.id + '" style="min-height:34px;font-size:.82rem">' +
          '<option value="">–</option>' +
          grid.levels.map(function (lv, i) {
            return '<option value="' + i + '"' + (cur === i ? ' selected' : '') + '>' + e(lv.label) + '</option>';
          }).join('') + '</select></td>';
      });
      h += '<td class="num"><b>' + (note == null ? '–' : note.toFixed(1)) + '</b></td>' +
        '<td class="num muted">' + (selfNote == null ? '–' : selfNote.toFixed(1)) + '</td>' +
        '<td class="num">' + (note != null && selfNote != null
          ? (function () {
            var d = selfNote - note;
            var cl = Math.abs(d) <= 2 ? 'ok' : Math.abs(d) <= 4 ? 'accent' : 'warn';
            return UI.badge((d > 0 ? '+' : '') + A.round(d, 1), cl);
          })()
          : '<span class="muted">–</span>') + '</td></tr>';
    });
    h += '</tbody></table></div>';

    h += '<p class="small muted" style="margin-top:10px">L\'écart auto-évaluation / évaluation n\'est pas une erreur de l\'élève : c\'est un indicateur de lucidité, ' +
      'et un très bon support d\'entretien. Un écart systématiquement négatif signale souvent un manque de confiance plutôt qu\'un manque de compétence.</p>';
    return h;
  }

  function selfNoteOf(grid, selfMarks) {
    /* l'auto-évaluation se fait par critère, pas par item : on convertit */
    var num = 0, den = 0, mx = maxPoints(grid);
    grid.items.forEach(function (it) {
      var lv = selfMarks[it.critId];
      var coef = +it.coef || 0;
      if (lv == null || !coef) return;
      num += grid.levels[A.clamp(lv, 0, grid.levels.length - 1)].points * coef;
      den += mx * coef;
    });
    return den ? A.round(num / den * grid.scale, 1) : null;
  }

  /* ============================================================= grille */

  function editGrid(isNew) {
    var st = A.get(), l = A.currentLesson();
    var grid = isNew ? defaultGrid() : st.grids[l.evaluation.gridId];
    if (!grid) return;
    var draft = JSON.parse(JSON.stringify(grid));
    var crits = A.criteria();

    var critOpts = function (cur) {
      var s = crits.map(function (c) {
        return '<option value="' + c.id + '"' + (cur === c.id ? ' selected' : '') + '>' + e(c.name) + '</option>';
      }).join('');
      Object.keys(SPECIAL).forEach(function (k) {
        s += '<option value="' + k + '"' + (cur === k ? ' selected' : '') + '>' + e(SPECIAL[k]) + '</option>';
      });
      return s;
    };

    var itemsHtml = function () {
      return '<div class="table-wrap"><table class="compact"><thead><tr><th>Item</th><th>Rattaché à</th><th class="num">Coef.</th><th></th></tr></thead><tbody>' +
        draft.items.map(function (it, i) {
          return '<tr><td><input data-ik="label" data-i="' + i + '" value="' + e(it.label) + '" style="min-width:180px"></td>' +
            '<td><select data-ik="critId" data-i="' + i + '">' + critOpts(it.critId) + '</select></td>' +
            '<td class="num"><input type="number" min="0" max="10" data-ik="coef" data-i="' + i + '" value="' + it.coef + '" style="width:70px"></td>' +
            '<td><button type="button" class="btn-sm btn-ghost" data-irm="' + i + '">✕</button></td></tr>';
        }).join('') + '</tbody></table></div>';
    };

    var levelsHtml = function () {
      return draft.levels.map(function (lv, i) {
        return '<div class="row tight" style="margin-bottom:6px">' +
          '<input data-lk="label" data-i="' + i + '" value="' + e(lv.label) + '" style="flex:1">' +
          '<input type="number" data-lk="points" data-i="' + i + '" value="' + lv.points + '" style="width:80px">' +
          '</div>';
      }).join('');
    };

    UI.modal({
      title: isNew ? 'Nouvelle grille' : 'Modifier la grille',
      okLabel: 'Enregistrer',
      body: '<div class="grid cols-2">' +
        '<label class="field"><span>Nom de la grille</span><input name="gname" value="' + e(draft.name) + '"></label>' +
        '<label class="field"><span>Note sur</span><input type="number" name="scale" min="1" max="100" value="' + draft.scale + '"></label>' +
        '</div>' +
        '<fieldset><legend>Niveaux de maîtrise</legend><div id="lvls">' + levelsHtml() + '</div></fieldset>' +
        '<fieldset><legend>Items évalués</legend><div id="items">' + itemsHtml() + '</div>' +
        '<button type="button" class="btn-sm" id="additem">Ajouter un item</button>' +
        '<p class="small muted" style="margin-top:8px">Rattacher un item à un critère permet à l\'application de proposer un niveau à partir des données. ' +
        'Un item peut aussi être rattaché à l\'indice global ou au résultat des matchs.</p></fieldset>',
      onOpen: function (d) {
        var bind = function () {
          d.querySelectorAll('#items [data-ik]').forEach(function (el) {
            el.addEventListener('input', function () {
              var i = +el.getAttribute('data-i'), k = el.getAttribute('data-ik');
              draft.items[i][k] = k === 'coef' ? +el.value : el.value;
            });
            el.addEventListener('change', function () {
              var i = +el.getAttribute('data-i'), k = el.getAttribute('data-ik');
              draft.items[i][k] = k === 'coef' ? +el.value : el.value;
            });
          });
          d.querySelectorAll('[data-irm]').forEach(function (el) {
            el.addEventListener('click', function () {
              draft.items.splice(+el.getAttribute('data-irm'), 1);
              d.querySelector('#items').innerHTML = itemsHtml(); bind();
            });
          });
          d.querySelectorAll('#lvls [data-lk]').forEach(function (el) {
            el.addEventListener('input', function () {
              var i = +el.getAttribute('data-i'), k = el.getAttribute('data-lk');
              draft.levels[i][k] = k === 'points' ? +el.value : el.value;
            });
          });
        };
        bind();
        d.querySelector('#additem').addEventListener('click', function () {
          draft.items.push({ id: A.uid('itm'), label: 'Nouvel item', critId: crits[0] ? crits[0].id : '__global__', coef: 1 });
          d.querySelector('#items').innerHTML = itemsHtml(); bind();
        });
      },
      onOk: function (d) {
        draft.name = d.querySelector('[name=gname]').value.trim() || 'Grille';
        draft.scale = A.clamp(+d.querySelector('[name=scale]').value || 20, 1, 100);
        A.set(function (s) {
          s.grids[draft.id] = draft;
          l.evaluation.gridId = draft.id;
        });
      }
    });
  }

  function proposeAll() {
    var st = A.get(), l = A.currentLesson(), cls = st.classes[l.classId];
    var grid = st.grids[l.evaluation.gridId];
    if (!grid) return;
    var ratings = RATINGS.compute(cls.id);
    var present = LESSON.presentStudents(l);
    var filled = 0, skipped = 0;
    A.set(function () {
      present.forEach(function (s) {
        var marks = l.evaluation.teacher[s.id] = l.evaluation.teacher[s.id] || {};
        grid.items.forEach(function (it) {
          if (marks[it.id] != null) return;       // on n'écrase jamais une saisie manuelle
          var p = proposeLevel(grid, ratings, s.id, it);
          if (p == null) { skipped++; return; }
          marks[it.id] = p; filled++;
        });
      });
    });
    UI.toast(filled + ' cases proposées' + (skipped ? ', ' + skipped + ' sans donnée' : '') + '. Les cases déjà remplies n\'ont pas été touchées.');
  }

  function exportNotes() {
    var st = A.get(), l = A.currentLesson(), cls = st.classes[l.classId];
    var grid = st.grids[l.evaluation.gridId];
    if (!grid) return;
    var rows = [['Nom', 'Prénom'].concat(grid.items.map(function (i) { return i.label; }))
      .concat(['Note /' + grid.scale, 'Auto-évaluation', 'Écart'])];
    A.sortBy(cls.students, function (s) { return (s.last + s.first).toLowerCase(); }).forEach(function (s) {
      var marks = l.evaluation.teacher[s.id] || {};
      var note = noteOf(grid, marks);
      var sn = selfNoteOf(grid, l.evaluation.self[s.id] || {});
      rows.push([s.last, s.first].concat(grid.items.map(function (it) {
        var li = marks[it.id];
        return li == null ? '' : grid.levels[li].label;
      })).concat([note == null ? '' : String(note).replace('.', ','),
                  sn == null ? '' : String(sn).replace('.', ','),
                  (note != null && sn != null) ? String(A.round(sn - note, 1)).replace('.', ',') : '']));
    });
    A.download('notes-' + cls.name.replace(/\W+/g, '-') + '-' + l.date + '.csv',
      '﻿' + A.toCSV(rows), 'text/csv;charset=utf-8');
    UI.toast('Notes exportées.');
  }

  return {
    view: view, defaultGrid: defaultGrid, editGrid: editGrid, proposeAll: proposeAll,
    exportNotes: exportNotes, noteOf: noteOf, selfNoteOf: selfNoteOf, maxPoints: maxPoints,
    proposeLevel: proposeLevel, SPECIAL: SPECIAL
  };
})();
</script>
<script>
/* ============================================================================
   Ultimate EPS — vues de leçon : présences, composition des équipes, matchs
   ========================================================================== */
'use strict';

var LESSON = (function () {

  var A = APP, e = APP.escapeHtml;

  /* L'appel d'abord, puis les trois entrées possibles de la séance. */
  var TABS = [
    { k: 'presence', l: '1. Présences' },
    { k: 'teams', l: 'Équipes' },
    { k: 'warmup', l: 'Échauffement' },
    { k: 'training', l: 'Situations' },
    { k: 'matches', l: 'Matchs' }
  ];

  /* ================================================================= liste */

  function list() {
    var cls = A.currentClass();
    if (!cls) return UI.empty('Choisis une classe', 'Ouvre une classe depuis l\'onglet Classes.');
    var ls = A.classLessons(cls.id);
    var h = '<div class="card"><div class="card-head"><div><h2>Leçons — ' + e(cls.name) + '</h2>' +
      '<p class="muted small" style="margin:0">Un cycle se construit leçon après leçon : les indices évoluent à chaque séance.</p></div>' +
      '<button class="btn-primary" data-act="lesson.new">Nouvelle leçon</button></div>';
    if (!ls.length) {
      h += UI.empty('Aucune leçon', 'Crée ta première leçon pour préparer les situations et composer les équipes.');
    } else {
      h += '<div class="table-wrap"><table><thead><tr><th>#</th><th>Date</th><th>Titre</th><th>Objectif</th>' +
        '<th class="num">Présents</th><th class="num">Équipes</th><th class="num">Situations</th><th class="num">Matchs</th><th></th></tr></thead><tbody>';
      ls.slice().reverse().forEach(function (l) {
        var pres = Object.keys(l.attendance || {}).filter(function (k) { return l.attendance[k] === 'present'; }).length;
        h += '<tr data-act="lesson.open" data-id="' + l.id + '" style="cursor:pointer">' +
          '<td>' + l.number + '</td><td class="nowrap">' + e(A.frDate(l.date)) + '</td>' +
          '<td><b>' + e(l.title) + '</b></td><td class="small muted">' + e((l.objective || '').slice(0, 60)) + '</td>' +
          '<td class="num">' + pres + '</td><td class="num">' + (l.teams || []).length + '</td>' +
          '<td class="num">' + (l.situations || []).length + '</td><td class="num">' + (l.matches || []).length + '</td>' +
          '<td class="num nowrap"><button class="btn-sm btn-primary" data-act="lesson.open" data-id="' + l.id + '">Ouvrir</button> ' +
          '<button class="btn-sm btn-ghost btn-danger" data-act="lesson.del" data-id="' + l.id + '">✕</button></td></tr>';
      });
      h += '</tbody></table></div>';
    }
    return h + '</div>';
  }

  /* ================================================================ en-tête */

  function shell(inner) {
    var l = A.currentLesson();
    var st = A.get();
    var tab = st.ui.tab || 'presence';
    var h = '<div class="card"><div class="card-head"><div>' +
      '<h2 style="margin-bottom:2px">' + e(l.title) + '</h2>' +
      '<p class="muted small" style="margin:0">' + e(A.frDate(l.date)) + (l.objective ? ' · ' + e(l.objective) : '') + '</p>' +
      '</div><div class="row tight">' +
      '<button class="btn-sm" data-act="lesson.edit">Modifier l\'en-tête</button>' +
      '<button class="btn-sm" data-act="lesson.back">← Toutes les leçons</button>' +
      '</div></div>';
    h += '<div class="subnav">' + TABS.map(function (t) {
      return '<button data-act="lesson.tab" data-t="' + t.k + '" aria-current="' + (tab === t.k) + '">' + t.l + '</button>';
    }).join('') + '</div>';
    return h + inner + '</div>';
  }

  function view() {
    var l = A.currentLesson();
    if (!l) return list();
    var tab = A.get().ui.tab || 'presence';
    var inner =
      tab === 'teams' ? teams(l) :
      tab === 'warmup' ? TRAINING.view(l, 'echauffement') :
      tab === 'training' ? TRAINING.view(l, 'apprentissage') :
      tab === 'matches' ? matches(l) : presence(l);
    return shell(inner);
  }

  /* =============================================================== PRÉSENCES */

  var ROLES = ['', 'Arbitre', 'Observateur', 'Secrétaire', 'Coach'];

  function presence(l) {
    var cls = A.get().classes[l.classId];
    var r = RATINGS.compute(cls.id);
    var att = l.attendance || (l.attendance = {});
    var counts = { present: 0, absent: 0, injured: 0 };
    cls.students.forEach(function (s) {
      var v = att[s.id] || 'present';
      counts[v] = (counts[v] || 0) + 1;
    });

    var h = '<div class="row" style="margin-bottom:12px">' +
      '<div class="stat"><b>' + counts.present + '</b><span>présents</span></div>' +
      '<div class="stat"><b>' + counts.injured + '</b><span>blessés / dispensés</span></div>' +
      '<div class="stat"><b>' + counts.absent + '</b><span>absents</span></div>' +
      '<div class="spacer"></div>' +
      '<button class="btn-sm" data-act="att.all" data-v="present">Tous présents</button>' +
      '<button class="btn-sm" data-act="att.copyPrev">Reprendre la leçon précédente</button>' +
      '</div>';

    if (counts.injured) {
      h += '<div class="notice">Les élèves blessés ou dispensés peuvent tenir la feuille de statistiques en mode kiosque : ' +
        'ils restent dans l\'activité et tu récupères des données impossibles à collecter seul. Attribue-leur un rôle ci-dessous.<br>' +
        'Comme ils ne jouent pas, aucun score ne les concerne et leur indice resterait figé : ' +
        '<b>« Apprécier son rôle »</b> permet de créditer ce qu\'ils ont réellement fait — arbitrer, observer, ' +
        'coacher — sur les critères de ton choix.</div>';
    }

    h += '<p class="small muted" style="margin:-4px 0 10px">Tout le monde est présent par défaut. ' +
      'Touche un nom pour le passer en <b>absent</b>, touche-le encore pour <b>blessé</b>, une troisième fois pour revenir à présent.</p>';

    h += '<div class="att-grid">';
    A.sortBy(cls.students, function (s) { return (s.last + ' ' + s.first).toLowerCase(); }).forEach(function (s) {
      var v = att[s.id] || 'present';
      var idx = r.byStudent[s.id] ? r.byStudent[s.id].index : 5;
      var label = v === 'present' ? 'présent' : v === 'absent' ? 'absent' : 'blessé';
      h += '<div class="att-item ' + v + '" data-act="att.cycle" data-id="' + s.id + '" role="button" tabindex="0"' +
        ' title="Indice ' + A.round(idx, 1) + ' — touche pour changer">' +
        '<span class="nm">' + e(A.displayName(s)) + '</span>' +
        '<span class="att-state">' + label + '</span>' +
        '<span class="px">' + A.round(idx, 1).toFixed(1) + '</span>';
      if (v === 'injured') {
        var obs = (l.observations || {})[s.id] || {};
        var nObs = Object.keys(obs).filter(function (k) {
          return (+obs[k].plus || 0) + (+obs[k].minus || 0) > 0;
        }).length;
        h += '<select data-chg="role.set" data-id="' + s.id + '" class="att-role">' +
          ROLES.map(function (ro) {
            return '<option value="' + e(ro) + '"' + ((l.roles[s.id] || '') === ro ? ' selected' : '') + '>' + (ro || 'Rôle…') + '</option>';
          }).join('') + '</select>' +
          /* Un élève blessé ne joue pas : sans cela son indice ne bouge plus de
             la séance. L'appréciation du rôle tenu lui rend une prise. */
          '<button class="btn-sm att-obs' + (nObs ? ' is-on' : '') + '" data-act="obs.edit" data-id="' + s.id + '">' +
          (nObs ? '✓ apprécié' : 'Apprécier son rôle') + '</button>';
      }
      h += '</div>';
    });
    h += '</div>';

    /* Les trois entrées possibles de la séance, une fois l'appel fait. */
    var nEch = TRAINING.ofKind(l, 'echauffement').length;
    var nSit = TRAINING.ofKind(l, 'apprentissage').length;
    h += '<h4 style="margin-top:22px">Et maintenant ?</h4><div class="next-grid">' +
      [['teams', 'Équipes', 'Composer ou reprendre les équipes du jour.',
        (l.teams || []).length ? (l.teams.length + ' équipes composées') : 'à faire'],
       ['warmup', 'Échauffement', 'Une mise en train mesurable, avec saisie du résultat.',
        nEch ? (nEch + ' préparé(s)') : 'à préparer'],
       ['training', 'Situations', 'Lancer une situation d\'apprentissage et faire saisir les scores.',
        nSit ? (nSit + ' situation(s) préparée(s)') : 'à préparer'],
       ['matches', 'Matchs', 'Saisir les rencontres, les statistiques et le fair-play.',
        (l.matches || []).length ? ((l.matches || []).length + ' match(s)') : 'à créer']
      ].map(function (x) {
        return '<button class="next-card" data-act="lesson.tab" data-t="' + x[0] + '">' +
          '<b>' + e(x[1]) + '</b><span>' + e(x[2]) + '</span>' +
          '<span class="badge">' + e(x[3]) + '</span></button>';
      }).join('') + '</div>';

    return h;
  }

  /* ================================================================= ÉQUIPES */

  function presentStudents(l) {
    var cls = A.get().classes[l.classId];
    return cls.students.filter(function (s) { return (l.attendance[s.id] || 'present') === 'present'; });
  }

  function teams(l) {
    var st = A.get(), cls = st.classes[l.classId];
    var r = RATINGS.compute(cls.id);
    var cfg = l.teamConfig;
    var present = presentStudents(l);
    var n = present.length;

    var derived = cfg.mode === 'count'
      ? { count: A.clamp(cfg.teamCount, 1, 9), size: n ? A.round(n / A.clamp(cfg.teamCount, 1, 9), 1) : 0 }
      : { count: Math.max(1, Math.min(9, Math.round(n / Math.max(1, cfg.teamSize)))), size: cfg.teamSize };

    var h = '<div class="card" style="margin:0 0 14px;background:var(--surface-2);box-shadow:none">' +
      '<div class="grid cols-4">' +
      '<label class="field"><span>Mode</span><select data-chg="tc.mode">' +
      '<option value="count"' + (cfg.mode === 'count' ? ' selected' : '') + '>Je fixe le nombre d\'équipes</option>' +
      '<option value="size"' + (cfg.mode === 'size' ? ' selected' : '') + '>Je fixe la taille des équipes</option></select></label>' +
      (cfg.mode === 'count'
        ? '<label class="field"><span>Nombre d\'équipes (3 à 9)</span><input type="number" min="2" max="9" value="' + cfg.teamCount + '" data-chg="tc.count"></label>'
        : '<label class="field"><span>Élèves par équipe (2 à 7)</span><input type="number" min="2" max="7" value="' + cfg.teamSize + '" data-chg="tc.size"></label>') +
      '<label class="field"><span>Composition</span><select data-chg="tc.comp">' +
      '<option value="equilibre"' + (cfg.composition !== 'niveau' ? ' selected' : '') + '>Équilibré — équipes de force égale, mixtes de niveaux</option>' +
      '<option value="niveau"' + (cfg.composition === 'niveau' ? ' selected' : '') + '>Niveau — groupes homogènes, appariés deux à deux</option>' +
      '</select><span class="tiny muted">' +
      (cfg.composition === 'niveau'
        ? 'Chaque équipe réunit des élèves de même niveau, et trouve en face une équipe de force équivalente. Conseillé avec un nombre d\'équipes pair.'
        : 'Les équipes se valent entre elles, et chacune mélange les niveaux en son sein.') +
      '</span></label>' +
      '<label class="field"><span>Mixité</span><select data-chg="tc.mix">' +
      '<option value="mixte"' + (cfg.mixite === 'mixte' ? ' selected' : '') + '>Équipes mixtes équilibrées</option>' +
      '<option value="nonmixte"' + (cfg.mixite === 'nonmixte' ? ' selected' : '') + '>Équipes non mixtes</option>' +
      '<option value="libre"' + (cfg.mixite === 'libre' ? ' selected' : '') + '>Sans contrainte de mixité</option></select></label>' +
      '<label class="field"><span>Stabilité avec la leçon précédente — ' + cfg.stability + ' %</span>' +
      '<input type="range" min="0" max="100" value="' + cfg.stability + '" data-chg="tc.stab">' +
      '<span class="tiny muted">0 = rebrassage complet · 100 = on ne change que le strict nécessaire</span></label>' +
      '</div>' +
      '<div class="row">' +
      '<button class="btn-primary" data-act="teams.compose">Composer les équipes</button>' +
      (previousTeams(l) ? '<button data-act="teams.reuse">Reprendre celles de la leçon précédente</button>' : '') +
      (l.teams && l.teams.length ? '<button data-act="teams.project">Affichage à projeter</button>' +
        '<button data-act="teams.clear" class="btn-ghost btn-danger">Effacer</button>' : '') +
      '<div class="spacer"></div>' +
      '<span class="small muted">' + n + ' présents → ' + derived.count + ' équipes de ' + derived.size + '</span>' +
      '</div></div>';

    if (!n) return h + UI.empty('Aucun élève présent', 'Renseigne d\'abord les présences.');

    if (!l.teams || !l.teams.length) {
      return h + UI.empty('Équipes non composées',
        'Règle les paramètres ci-dessus puis clique sur « Composer les équipes ». ' +
        'Tu pourras ensuite déplacer les élèves à la main : sur tablette, touche un élève puis touche l\'équipe d\'arrivée.');
    }

    var indexOf = function (sid) { return r.byStudent[sid] ? r.byStudent[sid].index : 5; };
    var sexOf = function (sid) { var s = A.studentById(cls.id, sid); return s ? s.sex : 'X'; };
    var prev = previousTeams(l);
    /* Les indicateurs d'équilibre ne comptent que les joueurs du jour : un
       élève devenu blessé ne compte plus dans l'effectif ni dans la moyenne. */
    var equipesJouantes = l.teams.map(function (t) {
      return { id: t.id, name: t.name, color: t.color, members: RATINGS.playing(l, t.members) };
    });
    var rep = TEAMS.evaluate(equipesJouantes, indexOf, sexOf, cls.constraints, prev);

    /* Bandeau de diagnostic */
    var spreadCls = rep.spread <= 0.4 ? 'ok' : rep.spread <= 0.9 ? 'accent' : 'warn';
    h += '<div class="row" style="margin-bottom:12px">' +
      '<div class="stat"><b>' + rep.spread.toFixed(2) + '</b><span>écart max entre équipes</span></div>' +
      '<div class="stat"><b>' + rep.meanOfMeans.toFixed(2) + '</b><span>indice moyen</span></div>' +
      (rep.churn ? '<div class="stat"><b>' + rep.churn.moved + '/' + rep.churn.total + '</b><span>élèves qui changent d\'équipe</span></div>' : '') +
      '<div class="spacer"></div>' + UI.badge(
        spreadCls === 'ok' ? 'équipes très équilibrées' : spreadCls === 'accent' ? 'équilibre correct' : 'équilibre perfectible', spreadCls) +
      '</div>';

    if (rep.violations.length) {
      h += '<div class="notice bad"><b>Contraintes non respectées :</b><ul style="margin:6px 0 0 18px">' +
        rep.violations.map(function (v) {
          var a = A.studentById(cls.id, v.pair[0]), b = A.studentById(cls.id, v.pair[1]);
          return '<li>' + e(A.displayName(a)) + ' et ' + e(A.displayName(b)) + ' devraient être ' +
            (v.type === 'apart' ? 'séparés' : 'ensemble') + '.</li>';
        }).join('') + '</ul></div>';
    }

    var sel = st.ui.selectedPlayer;
    if (sel) {
      var ss = A.studentById(cls.id, sel);
      h += '<div class="notice"><b>' + e(A.displayName(ss)) + '</b> est sélectionné — touche maintenant l\'équipe d\'arrivée. ' +
        '<button class="btn-sm btn-ghost" data-act="teams.unselect">Annuler</button></div>';
    }

    h += '<div class="teams-grid">';
    var thinCount = 0;
    l.teams.forEach(function (tm, ti) {
      var info = rep.teams[ti];
      /* Moins de 4 joueurs : l'équipe est signalée par un fond bleu clair, pour
         qu'on la repère d'un coup d'œil après le retrait des absents. */
      var thin = RATINGS.playing(l, tm.members).length < 4;
      if (thin) thinCount++;
      h += '<div class="team' + (thin ? ' team-thin' : '') + '" style="--team:' + tm.color + '" data-act="teams.drop" data-team="' + tm.id + '">' +
        '<div class="team-head"><span class="tname" style="color:' + tm.color + '">' + e(tm.name) + '</span>' +
        '<button class="btn-sm btn-ghost team-swatch" data-act="team.color" data-team="' + tm.id + '" ' +
        'title="Changer la couleur de chasuble" style="background:' + tm.color + '"></button></div>' +
        '<div class="team-meta">' +
        UI.badge(info.size + (info.size > 1 ? ' joueurs' : ' joueur'), thin ? 'accent' : '') +
        UI.badge('moy. ' + info.mean.toFixed(1)) +
        (info.girls + info.boys > 0 ? UI.badge(info.girls + 'F / ' + info.boys + 'G') : '') +
        (thin ? UI.badge('effectif à compléter', 'accent') : '') +
        '</div>';
      tm.members.forEach(function (sid) {
        var s = A.studentById(cls.id, sid);
        if (!s) return;
        /* Un élève déclaré blessé ou absent après la composition reste inscrit
           dans l'équipe, mais il ne joue pas : on l'affiche dans l'équipe des
           dispensés, plus bas, et plus ici. */
        if ((l.attendance[sid] || 'present') !== 'present') return;
        var idx = indexOf(sid);
        h += '<div class="player' + (sel === sid ? ' selected' : '') + '" draggable="true" data-act="teams.pick" data-id="' + sid + '">' +
          '<span class="pn">' + e(A.displayName(s)) + '</span>' + UI.sexMark(s.sex) +
          '<span class="px">' + idx.toFixed(1) + '</span></div>';
      });
      h += '</div>';
    });
    /* --------------------------------------------- l'équipe des dispensés
       Une équipe à part entière à l'écran, mais qui n'existe pour aucun
       appariement : elle n'est pas dans l.teams, donc ni le tournoi, ni les
       confrontations d'échauffement, ni les relevés ne peuvent l'atteindre.
       Ses membres ne voient leur indice bouger que par l'appréciation de leur
       rôle — c'est exactement ce qu'on veut d'un élève qui ne joue pas. */
    var dispenses = cls.students.filter(function (s) {
      return (l.attendance[s.id] || 'present') === 'injured';
    });
    if (dispenses.length) {
      h += '<div class="team team-dispense" style="--team:var(--warn)">' +
        '<div class="team-head"><span class="tname" style="color:var(--warn)">Dispensés</span>' +
        UI.badge(dispenses.length + (dispenses.length > 1 ? ' élèves' : ' élève'), 'warn') + '</div>' +
        '<p class="tiny muted" style="margin:0 0 8px">Ils ne rencontrent aucune équipe et ne reçoivent ' +
        'aucun relevé de match. Leur indice n\'évolue que par l\'appréciation de leur rôle.</p>';
      dispenses.forEach(function (s) {
        var role = (l.roles || {})[s.id] || '';
        var obs = (l.observations || {})[s.id] || {};
        var nObs = Object.keys(obs).filter(function (k) {
          return (+obs[k].plus || 0) + (+obs[k].minus || 0) > 0;
        }).length;
        h += '<div class="player dispense-row">' +
          '<div class="dispense-nom"><span class="pn">' + e(A.displayName(s)) + '</span>' +
          UI.sexMark(s.sex) + '<span class="px">' + indexOf(s.id).toFixed(1) + '</span></div>' +
          '<div class="dispense-actions">' +
          '<select data-chg="role.set" data-id="' + s.id + '" class="att-role">' +
          ROLES.map(function (ro) {
            return '<option value="' + e(ro) + '"' + (role === ro ? ' selected' : '') + '>' + (ro || 'Rôle…') + '</option>';
          }).join('') + '</select>' +
          '<button class="btn-sm att-obs' + (nObs ? ' is-on' : '') + '" data-act="obs.edit" data-id="' + s.id + '">' +
          (nObs ? '✓ apprécié' : 'Apprécier') + '</button>' +
          '</div></div>';
      });
      h += '</div>';
    }

    h += '</div>';

    if (thinCount) {
      h += '<div class="notice" style="margin-top:12px"><b>' + thinCount + ' équipe' + (thinCount > 1 ? 's comptent' : ' compte') +
        ' moins de 4 joueurs</b> — signalée' + (thinCount > 1 ? 's' : '') + ' en bleu ci-dessus. ' +
        'Déplace des élèves, ou réduis le nombre d\'équipes puis recompose.</div>';
    }

    h += '<p class="small muted" style="margin-top:12px">Glisse un élève d\'une équipe à l\'autre (souris), ou touche-le puis touche l\'équipe d\'arrivée (tablette). ' +
      'Les indicateurs se recalculent immédiatement.</p>';
    return h;
  }

  /* Les matchs déjà saisis désignent les équipes par leur identifiant. Quand on
     recompose ou qu'on reprend les équipes de la semaine passée, on réutilise
     donc les identifiants existants, emplacement par emplacement : le tableau
     des scores et les statistiques restent rattachés aux bonnes équipes. */
  function keepTeamIds(l, teams) {
    var old = l.teams || [];
    var out = teams.map(function (t, i) {
      if (old[i]) {
        t.id = old[i].id;
        if (old[i].renamed) { t.name = old[i].name; t.renamed = true; }
      }
      return t;
    });
    /* Si le nombre d'équipes diminue, les matchs qui désignaient une équipe
       disparue n'ont plus de sens : on les retire en prévenant. */
    var alive = {};
    out.forEach(function (t) { alive[t.id] = 1; });
    var before = (l.matches || []).length;
    l.matches = (l.matches || []).filter(function (m) { return alive[m.teamA] && alive[m.teamB]; });
    if (before && l.matches.length < before) {
      setTimeout(function () {
        UI.toast((before - l.matches.length) + ' match(s) supprimé(s) : leur équipe n\'existe plus.');
      }, 400);
    }
    return out;
  }

  function previousTeams(l) {
    var ls = A.classLessons(l.classId);
    var prev = null;
    for (var i = 0; i < ls.length; i++) {
      if (ls[i].id === l.id) break;
      if (ls[i].teams && ls[i].teams.length) prev = ls[i].teams;
    }
    return prev;
  }

  /* Fabrique des équipes à partir des présents, sans rien enregistrer.
     Sert à la fois aux équipes de la leçon et à celles qu'un échauffement
     peut se composer pour lui seul. `graine` distingue deux tirages successifs
     avec les mêmes réglages, pour qu'un second clic rebrasse vraiment. */
  function composeTeams(l, cfg, graine) {
    var cls = A.get().classes[l.classId];
    var r = RATINGS.compute(cls.id);
    var present = presentStudents(l);
    var n = present.length;
    var count = cfg.mode === 'count'
      ? A.clamp(cfg.teamCount, 1, 9)
      : A.clamp(Math.round(n / Math.max(1, cfg.teamSize)), 1, 9);

    var res = TEAMS.compose({
      students: present.map(function (s) {
        return { id: s.id, sex: s.sex, index: r.byStudent[s.id] ? r.byStudent[s.id].index : 5, label: A.displayName(s) };
      }),
      teamCount: count,
      mixite: cfg.mixite,
      composition: cfg.composition || 'equilibre',
      stability: cfg.composition === 'niveau' ? 0 : (cfg.stability || 0),
      constraints: cls.constraints,
      previousTeams: cfg.previousTeams || [],
      minSize: A.MIN_TEAM_SIZE, maxSize: A.MAX_TEAM_SIZE,
      seed: (graine || l.id) + ':' + n + ':' + count + ':' + cfg.mixite + ':' +
        (cfg.composition || '') + ':' + (cfg.stability || 0)
    });
    res.count = count;
    res.present = n;
    return res;
  }

  function compose() {
    var l = A.currentLesson();
    var cfg = l.teamConfig;
    var res = composeTeams(l, {
      mode: cfg.mode, teamCount: cfg.teamCount, teamSize: cfg.teamSize,
      mixite: cfg.mixite, composition: cfg.composition, stability: cfg.stability,
      previousTeams: previousTeams(l)
    }, l.id + ':' + (l.composeCount || 0));

    A.set(function () {
      l.teams = keepTeamIds(l, res.teams);
      l.composeCount = (l.composeCount || 0) + 1;
    });
    if (res.warnings.length) UI.toast(res.warnings[0]);
    else UI.toast(res.count + ' équipes composées.');
  }

  /* Reprise à l'identique des équipes de la dernière leçon qui en avait :
     on retire les absents du jour, on remet les revenants dans leur équipe
     d'origine, et on place les nouveaux dans l'équipe la moins fournie. */
  function reusePrevious() {
    var l = A.currentLesson();
    var prev = previousTeams(l);
    if (!prev) { UI.toast('Aucune leçon précédente avec des équipes.'); return; }
    var cls = A.get().classes[l.classId];
    var r = RATINGS.compute(cls.id);
    var present = presentStudents(l).map(function (s) { return s.id; });

    var teams = prev.map(function (t, i) {
      return {
        id: A.uid('tm'), name: t.name, color: t.color || A.TEAM_COLORS[i % 9],
        members: t.members.filter(function (sid) { return present.indexOf(sid) > -1; })
      };
    });
    /* Qui disparaît des équipes de la semaine passée, et pourquoi */
    var removed = { absent: 0, injured: 0 };
    prev.forEach(function (t) {
      t.members.forEach(function (sid) {
        if (present.indexOf(sid) > -1) return;
        var stt = l.attendance[sid];
        if (stt === 'injured') removed.injured++;
        else if (stt === 'absent') removed.absent++;
      });
    });

    var placed = {};
    teams.forEach(function (t) { t.members.forEach(function (m) { placed[m] = 1; }); });
    var newcomers = present.filter(function (sid) { return !placed[sid]; });
    newcomers.forEach(function (sid) {
      var best = teams[0];
      teams.forEach(function (t) { if (t.members.length < best.members.length) best = t; });
      if (best) best.members.push(sid);
    });
    teams = teams.filter(function (t) { return t.members.length; });
    teams.forEach(function (t) {
      t.members.sort(function (a, b) {
        return (r.byStudent[b] ? r.byStudent[b].index : 5) - (r.byStudent[a] ? r.byStudent[a].index : 5);
      });
    });

    A.set(function () {
      l.teams = keepTeamIds(l, teams);
      l.teamConfig.teamCount = teams.length;
      l.teamConfig.mode = 'count';
    });
    var parts = [];
    if (removed.absent) parts.push(removed.absent + ' absent' + (removed.absent > 1 ? 's' : '') + ' retiré' + (removed.absent > 1 ? 's' : ''));
    if (removed.injured) parts.push(removed.injured + ' blessé' + (removed.injured > 1 ? 's' : '') + ' retiré' + (removed.injured > 1 ? 's' : ''));
    if (newcomers.length) parts.push(newcomers.length + ' élève' + (newcomers.length > 1 ? 's replacés' : ' replacé'));
    var thin = teams.filter(function (t) { return t.members.length < 4; }).length;
    if (thin) parts.push(thin + ' équipe' + (thin > 1 ? 's' : '') + ' sous 4 joueurs');
    UI.toast('Équipes reprises' + (parts.length ? ' · ' + parts.join(' · ') : '') + '.');
  }

  function movePlayer(sid, teamId) {
    var l = A.currentLesson();
    A.set(function (st) {
      l.teams.forEach(function (tm) {
        var i = tm.members.indexOf(sid);
        if (i > -1) tm.members.splice(i, 1);
      });
      l.teams.forEach(function (tm) { if (tm.id === teamId) tm.members.push(sid); });
      st.ui.selectedPlayer = null;
    });
  }

  function project() {
    var l = A.currentLesson(), cls = A.get().classes[l.classId];
    var h = '<div style="padding:20px"><h1 style="text-align:center">' + e(l.title) + ' — Équipes</h1><div class="teams-grid">';
    l.teams.forEach(function (tm) {
      h += '<div class="team" style="--team:' + tm.color + '"><div class="team-head"><span class="tname" style="color:' + tm.color + ';font-size:1.2rem">' +
        e(tm.name) + '</span></div>';
      tm.members.forEach(function (sid) {
        var s = A.studentById(cls.id, sid);
        if (s) h += '<div class="player" style="font-size:1.05rem"><span class="pn">' + e(A.shortName(s)) + '</span></div>';
      });
      h += '</div>';
    });
    h += '</div><p class="center no-print"><button onclick="window.print()">Imprimer</button> ' +
      '<button data-act="project.close">Fermer</button></p></div>';
    var wrap = document.createElement('div');
    wrap.className = 'kiosk-root';
    wrap.id = 'projector';
    wrap.innerHTML = h;
    document.body.appendChild(wrap);
  }

  /* ================================================================== MATCHS
     Les rencontres sont organisées en TOURS : autant de matchs simultanés que
     de terrains disponibles — deux par défaut, mais un gymnase peut en offrir
     un seul comme quatre. Les équipes qui ne jouent pas pendant un tour sont
     affichées comme observatrices : ce sont elles qui tiennent les feuilles de
     statistiques et arbitrent. */

  /* Nombre de terrains en service. Une leçon peut s'écarter du réglage général
     (`settings.terrains`) : le gymnase n'est pas toujours entier. */
  var PER_ROUND = A.TERRAINS;     // valeur de repli, conservée pour compatibilité

  function terrainsOf(l) {
    var g = +A.get().settings.terrains || A.TERRAINS;
    var v = (l && l.terrains != null) ? +l.terrains : g;
    return A.clamp(v || A.TERRAINS, 1, A.MAX_TERRAINS);
  }
  function setTerrains(l, n) {
    A.set(function () { l.terrains = A.clamp(+n || A.TERRAINS, 1, A.MAX_TERRAINS); });
  }
  function terrainMot(n) { return n + ' terrain' + (n > 1 ? 's' : ''); }

  function defaultScoring() {
    return { goalValue: 1, bonuses: [] };
  }

  /* Feuille de relevé de la leçon : quels compteurs, comment ils s'appellent,
     lesquels rapportent des points, et quels bonus de combinaison existent. */
  function matchConfig(l) {
    if (!l.matchConfig) {
      l.matchConfig = A.defaultMatchConfig();
      /* reprise des anciennes leçons, où le barème vivait dans chaque match */
      var first = (l.matches || [])[0];
      if (first && first.scoring) {
        l.matchConfig.goalValue = first.scoring.goalValue || 1;
        l.matchConfig.bonuses = (first.scoring.bonuses || []).map(function (b) {
          return { id: A.uid('bon'), name: b.name, points: b.value, desc: '' };
        });
      }
    }
    var c = l.matchConfig;
    if (!c.fields || !c.fields.length) c.fields = A.defaultMatchConfig().fields;
    c.matchesPerRound = terrainsOf(l);   // autant que de terrains en service
    if (c.goalValue == null) c.goalValue = 1;
    c.bonuses = c.bonuses || [];
    return c;
  }

  function activeFields(l) {
    return matchConfig(l).fields.filter(function (f) { return f.on !== false; });
  }
  function scoringFields(l) {
    return activeFields(l).filter(function (f) { return +f.points > 0; });
  }

  /* Répartition des matchs en tours, sans qu'une équipe joue deux fois dans
     le même tour. */
  function rounds(l) {
    var per = terrainsOf(l);
    var out = [];

    var fits = function (k, m) {
      if (out[k].items.length >= per) return false;
      var busy = {};
      out[k].items.forEach(function (x) { busy[x.m.teamA] = 1; busy[x.m.teamB] = 1; });
      return !busy[m.teamA] && !busy[m.teamB];
    };

    (l.matches || []).forEach(function (m, i) {
      var r = m.round;
      if (r != null) {
        while (out.length < r) out.push({ n: out.length + 1, items: [] });
        /* Un tour ne peut pas contenir plus de matchs que de terrains : si celui
           demandé est plein, on descend au tour suivant qui a de la place. */
        var k = r - 1;
        while (k < out.length && !fits(k, m)) k++;
        if (k >= out.length) out.push({ n: out.length + 1, items: [] });
        out[k].items.push({ m: m, i: i });
        return;
      }
      /* match sans tour : premier tour libre où ses deux équipes ne jouent pas */
      for (var j = 0; j < out.length; j++) {
        if (fits(j, m)) { out[j].items.push({ m: m, i: i }); return; }
      }
      out.push({ n: out.length + 1, items: [{ m: m, i: i }] });
    });

    out = out.filter(function (rd) { return rd.items.length; });
    out.forEach(function (rd, k) { rd.n = k + 1; });
    out.forEach(function (rd) {
      var playing = {};
      rd.items.forEach(function (x) { playing[x.m.teamA] = 1; playing[x.m.teamB] = 1; });
      rd.observers = (l.teams || []).filter(function (t) { return !playing[t.id]; });
    });
    return out;
  }

  function matches(l) {
    var st = A.get(), cls = st.classes[l.classId];
    if (!l.teams || l.teams.length < 2) {
      return UI.empty('Compose d\'abord les équipes', 'Le tableau des scores a besoin d\'au moins deux équipes.');
    }
    var cfg = matchConfig(l);
    var teamName = function (id) {
      for (var i = 0; i < l.teams.length; i++) if (l.teams[i].id === id) return l.teams[i].name;
      return '?';
    };
    var teamColor = function (id) {
      for (var i = 0; i < l.teams.length; i++) if (l.teams[i].id === id) return l.teams[i].color;
      return 'var(--accent)';
    };

    var h = '<div class="row" style="margin-bottom:12px">' +
      '<button class="btn-primary" data-act="match.add">Ajouter un match</button>' +
      '<button data-act="match.roundrobin">Générer le tournoi</button>' +
      '<button data-act="match.config">Modifier les relevés</button>' +
      '<label class="inline-field" title="Nombre de rencontres qui se jouent en même temps">' +
      '<span class="small muted">Terrains</span>' +
      '<input type="number" min="1" max="' + A.MAX_TERRAINS + '" value="' + terrainsOf(l) +
      '" data-chg="match.terrains" style="width:64px"></label>' +
      '<div class="spacer"></div>' +
      '<button class="btn-kiosk" data-act="kiosk.open" data-mode="match">Mode kiosque — les élèves saisissent</button>' +
      '</div>';

    /* Rappel de la feuille de relevé en vigueur */
    h += '<div class="row tight" style="margin-bottom:12px">' +
      '<span class="small muted nowrap">Relevés :</span>' +
      activeFields(l).map(function (f) {
        return UI.badge(f.short + ' · ' + f.label + (+f.points > 0 ? ' (+' + f.points + ' au score)' : ''),
          +f.points > 0 ? 'ok' : '');
      }).join('') +
      cfg.bonuses.map(function (b) {
        return '<span class="badge badge-bonus">★ ' + e(b.name) + ' · +' + b.points + '</span>';
      }).join('') +
      '<span class="badge">but = ' + cfg.goalValue + ' pt' + (cfg.goalValue > 1 ? 's' : '') + '</span>' +
      '<span class="badge">' + terrainsOf(l) + ' match' + (terrainsOf(l) > 1 ? 's' : '') +
      ' par tour</span>' +
      '</div>';

    if (!l.matches.length) {
      h += UI.empty('Aucun match',
        'Génère le tournoi : les rencontres seront réparties en tours de ' +
        terrainsOf(l) + ' match' + (terrainsOf(l) > 1 ? 's' : '') +
        ' (autant que de terrains), et les équipes qui ne jouent pas seront désignées comme observatrices.');
    }

    /* --------------------------------------------------------- classement */
    if (l.matches.some(function (m) { return m.scoreA != null && m.scoreB != null; })) {
      var tab = {};
      l.teams.forEach(function (t) { tab[t.id] = { id: t.id, j: 0, v: 0, n: 0, d: 0, pp: 0, pc: 0 }; });
      l.matches.forEach(function (m) {
        if (m.scoreA == null || m.scoreB == null) return;
        var a = tab[m.teamA], b = tab[m.teamB];
        if (!a || !b) return;
        a.j++; b.j++; a.pp += +m.scoreA; a.pc += +m.scoreB; b.pp += +m.scoreB; b.pc += +m.scoreA;
        if (+m.scoreA > +m.scoreB) { a.v++; b.d++; }
        else if (+m.scoreA < +m.scoreB) { b.v++; a.d++; }
        else { a.n++; b.n++; }
      });
      Object.keys(tab).forEach(function (k) { tab[k].pts = tab[k].v * 3 + tab[k].n * 2 + tab[k].d * 1; });
      var rows = A.sortBy(Object.keys(tab).map(function (k) { return tab[k]; }), function (t) {
        return t.pts + (t.pp - t.pc) / 1000;
      }, true);
      h += '<div class="card" style="margin:0 0 14px;background:var(--surface-2);box-shadow:none">' +
        '<div class="card-head" style="margin-bottom:8px"><h3>Classement de la leçon</h3>' +
        '<span class="small muted">victoire 3 pts · nul 2 pts · défaite 1 pt</span></div>' +
        '<div class="table-wrap"><table class="compact"><thead><tr>' +
        '<th>Équipe</th><th class="num">Pts</th><th class="num">J</th><th class="num">V</th><th class="num">N</th><th class="num">D</th>' +
        '<th class="num">Pour</th><th class="num">Contre</th><th class="num">Diff.</th></tr></thead><tbody>';
      rows.forEach(function (t) {
        h += '<tr><td><b style="color:' + teamColor(t.id) + '">' + e(teamName(t.id)) + '</b></td>' +
          '<td class="num"><b>' + t.pts + '</b></td>' +
          '<td class="num">' + t.j + '</td><td class="num">' + t.v + '</td><td class="num">' + t.n + '</td><td class="num">' + t.d + '</td>' +
          '<td class="num">' + t.pp + '</td><td class="num">' + t.pc + '</td><td class="num">' + (t.pp - t.pc > 0 ? '+' : '') + (t.pp - t.pc) + '</td></tr>';
      });
      h += '</tbody></table></div></div>';
    }

    /* ------------------------------------------------------ tours de jeu */
    rounds(l).forEach(function (rd) {
      h += '<div class="round"><div class="round-head">' +
        '<h3>Tour ' + rd.n +
        (rd.items.length > 1
          ? ' <button class="btn-sm" data-act="round.stats" data-r="' + rd.n + '">Relevés des ' +
            rd.items.length + ' matchs</button>'
          : '') + '</h3>' +
        (rd.observers.length
          ? '<div class="observers"><span class="small muted">Observent et arbitrent :</span>' +
            rd.observers.map(function (t) {
              return '<span class="badge" style="border-color:' + t.color + ';color:' + t.color + '">' + e(t.name) + '</span>';
            }).join('') + '</div>'
          : '<span class="small muted">Toutes les équipes jouent</span>') +
        '</div>';

      rd.items.forEach(function (x) {
        var m = x.m, mi = x.i;
        h += '<div class="card" style="margin:0 0 10px">' +
          '<div class="card-head"><h3 style="margin:0">' +
          '<span style="color:' + teamColor(m.teamA) + '">' + e(teamName(m.teamA)) + '</span> contre ' +
          '<span style="color:' + teamColor(m.teamB) + '">' + e(teamName(m.teamB)) + '</span></h3>' +
          '<div class="row tight">' +
          '<label class="inline small muted">Tour <input type="number" min="1" max="20" style="width:64px" value="' + rd.n +
          '" data-chg="match.round" data-i="' + mi + '"></label>' +
          '<button class="btn-sm" data-act="match.stats" data-i="' + mi + '">Relevés</button>' +
          '<button class="btn-sm btn-danger" data-act="match.reset" data-i="' + mi + '" title="Effacer score, relevés et fair-play">Réinitialiser</button>' +
          '<button class="btn-sm btn-ghost btn-danger" data-act="match.del" data-i="' + mi + '">✕</button>' +
          '</div></div>' +
          '<div class="row">' +
          '<label class="inline"><span class="small muted">' + e(teamName(m.teamA)) + '</span>' +
          '<input type="number" min="0" style="width:90px" value="' + (m.scoreA == null ? '' : m.scoreA) + '" data-chg="match.scoreA" data-i="' + mi + '"></label>' +
          '<span class="muted">—</span>' +
          '<label class="inline"><input type="number" min="0" style="width:90px" value="' + (m.scoreB == null ? '' : m.scoreB) + '" data-chg="match.scoreB" data-i="' + mi + '">' +
          '<span class="small muted">' + e(teamName(m.teamB)) + '</span></label>' +
          '<div class="spacer"></div>' +
          (m.stats && Object.keys(m.stats).length ? UI.badge('relevés saisis', 'ok') : '') +
          '</div>';

        /* saisie rapide au barème */
        h += '<div class="row tight" style="margin-top:8px">' +
          ['A', 'B'].map(function (side) {
            return '<span class="small muted nowrap">' + e(teamName(side === 'A' ? m.teamA : m.teamB)) + ' :</span>' +
              '<button class="btn-sm" data-act="match.inc" data-i="' + mi + '" data-side="' + side + '" data-v="' + cfg.goalValue + '">+' + cfg.goalValue + '</button>' +
              cfg.bonuses.map(function (b) {
                return '<button class="btn-sm btn-bonus" data-act="match.inc" data-i="' + mi + '" data-side="' + side +
                  '" data-v="' + b.points + '" title="' + e(b.name) + (b.desc ? ' — ' + e(b.desc) : '') + '">★ +' + b.points + '</button>';
              }).join('');
          }).join('<span style="width:14px"></span>') +
          '</div>';

        /* fair-play */
        var fp = m.fairplay || { teams: {}, adjust: {} };
        var nAdj = Object.keys(fp.adjust || {}).length;
        h += '<div class="row tight" style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)">' +
          '<span class="small muted nowrap">Fair-play :</span>' +
          [m.teamA, m.teamB].map(function (tid) {
            var on = (fp.teams || {})[tid] === 'ok';
            return '<button class="btn-sm' + (on ? ' btn-primary' : '') + '" data-act="match.fp" data-i="' + mi + '" data-team="' + tid + '">' +
              (on ? '✓ ' : '') + 'Rien à signaler — ' + e(teamName(tid)) + '</button>';
          }).join('') +
          '<button class="btn-sm" data-act="match.fpadj" data-i="' + mi + '">Ajuster individuellement</button>' +
          (nAdj ? UI.badge(nAdj + ' élève(s) ajusté(s)', 'accent') : '') +
          '</div></div>';
      });
      h += '</div>';
    });

    if (l.matches.length) {
      h += '<p class="small muted">Le calcul d\'indice n\'utilise jamais les points bruts mais la marge rapportée au total : ' +
        '30–10 en barème ×10 n\'est pas lu comme 30–10 en barème ×1.</p>';
    }
    return h;
  }

  /* ------------------------------------------- configuration des relevés */

  function editMatchConfig() {
    var l = A.currentLesson();
    var cfg = JSON.parse(JSON.stringify(matchConfig(l)));

    var fieldsHtml = function () {
      return '<div class="table-wrap"><table class="compact"><thead><tr>' +
        '<th>Ordre</th><th>Relever</th><th>Nom affiché</th><th>Abrégé</th><th class="num">Points au score</th></tr></thead><tbody>' +
        cfg.fields.map(function (f, i) {
          return '<tr><td class="nowrap">' +
            '<button type="button" class="btn-sm btn-ghost" data-fup="' + i + '"' + (i === 0 ? ' disabled' : '') + ' title="Monter">↑</button>' +
            '<button type="button" class="btn-sm btn-ghost" data-fdn="' + i + '"' + (i === cfg.fields.length - 1 ? ' disabled' : '') + ' title="Descendre">↓</button>' +
            '</td>' +
            '<td><label class="inline"><input type="checkbox" data-fon="' + i + '"' + (f.on !== false ? ' checked' : '') + '></label></td>' +
            '<td><input data-fk="label" data-i="' + i + '" value="' + e(f.label) + '" style="min-width:180px">' +
            (f.hint ? '<div class="tiny muted">' + e(f.hint) + '</div>' : '') + '</td>' +
            '<td><input data-fk="short" data-i="' + i + '" value="' + e(f.short) + '" style="width:76px"></td>' +
            '<td class="num"><input type="number" min="0" max="50" data-fk="points" data-i="' + i + '" value="' + (+f.points || 0) + '" style="width:80px"></td>' +
            '</tr>';
        }).join('') + '</tbody></table></div>';
    };

    var bonusHtml = function () {
      if (!cfg.bonuses.length) return '<p class="small muted">Aucun bonus. Exemple : « trois passes puis but sans perte de disque » = 5 points.</p>';
      return cfg.bonuses.map(function (b, i) {
        return '<div class="bonus-row">' +
          '<input data-bk="name" data-i="' + i + '" value="' + e(b.name) + '" placeholder="Combinaison d\'actions" style="flex:2;min-width:170px">' +
          '<input data-bk="desc" data-i="' + i + '" value="' + e(b.desc || '') + '" placeholder="Précision (facultatif)" style="flex:2;min-width:150px">' +
          '<input type="number" data-bk="points" data-i="' + i + '" value="' + b.points + '" style="width:86px">' +
          '<button type="button" class="btn-sm btn-ghost btn-danger" data-brm="' + i + '">✕</button></div>';
      }).join('');
    };

    UI.modal({
      title: 'Relevés et barème de la leçon',
      okLabel: 'Enregistrer',
      body: '<div class="grid cols-2">' +
        '<label class="field"><span>Valeur d\'un but ordinaire</span>' +
        '<input type="number" name="gv" min="1" value="' + cfg.goalValue + '"></label>' +
        '<label class="field"><span>Terrains disponibles</span>' +
        '<input type="number" name="terr" min="1" max="' + A.MAX_TERRAINS + '" value="' + terrainsOf(l) + '">' +
        '<span class="tiny muted">Autant de rencontres se jouent en même temps. Les équipes qui ne ' +
        'jouent pas observent et tiennent les feuilles.</span></label></div>' +
        '<fieldset><legend>Ce que les observateurs relèvent</legend>' +
        '<p class="small muted">Décoche ce qui ne t\'intéresse pas — la passe décisive, par exemple. ' +
        'Les flèches rangent les compteurs dans l\'ordre où tu veux les voir sur la tablette. ' +
        'Un relevé avec des points au score (les buts) met à jour le résultat de la rencontre quand on appuie dessus.</p>' +
        '<div id="fw">' + fieldsHtml() + '</div>' +
        '<p class="tiny muted">Passes réussies, passes perdues et interceptions alimentent les indices des élèves : ' +
        'si tu les décoches, la Technique, le Jeu en progression et la Défense ne seront plus nourris par les matchs.</p>' +
        '</fieldset>' +
        '<fieldset><legend>Bonus par combinaison d\'actions</legend>' +
        '<p class="small muted">Une action valorisée qui rapporte plus qu\'un but ordinaire. Ces boutons apparaissent ' +
        '<span class="badge badge-bonus">★ sur fond ambré</span> pour bien les distinguer, puisqu\'ils donnent des points.</p>' +
        '<div id="bw">' + bonusHtml() + '</div>' +
        '<button type="button" class="btn-sm" id="addbon">Ajouter un bonus</button></fieldset>',
      onOpen: function (d) {
        var bindFields = function () {
          d.querySelectorAll('#fw [data-fk]').forEach(function (el) {
            var apply = function () {
              var i = +el.getAttribute('data-i'), k = el.getAttribute('data-fk');
              cfg.fields[i][k] = k === 'points' ? Math.max(0, +el.value || 0) : el.value;
            };
            el.addEventListener('input', apply);
            el.addEventListener('change', apply);
          });
          d.querySelectorAll('[data-fon]').forEach(function (el) {
            el.addEventListener('change', function () { cfg.fields[+el.getAttribute('data-fon')].on = el.checked; });
          });
          var move = function (i, delta) {
            var j = i + delta;
            if (j < 0 || j >= cfg.fields.length) return;
            var tmp = cfg.fields[i]; cfg.fields[i] = cfg.fields[j]; cfg.fields[j] = tmp;
            d.querySelector('#fw').innerHTML = fieldsHtml();
            bindFields();
          };
          d.querySelectorAll('[data-fup]').forEach(function (el) {
            el.addEventListener('click', function () { move(+el.getAttribute('data-fup'), -1); });
          });
          d.querySelectorAll('[data-fdn]').forEach(function (el) {
            el.addEventListener('click', function () { move(+el.getAttribute('data-fdn'), 1); });
          });
        };
        var bindBonus = function () {
          d.querySelectorAll('#bw [data-bk]').forEach(function (el) {
            var apply = function () {
              var i = +el.getAttribute('data-i'), k = el.getAttribute('data-bk');
              cfg.bonuses[i][k] = k === 'points' ? (+el.value || 0) : el.value;
            };
            el.addEventListener('input', apply);
            el.addEventListener('change', apply);
          });
          d.querySelectorAll('[data-brm]').forEach(function (el) {
            el.addEventListener('click', function () {
              cfg.bonuses.splice(+el.getAttribute('data-brm'), 1);
              d.querySelector('#bw').innerHTML = bonusHtml(); bindBonus();
            });
          });
        };
        bindFields(); bindBonus();
        d.querySelector('#addbon').addEventListener('click', function () {
          cfg.bonuses.push({ id: A.uid('bon'), name: 'Action valorisée', desc: '', points: 5 });
          d.querySelector('#bw').innerHTML = bonusHtml(); bindBonus();
        });
      },
      onOk: function (d) {
        cfg.goalValue = Math.max(1, +d.querySelector('[name=gv]').value || 1);
        l.terrains = A.clamp(+d.querySelector('[name=terr]').value || A.TERRAINS, 1, A.MAX_TERRAINS);
        cfg.matchesPerRound = l.terrains;
        cfg.bonuses = cfg.bonuses.filter(function (b) { return b.name && b.points; });
        if (!cfg.fields.some(function (f) { return f.on !== false; })) {
          UI.toast('Garde au moins un relevé actif.');
          return false;
        }
        A.set(function () { l.matchConfig = cfg; });
      }
    });
  }

  /* ------------------------------------------------- saisie par le maître */

  function editStats(mi) {
    var l = A.currentLesson(), cls = A.get().classes[l.classId];
    var m = l.matches[mi];
    var fields = activeFields(l);
    m.stats = m.stats || {};
    m.granularity = m.granularity || 'team';

    var teamName = function (id) {
      for (var i = 0; i < l.teams.length; i++) if (l.teams[i].id === id) return l.teams[i].name;
      return '?';
    };

    var render = function (gran) {
      var s = '<div class="table-wrap"><table class="compact"><thead><tr><th>' +
        (gran === 'player' ? 'Joueur' : 'Équipe') + '</th>' +
        fields.map(function (f) { return '<th class="num" title="' + e(f.label) + '">' + e(f.short) + '</th>'; }).join('') +
        '</tr></thead><tbody>';
      var rows = [];
      if (gran === 'player') {
        [m.teamA, m.teamB].forEach(function (tid) {
          RATINGS.teamMembers(l, tid).forEach(function (sid) {
            var st2 = A.studentById(cls.id, sid);
            rows.push({ id: sid, label: (st2 ? A.shortName(st2) : sid) + ' (' + teamName(tid) + ')' });
          });
        });
      } else {
        rows = [{ id: m.teamA, label: teamName(m.teamA) }, { id: m.teamB, label: teamName(m.teamB) }];
      }
      rows.forEach(function (row) {
        var cur = m.stats[row.id] || {};
        s += '<tr><td>' + e(row.label) + '</td>' + fields.map(function (f) {
          return '<td class="num"><input type="number" min="0" style="width:64px" data-sid="' + e(row.id) + '" data-f="' + f.id + '" value="' +
            (cur[f.id] == null ? '' : cur[f.id]) + '"></td>';
        }).join('') + '</tr>';
      });
      return s + '</tbody></table></div>';
    };

    UI.modal({
      title: 'Relevés — ' + teamName(m.teamA) + ' / ' + teamName(m.teamB),
      okLabel: 'Enregistrer',
      body: '<div class="notice">Une interception <b>est</b> une passe ratée pour l\'adversaire : elle est ajoutée automatiquement, ' +
        'tu n\'as rien à saisir en double. Le compteur « passes perdues » ne sert qu\'aux pertes non interceptées.</div>' +
        '<label class="field"><span>Qui relève ?</span><select name="gran">' +
        '<option value="team"' + (m.granularity === 'team' ? ' selected' : '') + '>Un observateur par équipe (recommandé)</option>' +
        '<option value="player"' + (m.granularity === 'player' ? ' selected' : '') + '>Relevé joueur par joueur (plus précis, plus exigeant)</option>' +
        '</select></label><div id="sw">' + render(m.granularity) + '</div>' +
        '<div id="recap"></div>',
      onOpen: function (d) {
        var recap = function () {
          var gran = d.querySelector('[name=gran]').value;
          var box = d.querySelector('#recap');
          if (gran === 'player') {
            box.innerHTML = '<p class="small muted">En relevé joueur par joueur, l\'interception ne peut pas être rattachée ' +
              'à un adversaire précis : saisis alors toutes les passes ratées, interceptées ou non.</p>';
            return;
          }
          var read = function (tid) {
            var o = {};
            d.querySelectorAll('[data-sid="' + tid + '"]').forEach(function (el) { o[el.getAttribute('data-f')] = +el.value || 0; });
            return o;
          };
          var a = read(m.teamA), b = read(m.teamB);
          var line = function (own, opp, tid) {
            var tot = (own.passKo || 0) + (opp.intercept || 0);
            var tent = (own.passOk || 0) + tot;
            return '<tr><td>' + e(teamName(tid)) + '</td>' +
              '<td class="num">' + (own.passOk || 0) + '</td>' +
              '<td class="num">' + tot + '</td>' +
              '<td class="num tiny muted">dont ' + (opp.intercept || 0) + ' interceptée(s)</td>' +
              '<td class="num"><b>' + (tent ? Math.round((own.passOk || 0) / tent * 100) + ' %' : '–') + '</b></td></tr>';
          };
          box.innerHTML = '<h4>Ce qui sera calculé</h4><div class="table-wrap"><table class="compact"><thead><tr>' +
            '<th>Équipe</th><th class="num">Réussies</th><th class="num">Ratées (total)</th><th></th><th class="num">Réussite</th>' +
            '</tr></thead><tbody>' + line(a, b, m.teamA) + line(b, a, m.teamB) + '</tbody></table></div>';
        };
        d.querySelector('[name=gran]').addEventListener('change', function (ev) {
          d.querySelector('#sw').innerHTML = render(ev.target.value);
          d.querySelectorAll('[data-sid]').forEach(function (el) { el.addEventListener('input', recap); });
          recap();
        });
        d.querySelectorAll('[data-sid]').forEach(function (el) { el.addEventListener('input', recap); });
        recap();
      },
      onOk: function (d) {
        var gran = d.querySelector('[name=gran]').value;
        var stats = {};
        d.querySelectorAll('[data-sid]').forEach(function (el) {
          var sid = el.getAttribute('data-sid'), f = el.getAttribute('data-f');
          if (el.value === '') return;
          stats[sid] = stats[sid] || {};
          stats[sid][f] = +el.value;
        });
        A.set(function () { m.granularity = gran; m.stats = stats; });
        UI.toast('Relevés enregistrés.');
      }
    });
  }

  /* --------------------------------------------- appréciation d'un élève
     Quatrième source d'indice, jusqu'ici sans interface : l'observation de
     l'enseignant. Elle sert surtout aux élèves qui ne jouent pas — blessés,
     dispensés — dont aucun score ne peut rendre compte. Un arbitre juste, un
     observateur rigoureux, un coach qui fait progresser son équipe font du
     travail d'EPS : il doit pouvoir compter. */
  function editObservation(sid) {
    var l = A.currentLesson(), cls = A.get().classes[l.classId];
    var s = A.studentById(cls.id, sid);
    if (!s) return;
    l.observations = l.observations || {};
    var draft = JSON.parse(JSON.stringify(l.observations[sid] || {}));
    var crits = A.criteria();
    var role = (l.roles || {})[sid] || '';

    var etat = function (cid) {
      var o = draft[cid] || {};
      return (+o.plus || 0) > 0 ? 'plus' : ((+o.minus || 0) > 0 ? 'minus' : '');
    };

    var body = '<p class="small muted">' + e(A.displayName(s)) +
      (role ? ' — <b>' + e(role) + '</b>' : ' — aucun rôle attribué') + '. ' +
      'Note ce que tu as réellement observé pendant la séance. Laisse « rien » partout si tu n\'as rien à dire : ' +
      'une appréciation vide ne compte pas.</p>' +
      '<div class="att-grid">' +
      crits.map(function (c) {
        var cur = etat(c.id);
        return '<div class="att-item" style="cursor:default"><span class="nm">' + e(c.name) + '</span>' +
          '<span class="seg">' +
          '<button type="button" class="v-injured" data-ob="' + c.id + '" data-v="minus" aria-pressed="' + (cur === 'minus') + '" title="À reprendre">−</button>' +
          '<button type="button" data-ob="' + c.id + '" data-v="" aria-pressed="' + (!cur) + '" title="Rien à signaler">rien</button>' +
          '<button type="button" data-ob="' + c.id + '" data-v="plus" aria-pressed="' + (cur === 'plus') + '" title="À valoriser">+</button>' +
          '</span></div>';
      }).join('') +
      '</div>' +
      '<p class="tiny muted">Ces appréciations pèsent selon le réglage « Observation enseignant » ' +
      '(Réglages → Pondération des sources). Elles s\'ajoutent leçon après leçon.</p>';

    UI.modal({
      title: 'Apprécier — ' + A.displayName(s),
      body: body, okLabel: 'Enregistrer',
      onOpen: function (d) {
        d.querySelectorAll('[data-ob]').forEach(function (b) {
          b.addEventListener('click', function () {
            var cid = b.getAttribute('data-ob'), v = b.getAttribute('data-v');
            if (v === 'plus') draft[cid] = { plus: 1, minus: 0 };
            else if (v === 'minus') draft[cid] = { plus: 0, minus: 1 };
            else delete draft[cid];
            d.querySelectorAll('[data-ob="' + cid + '"]').forEach(function (o) {
              o.setAttribute('aria-pressed', String(o.getAttribute('data-v') === v));
            });
          });
        });
      },
      onOk: function () {
        A.set(function () {
          if (Object.keys(draft).length) l.observations[sid] = draft;
          else delete l.observations[sid];
        });
        UI.toast('Appréciation enregistrée.');
      }
    });
  }

  /* ------------------------------------------------------------ fair-play */

  function editFairplay(mi) {
    var l = A.currentLesson(), cls = A.get().classes[l.classId];
    var m = l.matches[mi];
    m.fairplay = m.fairplay || { teams: {}, adjust: {} };
    var draft = JSON.parse(JSON.stringify(m.fairplay));
    var teamName = function (id) {
      for (var i = 0; i < l.teams.length; i++) if (l.teams[i].id === id) return l.teams[i].name;
      return '?';
    };

    var body = '<p class="small muted">Laisse « collectif » pour tous les élèves dont il n\'y a rien à dire : ' +
      'ils reçoivent la note de leur équipe. Ne désigne que les exceptions.</p>';
    [m.teamA, m.teamB].forEach(function (tid) {
      var members = RATINGS.teamMembers(l, tid);
      if (!members.length) return;
      body += '<fieldset><legend>' + e(teamName(tid)) + '</legend><div class="att-grid">';
      members.forEach(function (sid) {
        var s = A.studentById(cls.id, sid);
        var cur = draft.adjust[sid] || '';
        body += '<div class="att-item" style="cursor:default"><span class="nm">' + e(s ? A.displayName(s) : sid) + '</span>' +
          '<span class="seg">' +
          '<button type="button" class="v-injured" data-fp="' + sid + '" data-v="minus" aria-pressed="' + (cur === 'minus') + '" title="À reprendre">−</button>' +
          '<button type="button" data-fp="' + sid + '" data-v="" aria-pressed="' + (!cur) + '" title="Note collective">collectif</button>' +
          '<button type="button" data-fp="' + sid + '" data-v="plus" aria-pressed="' + (cur === 'plus') + '" title="À valoriser">+</button>' +
          '</span></div>';
      });
      body += '</div></fieldset>';
    });

    UI.modal({
      title: 'Fair-play — ajustements individuels',
      body: body, okLabel: 'Enregistrer',
      onOpen: function (d) {
        d.querySelectorAll('[data-fp]').forEach(function (b) {
          b.addEventListener('click', function () {
            var sid = b.getAttribute('data-fp'), v = b.getAttribute('data-v');
            if (v) draft.adjust[sid] = v; else delete draft.adjust[sid];
            d.querySelectorAll('[data-fp="' + sid + '"]').forEach(function (o) {
              o.setAttribute('aria-pressed', String(o.getAttribute('data-v') === v));
            });
          });
        });
      },
      onOk: function () { A.set(function () { m.fairplay = draft; }); }
    });
  }

  /* ---------------------------------------------------- création de matchs */

  function newMatch(l, a, b, round) {
    return {
      id: A.uid('mt'), teamA: a, teamB: b, round: round || 1,
      scoreA: null, scoreB: null, stats: {}, granularity: 'team',
      fairplay: { teams: {}, adjust: {} }
    };
  }

  /* Effacer une rencontre est une action lourde — elle supprime des données
     saisies par les élèves — donc elle demande le code enseignant. */
  function resetMatch(mi) {
    var l = A.currentLesson();
    var m = l.matches[mi];
    if (!m) return;
    var teamName = function (id) {
      for (var i = 0; i < l.teams.length; i++) if (l.teams[i].id === id) return l.teams[i].name;
      return '?';
    };
    KIOSK.askCode(function () {
      A.set(function () {
        m.scoreA = null; m.scoreB = null;
        m.stats = {};
        m.fairplay = { teams: {}, adjust: {} };
      });
      UI.toast('Rencontre réinitialisée : ' + teamName(m.teamA) + ' / ' + teamName(m.teamB) + '.');
    }, 'Réinitialiser la rencontre ' + teamName(m.teamA) + ' / ' + teamName(m.teamB) +
       ' effacera le score, les relevés et le fair-play. Saisis le code pour confirmer.');
  }

  /* Saisie groupée : les quatre équipes d'un tour dans un seul tableau, pour
     recopier les feuilles des observateurs d'une traite. */
  function editRoundStats(roundNo) {
    var l = A.currentLesson();
    var rd = rounds(l).filter(function (r) { return r.n === roundNo; })[0];
    if (!rd) return;
    var fields = activeFields(l);
    var teamName = function (id) {
      for (var i = 0; i < l.teams.length; i++) if (l.teams[i].id === id) return l.teams[i].name;
      return '?';
    };
    var teamColor = function (id) {
      for (var i = 0; i < l.teams.length; i++) if (l.teams[i].id === id) return l.teams[i].color;
      return 'var(--accent)';
    };

    var body = '<div class="notice">Une interception est ajoutée d\'office comme passe ratée à l\'équipe adverse : ' +
      'ne la compte pas deux fois. Le récapitulatif en bas montre ce qui sera calculé.</div>';

    rd.items.forEach(function (x) {
      var m = x.m;
      m.stats = m.stats || {};
      body += '<fieldset data-mi="' + x.i + '"><legend>' + e(teamName(m.teamA)) + ' — ' + e(teamName(m.teamB)) + '</legend>' +
        '<div class="row tight" style="margin-bottom:8px">' +
        '<label class="inline"><span class="small muted">' + e(teamName(m.teamA)) + '</span>' +
        '<input type="number" min="0" style="width:84px" data-score="A" data-mi="' + x.i + '" value="' +
        (m.scoreA == null ? '' : m.scoreA) + '"></label><span class="muted">—</span>' +
        '<label class="inline"><input type="number" min="0" style="width:84px" data-score="B" data-mi="' + x.i + '" value="' +
        (m.scoreB == null ? '' : m.scoreB) + '">' +
        '<span class="small muted">' + e(teamName(m.teamB)) + '</span></label></div>' +
        '<div class="table-wrap"><table class="compact"><thead><tr><th>Équipe</th>' +
        fields.map(function (f) { return '<th class="num" title="' + e(f.label) + '">' + e(f.short) + '</th>'; }).join('') +
        '</tr></thead><tbody>' +
        [m.teamA, m.teamB].map(function (tid) {
          var cur = m.stats[tid] || {};
          return '<tr><td><b style="color:' + teamColor(tid) + '">' + e(teamName(tid)) + '</b></td>' +
            fields.map(function (f) {
              return '<td class="num"><input type="number" min="0" style="width:64px" data-mi="' + x.i +
                '" data-sid="' + e(tid) + '" data-f="' + f.id + '" value="' + (cur[f.id] == null ? '' : cur[f.id]) + '"></td>';
            }).join('') + '</tr>';
        }).join('') + '</tbody></table></div></fieldset>';
    });
    body += '<div id="recapRound"></div>';

    UI.modal({
      title: 'Relevés du tour ' + roundNo,
      body: body, okLabel: 'Enregistrer',
      onOpen: function (d) {
        var recap = function () {
          var out = '<h4>Ce qui sera calculé</h4><div class="table-wrap"><table class="compact"><thead><tr>' +
            '<th>Équipe</th><th class="num">Réussies</th><th class="num">Ratées (total)</th><th class="num">Réussite</th>' +
            '</tr></thead><tbody>';
          rd.items.forEach(function (x) {
            var read = function (tid) {
              var o = {};
              d.querySelectorAll('[data-mi="' + x.i + '"][data-sid="' + tid + '"]').forEach(function (el) {
                o[el.getAttribute('data-f')] = +el.value || 0;
              });
              return o;
            };
            var a = read(x.m.teamA), b = read(x.m.teamB);
            [[a, b, x.m.teamA], [b, a, x.m.teamB]].forEach(function (p) {
              var tot = (p[0].passKo || 0) + (p[1].intercept || 0);
              var tent = (p[0].passOk || 0) + tot;
              out += '<tr><td>' + e(teamName(p[2])) + '</td><td class="num">' + (p[0].passOk || 0) + '</td>' +
                '<td class="num">' + tot + '</td><td class="num"><b>' +
