<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Composition d'équipes équilibrées, suivi des compétences et évaluation en ultimate — Collège Louis Pasteur, Villemomble.">
<meta name="theme-color" content="#f7f9fb">
<title>Ultimate EPS — Collège Louis Pasteur</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='none' stroke='%232f6fb3' stroke-width='9'/><circle cx='50' cy='50' r='16' fill='%232f6fb3'/></svg>">
<style>
/* Ultimate EPS — feuille de style
   Pensée pour une utilisation debout, en gymnase, sur tablette :
   cibles tactiles larges, contrastes élevés, peu de couleurs. */

:root {
  --bg: #f7f9fb;
  --surface: #ffffff;
  --surface-2: #f1f4f8;
  --border: #e3e9f0;
  --text: #1e2a38;
  --text-soft: #6b7a8c;
  --accent: #2f6fb3;
  --accent-soft: #eaf2fb;
  --ok: #2b8a6a;
  --ok-soft: #e9f6f1;
  --warn: #b07a1e;
  --warn-soft: #fcf4e4;
  --bad: #c15550;
  --bad-soft: #fbeeed;
  --ok-ink: #1d4a3a;
  --warn-ink: #6b4708;
  --bad-ink: #7d2f2b;
  --kiosk: #7a4fa3;
  --bonus: #c08a2e;
  --bonus-soft: #fbf1dc;
  --bonus-ink: #7a5410;
  --radius: 10px;
  --tap: 44px;
  --shadow: 0 1px 2px rgba(30, 42, 56, .04);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161c;
    --surface: #1a2029;
    --surface-2: #222a35;
    --border: #333d4b;
    --text: #e8edf4;
    --text-soft: #9aa7b8;
    --accent: #5b9dff;
    --accent-soft: #1c2a40;
    --ok: #4ec98d;
    --ok-soft: #16301f;
    --warn: #e0a44a;
    --warn-soft: #332713;
    --bad: #f07a6b;
    --bad-soft: #3a1c19;
    --ok-ink: #d7f5e6;
    --warn-ink: #f6e2bd;
    --bad-ink: #fbdcd7;
    --kiosk: #a07cc9;
    --bonus: #e0b25a;
    --bonus-soft: #3a2d12;
    --bonus-ink: #f7e3bb;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 12px rgba(0, 0, 0, .25);
  }
}

:root[data-theme="dark"] {
  --bg: #12161c;
  --surface: #1a2029;
  --surface-2: #222a35;
  --border: #333d4b;
  --text: #e8edf4;
  --text-soft: #9aa7b8;
  --accent: #5b9dff;
  --accent-soft: #1c2a40;
  --ok: #4ec98d;
  --ok-soft: #16301f;
  --warn: #e0a44a;
  --warn-soft: #332713;
  --bad: #f07a6b;
  --bad-soft: #3a1c19;
  --ok-ink: #d7f5e6;
  --warn-ink: #f6e2bd;
  --bad-ink: #fbdcd7;
  --kiosk: #a07cc9;
  --bonus: #e0b25a;
  --bonus-soft: #3a2d12;
  --bonus-ink: #f7e3bb;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 12px rgba(0, 0, 0, .25);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%;
}

h1, h2, h3, h4 { margin: 0 0 .5em; line-height: 1.25; font-weight: 650; }
h1 { font-size: 1.5rem; }
h2 { font-size: 1.2rem; }
h3 { font-size: 1.02rem; }
h4 { font-size: .92rem; color: var(--text-soft); text-transform: uppercase; letter-spacing: .04em; }
p { margin: 0 0 .8em; }
a { color: var(--accent); }
code { font-family: var(--mono); font-size: .9em; background: var(--surface-2); padding: .1em .35em; border-radius: 4px; }

/* ---------- Mise en page ---------- */

#app { min-height: 100vh; display: flex; flex-direction: column; }

.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: .6rem;
  padding: .5rem max(12px, env(safe-area-inset-left)) .5rem max(12px, env(safe-area-inset-right));
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}

.brand {
  font-weight: 700; font-size: .95rem; line-height: 1.15;
  letter-spacing: -.005em; white-space: nowrap;
  padding-left: 10px; margin-right: .5rem;
  border-left: 3px solid var(--accent);
  color: var(--text);
}
.brand small {
  display: block; font-weight: 500; font-size: .72rem;
  color: var(--text-soft); letter-spacing: .06em; text-transform: uppercase; margin-top: 1px;
}

.nav { display: flex; gap: .25rem; flex-wrap: wrap; flex: 1; }
.nav button {
  border: 1px solid transparent; background: transparent; color: var(--text-soft);
  padding: .45rem .7rem; border-radius: var(--radius); font: inherit; font-weight: 550;
  cursor: pointer; min-height: 38px;
}
.nav button:hover { background: var(--surface-2); color: var(--text); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }

.context-pill {
  display: inline-flex; align-items: center; gap: .4rem;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 999px; padding: .25rem .7rem; font-size: .82rem; color: var(--text-soft);
  white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
}

main { flex: 1; width: 100%; max-width: 1180px; margin: 0 auto; padding: 18px 16px 64px; }

/* ---------- Cartes & grilles ---------- */

.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow);
}
.card > :last-child { margin-bottom: 0; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.card-head h2, .card-head h3 { margin: 0; }

.grid { display: grid; gap: 14px; }
.grid.cols-2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.grid.cols-3 { grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); }
.grid.cols-4 { grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); }

.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.tight { gap: 6px; }
.spacer { flex: 1; }
.muted { color: var(--text-soft); }
.small { font-size: .85rem; }
.tiny { font-size: .76rem; }
.center { text-align: center; }
.nowrap { white-space: nowrap; }
.hidden { display: none !important; }
/* L'attribut `hidden` doit l'emporter sur nos propres règles d'affichage :
   sans cela, un `.grid` masqué reste visible (display:grid gagne contre la
   feuille du navigateur). */
[hidden] { display: none !important; }

/* ---------- Contrôles ---------- */

button, .btn {
  font: inherit; font-weight: 550; cursor: pointer;
  border-radius: var(--radius); border: 1px solid var(--border);
  background: var(--surface); color: var(--text);
  padding: .5rem .85rem; min-height: var(--tap);
  display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
  transition: background .12s, border-color .12s;
}
button:hover, .btn:hover { background: var(--surface-2); }
button:active { transform: translateY(1px); }
button:disabled { opacity: .45; cursor: not-allowed; }

.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent); filter: brightness(1.08); }
.btn-danger { color: var(--bad); border-color: var(--bad); background: var(--bad-soft); }
.btn-ghost { border-color: transparent; background: transparent; }
/* Le mode kiosque change de main : bouton nettement identifiable. */
.btn-kiosk {
  background: var(--kiosk); border-color: var(--kiosk); color: #fff; font-weight: 650;
}
.btn-kiosk:hover { background: var(--kiosk); filter: brightness(1.08); }
.btn-kiosk::before { content: "▣"; font-size: .95em; }

.btn-sm { min-height: 32px; padding: .25rem .6rem; font-size: .85rem; }
.btn-lg { min-height: 56px; font-size: 1.05rem; padding: .8rem 1.3rem; }

input, select, textarea {
  font: inherit; color: var(--text); background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: .5rem .6rem; min-height: var(--tap); max-width: 100%;
}
textarea { min-height: 80px; resize: vertical; }
input:focus, select:focus, textarea:focus, button:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
input[type="range"] { min-height: auto; padding: 0; accent-color: var(--accent); }
input[type="number"] { width: 7.5rem; }
input[type="checkbox"], input[type="radio"] { min-height: auto; width: 20px; height: 20px; accent-color: var(--accent); }

label.field { display: block; margin-bottom: 12px; }
label.field > span { display: block; font-size: .82rem; font-weight: 600; color: var(--text-soft); margin-bottom: .25rem; }
label.field > input, label.field > select, label.field > textarea { width: 100%; }
label.inline { display: inline-flex; align-items: center; gap: .45rem; cursor: pointer; }

fieldset { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin: 0 0 14px; }
legend { font-size: .82rem; font-weight: 700; color: var(--text-soft); padding: 0 .4rem; text-transform: uppercase; letter-spacing: .04em; }

/* ---------- Tableaux ---------- */

.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; padding: 0 4px; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
th { font-size: .78rem; text-transform: uppercase; letter-spacing: .03em; color: var(--text-soft); font-weight: 700; white-space: nowrap; }
tbody tr:hover { background: var(--surface-2); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.compact th, table.compact td { padding: .3rem .45rem; }

/* ---------- Badges & jauges ---------- */

.badge {
  display: inline-flex; align-items: center; gap: .3rem;
  border-radius: 999px; padding: .12rem .55rem;
  font-size: .76rem; font-weight: 650; white-space: nowrap;
  background: var(--surface-2); color: var(--text-soft); border: 1px solid var(--border);
}
.badge.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.badge.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.badge.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.badge.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

.bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; min-width: 60px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }

.stat { background: var(--surface-2); border-radius: var(--radius); padding: 10px 12px; }
.stat b { display: block; font-size: 1.4rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-size: .76rem; color: var(--text-soft); text-transform: uppercase; letter-spacing: .04em; }

.notice { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 10px 12px; border-radius: 0 var(--radius) var(--radius) 0; margin-bottom: 14px; font-size: .88rem; }
.notice.warn { border-color: var(--warn); background: var(--warn-soft); }
.notice.bad { border-color: var(--bad); background: var(--bad-soft); }
.notice.ok { border-color: var(--ok); background: var(--ok-soft); }

.empty { text-align: center; padding: 40px 20px; color: var(--text-soft); }
.empty h3 { color: var(--text); }

/* ---------- Sous-onglets de leçon ---------- */

.subnav { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--border); margin-bottom: 16px; padding-bottom: 0; }
.subnav button {
  border: none; background: transparent; border-bottom: 2px solid transparent;
  border-radius: 0; padding: .55rem .8rem; color: var(--text-soft); white-space: nowrap; min-height: 42px;
}
.subnav button[aria-current="true"] { color: var(--accent); border-bottom-color: var(--accent); background: transparent; }

/* ---------- Présences ---------- */

/* L'appel se fait en touchant le nom : vert → rouge → orange → vert. */
.att-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.att-item {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px; flex-wrap: wrap;
  border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface);
  cursor: pointer; min-height: 48px; user-select: none;
  transition: background .12s, border-color .12s;
}
.att-item:hover { filter: brightness(.985); }
.att-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.att-item .nm { flex: 1; font-size: .92rem; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att-item .att-state {
  font-size: .68rem; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; opacity: .8;
}
.att-item .px { font-size: .78rem; font-variant-numeric: tabular-nums; opacity: .65; }
/* Le menu « rôle » passe à la ligne : la ligne du nom reste entièrement
   cliquable pour continuer à faire défiler les états. */
.att-item .att-role { flex: 1 0 100%; min-height: 34px; font-size: .78rem; padding: .15rem .4rem; cursor: default; }

.att-item.present { border-color: var(--ok); background: var(--ok-soft); color: var(--ok-ink); }
.att-item.absent { border-color: var(--bad); background: var(--bad-soft); color: var(--bad-ink); }
.att-item.injured { border-color: var(--warn); background: var(--warn-soft); color: var(--warn-ink); }
.att-item.present .att-state { color: var(--ok); }
.att-item.absent .att-state { color: var(--bad); }
.att-item.injured .att-state { color: var(--warn); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: none; border-radius: 0; min-height: 32px; padding: .2rem .5rem; font-size: .8rem; background: transparent; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.seg button[aria-pressed="true"].v-injured { background: var(--warn); }
.seg button[aria-pressed="true"].v-absent { background: var(--text-soft); }

/* ---------- Choix d'étape suivante ---------- */

.next-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.next-card {
  display: flex; flex-direction: column; align-items: flex-start; gap: 5px;
  text-align: left; padding: 14px; min-height: 108px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
}
.next-card:hover { border-color: var(--accent); background: var(--accent-soft); }
.next-card b { font-size: 1.02rem; }
.next-card span { font-weight: 400; font-size: .84rem; color: var(--text-soft); }
.next-card .badge { margin-top: auto; }
.next-card.active { border-color: var(--accent); background: var(--accent-soft); }

/* ---------- Pondération des sources ---------- */

.src-list { display: flex; flex-direction: column; gap: 2px; }
.src-row {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 12px 0; border-top: 1px solid var(--border);
}
.src-txt { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.src-ctl { display: flex; align-items: center; gap: 12px; flex: 0 1 260px; min-width: 190px; }
.src-ctl input[type="range"] { flex: 1; min-width: 110px; }
.src-val { font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; }

/* ---------- Équipes ---------- */

.teams-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.team {
  background: var(--surface); border: 1px solid var(--border);
  border-top: 4px solid var(--team, var(--accent));
  border-radius: var(--radius); padding: 10px; min-height: 150px;
}
.team.drop-target { outline: 2px dashed var(--accent); outline-offset: 2px; background: var(--accent-soft); }
/* Équipe de moins de 4 joueurs : fond bleu clair, repérable d'un coup d'œil. */
.team.team-thin { background: var(--accent-soft); border-color: var(--accent); }
.team.team-thin .player { background: var(--surface); }
.team-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.team-head .tname { font-weight: 700; flex: 1; font-size: .95rem; }
.team-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }

/* Pastille de chasuble : un rond de couleur qui ouvre la palette. */
.team-swatch {
  width: 22px; height: 22px; padding: 0; flex: 0 0 auto;
  border-radius: 50%; border: 2px solid var(--surface);
  box-shadow: 0 0 0 1px var(--border); cursor: pointer;
}
.team-swatch:hover { box-shadow: 0 0 0 2px var(--accent); }
.pal-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 8px; margin: 10px 0 14px;
}
.pal-chip {
  display: flex; align-items: center; gap: 8px; padding: 7px 10px;
  background: var(--surface-2); border: 2px solid transparent; border-radius: 10px;
  font-size: .85rem; text-align: left; cursor: pointer;
}
.pal-chip:hover { border-color: var(--border-strong, var(--border)); }
.pal-chip.is-on { border-color: var(--accent); background: var(--accent-soft); font-weight: 650; }
.pal-chip.is-used .pal-lbl { color: var(--text-soft); }
.pal-dot {
  width: 18px; height: 18px; border-radius: 50%; flex: 0 0 auto;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .12) inset;
}
.player {
  display: flex; align-items: center; gap: 6px; padding: 6px 8px; margin-bottom: 4px;
  background: var(--surface-2); border-radius: 8px; cursor: grab; font-size: .88rem; min-height: 38px;
  border: 1px solid transparent;
}
.player:last-child { margin-bottom: 0; }
.player.selected { border-color: var(--accent); background: var(--accent-soft); }
.player .pn { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player .px { font-variant-numeric: tabular-nums; font-size: .78rem; color: var(--text-soft); font-weight: 650; }
.player .sx { font-size: .68rem; color: var(--text-soft); }
.player.locked-pair { box-shadow: inset 2px 0 0 var(--ok); }

/* ---------- Radar ---------- */

.radar { display: block; width: 100%; max-width: 260px; height: auto; margin: 0 auto; }
.radar .grid-line { fill: none; stroke: var(--border); stroke-width: 1; }
.radar .axis { stroke: var(--border); stroke-width: 1; }
.radar .shape { fill: var(--accent); fill-opacity: .18; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
.radar .shape.alt { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-dasharray: 4 3; }
.radar text { font-size: 9px; fill: var(--text-soft); }

/* ---------- Kiosque ---------- */

body.kiosk { overflow: hidden; }
.kiosk-root {
  position: fixed; inset: 0; z-index: 100; background: var(--bg);
  display: flex; flex-direction: column; overflow: auto;
  padding: max(16px, env(safe-area-inset-top)) 16px 24px;
}
.kiosk-root h1 { font-size: 1.6rem; }
.kiosk-inner { width: 100%; max-width: 820px; margin: 0 auto; }
.pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.pick-grid button { min-height: 62px; font-size: 1rem; }
.big-num { display: flex; align-items: center; gap: 10px; }
.big-num input { font-size: 1.6rem; text-align: center; min-height: 64px; width: 120px; font-variant-numeric: tabular-nums; }
.big-num button { min-width: 64px; min-height: 64px; font-size: 1.5rem; }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper button { min-width: 46px; min-height: 46px; font-size: 1.2rem; }

/* Kiosque match : les deux équipes côte à côte, tout tient sans défilement. */
.k-match { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: start; }
.k-vs { align-self: center; color: var(--text-soft); font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; }
.k-team { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
.k-team-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.k-team-head h2 { margin: 0; font-size: 1.05rem; line-height: 1.2; }
.k-score { font-size: 2.6rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.k-goals { display: flex; gap: 6px; margin: 10px 0; flex-wrap: wrap; }
.k-goal {
  flex: 1 1 auto; min-height: 62px; flex-direction: column; gap: 0;
  background: var(--ok); border-color: var(--ok); color: #fff; font-size: 1.05rem; font-weight: 700;
}
.k-goal small { font-weight: 500; font-size: .68rem; opacity: .85; }
/* button:hover est plus spécifique que .k-goal : sans ces règles, le bouton
   survolé redevient gris avec du texte blanc, donc illisible. */
.k-goal:hover { background: var(--ok); filter: brightness(1.07); }
.k-goal.alt, .k-goal.alt:hover { background: var(--accent); border-color: var(--accent); }
/* Le bonus rapporte des points : fond ambré pour ne pas le confondre. */
.k-goal.bonus, .k-goal.bonus:hover {
  background: var(--bonus); border-color: var(--bonus); color: #fff;
}
.k-stat.scores span { color: var(--ok); }
.k-stat.scores b { color: var(--ok); }
.k-goal.minus, .k-goal.minus:hover {
  flex: 0 0 58px; background: var(--surface-2); border-color: var(--border);
  color: var(--text); font-size: 1.4rem;
}
.btn-danger:hover { background: var(--bad-soft); }
.k-player { font-weight: 650; font-size: .88rem; margin: 8px 0 4px; }
.k-stats { display: flex; flex-direction: column; gap: 6px; }
.k-stat { display: flex; align-items: center; gap: 6px; }
.k-stat span {
  width: 42px; font-size: .74rem; font-weight: 700; color: var(--text-soft);
  text-transform: uppercase; letter-spacing: .03em;
}
.k-stat button { min-width: 48px; min-height: 48px; font-size: 1.25rem; flex: 0 0 auto; }
.k-stat b { flex: 1; text-align: center; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.k-legend { display: flex; flex-direction: column; gap: 2px; margin-top: 10px; font-size: .76rem; color: var(--text-soft); }
.k-legend b { color: var(--text); }

/* Les deux matchs d'un tour, l'un sous l'autre, sur la même tablette. */
.k-round-match {
  border: 1px solid var(--border); border-radius: 14px;
  padding: 10px 10px 12px; margin-bottom: 14px; background: var(--surface-2);
}
.k-round-match .k-match { align-items: stretch; }
.k-round-label {
  font-size: .72rem; text-transform: uppercase; letter-spacing: .08em;
  font-weight: 700; color: var(--text-soft); margin-bottom: 8px;
}
.btn-round, .btn-round:hover {
  background: var(--kiosk); color: #fff; border-color: var(--kiosk);
  font-size: .82rem; font-weight: 650; padding: 6px 12px; min-height: 36px;
  vertical-align: middle; margin-left: 8px;
}

@media (max-width: 700px) {
  .k-match { grid-template-columns: 1fr; }
  .k-vs { display: none; }
  .k-goal { min-height: 54px; }
  .k-stat button { min-width: 44px; min-height: 44px; }
}
.stepper .val { min-width: 46px; text-align: center; font-size: 1.2rem; font-variant-numeric: tabular-nums; font-weight: 700; }

/* ---------- Retour de score et palier atteint ----------
   Le message prend la couleur de sa bande ; l'encadré du palier atteint
   reprend la même teinte, en plus clair, pour qu'on lise les deux d'un bloc. */

.feedback {
  border-radius: 12px 12px 0 0; padding: 16px;
  border: 1px solid var(--border); border-bottom: none;
  background: var(--surface-2);
}
.feedback.band-aide { background: var(--warn-soft); border-color: var(--warn); color: var(--warn-ink); }
.feedback.band-reco { background: var(--accent-soft); border-color: var(--accent); }
.feedback.band-plus { background: var(--ok-soft); border-color: var(--ok); color: var(--ok-ink); }

.next-level {
  border-radius: 0 0 12px 12px; padding: 14px 16px; margin-bottom: 14px;
  border: 1px solid var(--border); border-top: 1px dashed var(--border);
  background: var(--surface-2);
}
.next-level.band-aide {
  border-color: var(--warn);
  background: var(--warn-soft);
  background: color-mix(in srgb, var(--warn-soft) 45%, var(--surface));
}
.next-level.band-reco {
  border-color: var(--accent);
  background: var(--accent-soft);
  background: color-mix(in srgb, var(--accent-soft) 45%, var(--surface));
}
.next-level.band-plus {
  border-color: var(--ok);
  background: var(--ok-soft);
  background: color-mix(in srgb, var(--ok-soft) 45%, var(--surface));
}
.nl-label {
  display: block; font-size: .7rem; text-transform: uppercase;
  letter-spacing: .06em; font-weight: 700; color: var(--text-soft);
}
.nl-name { display: block; font-size: 1.25rem; line-height: 1.25; margin: 2px 0 4px; }
.nl-consigne { white-space: pre-wrap; font-size: .95rem; }

/* ---------- Couleur des paliers : orange → vert foncé ----------
   Chaque élément porteur d'un palier reçoit trois variables calculées par
   progress.js : --lv (l'encre en thème clair), --lv-lite (la même en plus
   clair, pour le thème sombre) et --lv-soft (un fond translucide valable
   dans les deux thèmes). --lv-ink choisit l'une des deux encres. */

.lv-tint { --lv-ink: var(--lv); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .lv-tint { --lv-ink: var(--lv-lite); }
}
:root[data-theme="dark"] .lv-tint { --lv-ink: var(--lv-lite); }

.lv-name { color: var(--lv-ink); font-weight: 700; }

.lv-chip {
  display: inline-block; padding: 2px 9px; border-radius: 999px;
  background: var(--lv-soft); color: var(--lv-ink);
  border: 1px solid var(--lv-ink); font-size: .78rem; font-weight: 650;
  white-space: nowrap;
}

.stat.lv-tint {
  background: var(--lv-soft);
  border-left: 4px solid var(--lv-ink);
}
.stat.lv-tint b { color: var(--lv-ink); }

.lv-fieldset {
  border: 2px solid var(--lv-ink);
  background: var(--lv-soft);
}
.lv-fieldset > legend { color: var(--lv-ink); }

.notice.lv-notice {
  background: var(--lv-soft); border-color: var(--lv-ink); color: var(--lv-ink);
}

/* Le bandeau « palier atteint » garde la nuance de sa bande en fond, mais
   c'est la couleur du palier qui borde et qui écrit son nom. */
.next-level.lv-tint { border-left: 6px solid var(--lv-ink); }

/* Choix du palier en kiosque : de gros boutons dégradés de l'orange au vert. */
.k-level, .k-level:hover {
  background: var(--lv-soft);
  border: 2px solid var(--lv-ink);
  color: var(--lv-ink);
  font-weight: 650;
}
.k-level.is-reco, .k-level.is-reco:hover {
  background: var(--lv-ink);
  color: #fff;
  box-shadow: 0 0 0 3px var(--lv-soft);
}
.k-level .tiny { opacity: .85; }

.print-level.lv-tint {
  border-left: 5px solid var(--lv-ink);
  padding-left: 8px;
}
.print-level.lv-tint b { color: var(--lv-ink); }

/* ---------- Bonus : ce qui rapporte des points ---------- */

.badge-bonus { background: var(--bonus-soft); color: var(--bonus-ink); border-color: transparent; }
.btn-bonus, .btn-bonus:hover {
  background: var(--bonus-soft); border-color: var(--bonus); color: var(--bonus-ink); font-weight: 650;
}
.bonus-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }

/* ---------- Tours de matchs ---------- */

.round { margin-bottom: 18px; }
.round-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 8px 12px; margin-bottom: 10px;

}
.round-head h3 { margin: 0; }
.observers { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

.match-line {
  display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center;
  padding: 8px 0; border-bottom: 1px solid var(--border);
}
.match-line.faded { opacity: .5; }
.match-line .mt { font-weight: 650; }
.match-line .mt:last-of-type { text-align: right; }
.match-line .ms { font-variant-numeric: tabular-nums; font-size: 1.05rem; white-space: nowrap; }
.match-line .md { grid-column: 1 / -1; }

/* ---------- Pavé de code du kiosque ---------- */

.code-display {
  font-size: 2rem; letter-spacing: .35em; text-align: center; font-variant-numeric: tabular-nums;
  background: var(--surface-2); border-radius: 10px; padding: 12px; margin-bottom: 12px;
}
.code-display.bad { color: var(--bad); font-size: 1.1rem; letter-spacing: normal; }
.code-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 300px; margin: 0 auto; }
.code-pad button { min-height: 58px; font-size: 1.3rem; }

/* ---------- Images jointes aux messages ---------- */

.img-slot { margin: 8px 0 0; }
.img-slot img {

  border: 1px solid var(--border); border-radius: 8px; background: #fff;
}
.band { border-left: 3px solid var(--border); }
.band-aide { border-left-color: var(--warn); }
.band-reco { border-left-color: var(--accent); }
.band-plus { border-left-color: var(--ok); }

/* ---------- Feuille de groupes à projeter ou imprimer ---------- */

.print-sheet { max-width: 1000px; margin: 0 auto; }
.print-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
.print-head h1 { margin: 0; }
.print-consigne {
  white-space: pre-wrap; border-left: 3px solid var(--accent);
  background: var(--accent-soft); padding: 10px 12px; border-radius: 0 8px 8px 0;
}
.print-schema img { max-height: 220px; }
.print-groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.print-group {
  border: 2px solid var(--border); border-radius: 10px; padding: 12px; break-inside: avoid;
  background: var(--surface);
}
.print-group h2 { margin: 0 0 6px; font-size: 1.1rem; }
.print-group ol { margin: 0 0 10px; padding-left: 22px; font-size: 1.02rem; line-height: 1.7; }
.print-level {
  margin: 0 0 8px; font-size: .86rem; background: var(--surface-2);
  border-radius: 6px; padding: 6px 8px;
}
.print-level span { display: block; white-space: pre-wrap; color: var(--text-soft); margin-top: 2px; }
.print-score { display: flex; align-items: center; gap: 6px; font-size: .82rem; color: var(--text-soft); }
.print-score i { display: block; flex: 1; height: 26px; border: 1px dashed var(--border); border-radius: 5px; }

/* ---------- Divers ---------- */

.pairs-list { display: flex; flex-direction: column; gap: 6px; }
.pair {
  display: flex; align-items: center; gap: 8px; padding: 6px 10px;
  border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-2); font-size: .88rem;
}
.pair.apart { border-left: 3px solid var(--bad); }
.pair.together { border-left: 3px solid var(--ok); }

.chart { width: 100%; height: auto; display: block; }
.chart .ax { stroke: var(--border); stroke-width: 1; }
.chart text { font-size: 10px; fill: var(--text-soft); }
.chart .pt { fill: var(--accent); fill-opacity: .75; }
.chart .fit { stroke: var(--warn); stroke-width: 2; stroke-dasharray: 5 4; fill: none; }
.chart .line { stroke: var(--accent); stroke-width: 2; fill: none; }

/* ---------- Fenêtres (implémentation maison, voir ui.js) ---------- */

body.modal-open { overflow: hidden; }

.modal-back {
  position: fixed; inset: 0; z-index: 300;
  background: rgba(20, 28, 38, .42);
  display: flex; align-items: flex-start; justify-content: center;
  padding: max(16px, env(safe-area-inset-top)) 16px 16px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.modal-panel {
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: 14px;
  width: 100%; max-width: 660px; margin: auto;
  box-shadow: 0 12px 40px rgba(20, 28, 38, .18);
  display: flex; flex-direction: column; max-height: calc(100vh - 32px);
}
.modal-head {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--surface); border-radius: 14px 14px 0 0; z-index: 1;
}
.modal-head h2 { margin: 0; flex: 1; font-size: 1.08rem; }
.modal-x {
  min-height: 36px; min-width: 36px; padding: 0; border-radius: 8px;
  border-color: transparent; background: transparent; color: var(--text-soft); font-size: 1rem;
}
.modal-x:hover { background: var(--surface-2); color: var(--text); }
.modal-body { padding: 16px; overflow-y: auto; flex: 1; }
.modal-body > :last-child { margin-bottom: 0; }
.modal-foot {
  display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap;
  padding: 12px 16px; border-top: 1px solid var(--border);
  position: sticky; bottom: 0; background: var(--surface); border-radius: 0 0 14px 14px;
}
.modal-foot .btn-primary { min-width: 130px; }

@media (max-width: 640px) {
  .modal-back { padding: 0; }
  .modal-panel { max-width: 100%; min-height: 100vh; max-height: none; border-radius: 0; border: none; }
  .modal-head, .modal-foot { border-radius: 0; }
  .modal-foot { padding-bottom: max(12px, env(safe-area-inset-bottom)); }
  .modal-foot button { flex: 1; }
}

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  background: var(--text); color: var(--bg); padding: .6rem 1rem; border-radius: 999px;
  font-size: .88rem; font-weight: 600; z-index: 200; box-shadow: var(--shadow); max-width: 90vw; text-align: center;
}

@media (max-width: 760px) {
  .topbar { flex-direction: column; align-items: stretch; gap: .4rem; min-width: 0; }
  .topbar .brand { align-self: flex-start; margin-right: 0; }
  .nav {
    flex: 0 0 auto; width: 100%; min-width: 0; max-width: 100%;
    flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch;
    padding-bottom: 2px; scrollbar-width: thin;
  }
  .nav button { white-space: nowrap; flex: 0 0 auto; }
  #ctx { align-self: flex-start; max-width: 100%; }
}

@media (max-width: 640px) {
  main { padding: 14px 12px 56px; }
  .card { padding: 13px; }
  .brand { font-size: .86rem; }
  .brand small { font-size: .64rem; }
  .topbar { padding-top: .45rem; padding-bottom: .45rem; }
  .grid.cols-2, .grid.cols-3, .grid.cols-4 { grid-template-columns: 1fr; }
}

@media print {
  .topbar, .subnav, .no-print, button, .toast { display: none !important; }
  body, .card { background: #fff; color: #000; box-shadow: none; }
  .team, .print-group { break-inside: avoid; }
  /* Une vue projetée s'imprime en pleine page, sans l'application derrière. */
  body:has(#projector) #app { display: none !important; }
  #projector {
    position: static !important; overflow: visible !important;
    padding: 0 !important; background: #fff !important;
  }
  .print-groups { grid-template-columns: repeat(2, 1fr); }
  .print-group { border-color: #999; }
}

/* ---------- Oppositions d'échauffement, tour par tour ---------- */

.duel-round { margin-bottom: 14px; }
.duel-round-head {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 6px;
}
.duel-round-head h4 { margin: 0; }
.duel-preview { margin-top: 4px; }
.duel-tour { padding: 5px 0; border-bottom: 1px dashed var(--border); font-size: .85rem; }
.duel-tour:last-child { border-bottom: none; }
.k-tour { margin: 14px 0 8px; font-size: 1rem; }

/* ---------- Rappel des messages, groupé par palier ----------
   Un bloc par palier, à la couleur du palier : les élèves qui vont travailler
   au même endroit lisent au même endroit, et repèrent leur prénom de loin. */

.lv-group {
  border: 2px solid var(--lv-ink);
  border-radius: 14px;
  background: var(--lv-soft);
  padding: 14px 14px 10px;
  margin-bottom: 16px;
}
.lv-group-head { margin-bottom: 10px; }
.lv-group-label {
  display: block; font-size: .7rem; text-transform: uppercase;
  letter-spacing: .08em; font-weight: 700; color: var(--lv-ink); opacity: .8;
}
.lv-group-name { margin: 2px 0 2px; font-size: 1.35rem; color: var(--lv-ink); }
.lv-group-consigne { margin: 0; font-size: .95rem; white-space: pre-wrap; }

.lv-names { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.lv-name-chip {
  display: inline-block; padding: 7px 14px; border-radius: 999px;
  background: var(--surface); border: 2px solid var(--lv-ink);
  color: var(--lv-ink); font-size: 1.15rem; font-weight: 700; line-height: 1.2;
}
.lv-name-chip.is-new { background: var(--lv-ink); color: #fff; }

.lv-msg {
  background: var(--surface); border-radius: 10px; padding: 10px 12px;
  margin-bottom: 8px; font-size: 1.02rem;
  border-left: 5px solid var(--border);
}
.lv-msg:last-child { margin-bottom: 0; }
.lv-msg.band-aide { border-left-color: var(--warn); }
.lv-msg.band-reco { border-left-color: var(--accent); }
.lv-msg.band-plus { border-left-color: var(--ok); }

@media (max-width: 560px) {
  .lv-group-name { font-size: 1.15rem; }
  .lv-name-chip { font-size: 1rem; padding: 6px 11px; }
}

/* Liste compacte d'équipes (composition d'un échauffement). */
.teamlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; margin-bottom: 12px; }
.teamlist-item {
  border: 1px solid var(--border); border-left-width: 4px; border-radius: 8px;
  padding: 7px 10px; background: var(--surface-2); font-size: .85rem;
}

/* Petit champ posé dans une barre d'outils (terrains disponibles, etc.). */
.inline-field {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 0 4px 0 10px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); min-height: var(--tap);
}
.inline-field input { border: none; background: transparent; min-height: 36px; padding: 0 4px; }
.inline-field input:focus { outline-offset: -2px; }

/* ---------- Dossiers de la banque ---------- */

.bank-folder { margin-bottom: 18px; }
.bank-folder-head {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 6px 0 8px; border-bottom: 2px solid var(--border); margin-bottom: 10px;
}
.bank-folder-head h3 { margin: 0; }
.folder-pick { min-height: 34px; font-size: .82rem; max-width: 170px; }

/* Jauge d'occupation du stockage. */
.gauge {
  height: 10px; border-radius: 999px; background: var(--surface-2);
  border: 1px solid var(--border); overflow: hidden;
}
.gauge-fill { height: 100%; background: var(--ok); transition: width .2s; }
.gauge-fill.warn { background: var(--warn); }
.gauge-fill.bad { background: var(--bad); }

/* Bandeau de relevé du fair-play sur une situation. */
.fair-row {
  margin-top: 10px; padding-top: 10px;
  border-top: 1px dashed var(--border);
}

/* Menu « ⋯ » des actions secondaires d'une fiche. */
.tools { position: relative; display: inline-block; }
.tools > summary {
  list-style: none; cursor: pointer; user-select: none;
  min-width: 34px; font-weight: 700; letter-spacing: .06em;
}
.tools > summary::-webkit-details-marker { display: none; }
.tools-pop {
  position: absolute; right: 0; top: calc(100% + 4px); z-index: 30;
  display: flex; flex-direction: column; align-items: stretch; gap: 2px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: 0 6px 20px rgba(30, 42, 56, .12);
  padding: 5px; min-width: 210px;
}
.tools-pop button { justify-content: flex-start; white-space: nowrap; }

/* Bouton d'appréciation d'un élève blessé, dans la grille des présences. */
.att-obs {
  grid-column: 1 / -1; margin-top: 4px; min-height: 30px;
  font-size: .78rem; background: var(--surface); border-color: var(--border);
}
.att-obs.is-on { background: var(--ok-soft); border-color: var(--ok); color: var(--ok-ink); font-weight: 650; }

/* L'équipe des dispensés : présente à l'écran, absente des appariements. */
.team-dispense {
  border-style: dashed;
  background: var(--warn-soft);
}
.team-dispense .player { background: var(--surface); cursor: default; }
.dispense-row { display: block; cursor: default; }
.dispense-nom { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
.dispense-actions { display: flex; gap: 5px; }
.dispense-actions .att-role { flex: 1 1 auto; min-width: 0; min-height: 32px; font-size: .78rem; }
.dispense-actions .att-obs { flex: 0 0 auto; grid-column: auto; margin-top: 0; white-space: nowrap; }
</style>

<div id="app">

  <header class="topbar">

  </header>

</div>

<script>
/* ============================================================================
   Ultimate EPS — noyau : stockage, utilitaires, import CSV
   Aucune dépendance externe. Script classique (pas de module) pour
   fonctionner aussi bien en file:// que sur GitHub Pages.
   ========================================================================== */
'use strict';

var APP = (function () {

  /* ------------------------------------------------------------------ utils */

  var uid = (function () {
    var n = 0;
    return function (p) {
      n++;
      return (p || 'id') + '_' + Date.now().toString(36) + n.toString(36) +
        Math.floor(Math.random() * 1296).toString(36);
    };
  })();

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function sum(a) { var s = 0; for (var i = 0; i < a.length; i++) s += a[i]; return s; }
  function mean(a) { return a.length ? sum(a) / a.length : 0; }
  function sd(a) {
    if (a.length < 2) return 0;
    var m = mean(a), s = 0;
    for (var i = 0; i < a.length; i++) s += (a[i] - m) * (a[i] - m);
    return Math.sqrt(s / (a.length - 1));
  }
  function variance(a) { var s = sd(a); return s * s; }
  function round(v, d) { var f = Math.pow(10, d == null ? 1 : d); return Math.round(v * f) / f; }
  function pct(v) { return isFinite(v) ? Math.round(v * 100) + ' %' : '–'; }
  function todayISO() {
    var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  function frDate(iso) {
    if (!iso) return '';
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
    return m ? m[3] + '/' + m[2] + '/' + m[1] : iso;
  }
  function sortBy(arr, fn, desc) {
    return arr.slice().sort(function (a, b) {
      var x = fn(a), y = fn(b);
      if (typeof x === 'string') return desc ? y.localeCompare(x, 'fr') : x.localeCompare(y, 'fr');
      return desc ? y - x : x - y;
    });
  }
  function shuffle(a, rng) {
    rng = rng || Math.random;
    var r = a.slice();
    for (var i = r.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1)), t = r[i]; r[i] = r[j]; r[j] = t;
    }
    return r;
  }
  /* Générateur pseudo-aléatoire reproductible (mulberry32) : deux clics sur
     « composer » avec les mêmes données donnent le même résultat. */
  function rngFrom(seedStr) {
    var h = 1779033703 ^ String(seedStr).length;
    for (var i = 0; i < String(seedStr).length; i++) {
      h = Math.imul(h ^ String(seedStr).charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    var a = h >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function pearson(xs, ys) {
    var n = Math.min(xs.length, ys.length);
    if (n < 3) return null;
    var mx = mean(xs.slice(0, n)), my = mean(ys.slice(0, n));
    var num = 0, dx = 0, dy = 0;
    for (var i = 0; i < n; i++) {
      var a = xs[i] - mx, b = ys[i] - my;
      num += a * b; dx += a * a; dy += b * b;
    }
    if (dx === 0 || dy === 0) return null;
    return num / Math.sqrt(dx * dy);
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /* -------------------------------------------------------- algèbre linéaire */

  /* Résolution de A x = b par élimination de Gauss avec pivot partiel. */
  function gaussSolve(A, b) {
    var n = b.length, i, j, k;
    var M = [];
    for (i = 0; i < n; i++) M.push(A[i].slice().concat([b[i]]));
    for (i = 0; i < n; i++) {
      var piv = i;
      for (k = i + 1; k < n; k++) if (Math.abs(M[k][i]) > Math.abs(M[piv][i])) piv = k;
      if (Math.abs(M[piv][i]) < 1e-12) continue;            // colonne dégénérée
      var tmp = M[i]; M[i] = M[piv]; M[piv] = tmp;
      for (k = i + 1; k < n; k++) {
        var f = M[k][i] / M[i][i];
        if (!f) continue;
        for (j = i; j <= n; j++) M[k][j] -= f * M[i][j];
      }
    }
    var x = new Array(n);
    for (i = n - 1; i >= 0; i--) {
      if (Math.abs(M[i][i]) < 1e-12) { x[i] = 0; continue; }
      var s = M[i][n];
      for (j = i + 1; j < n; j++) s -= M[i][j] * x[j];
      x[i] = s / M[i][i];
    }
    for (i = 0; i < n; i++) if (!isFinite(x[i])) x[i] = 0;
    return x;
  }

  /* Régression ridge : minimise ||Xw - y||² + lambda·||w||².
     X est donné en lignes creuses : [{idx: poids, ...}, ...]. */
  function ridgeSparse(rows, y, nCols, lambda) {
    var A = [], b = new Array(nCols), i, j, k;
    for (i = 0; i < nCols; i++) { A.push(new Array(nCols).fill(0)); b[i] = 0; }
    for (i = 0; i < rows.length; i++) {
      var r = rows[i], keys = Object.keys(r);
      for (j = 0; j < keys.length; j++) {
        var cj = +keys[j], vj = r[keys[j]];
        b[cj] += vj * y[i];
        for (k = 0; k < keys.length; k++) {
          var ck = +keys[k];
          A[cj][ck] += vj * r[keys[k]];
        }
      }
    }
    for (i = 0; i < nCols; i++) A[i][i] += lambda;
    return gaussSolve(A, b);
  }

  function load() {
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { /* navigation privée */ }
    if (!raw) { state = newState(); return state; }
    try {
      var obj = JSON.parse(raw);

      state = newState();

  function migrate(obj) {
    if (!obj || typeof obj !== 'object') return newState();
    var base = newState();
    obj.settings = Object.assign({}, base.settings, obj.settings || {});
    obj.settings.sources = Object.assign({}, base.settings.sources, obj.settings.sources || {});
    if (!Array.isArray(obj.settings.criteria) || !obj.settings.criteria.length)
      obj.settings.criteria = base.settings.criteria;
    if (!Array.isArray(obj.settings.statIndicators) || !obj.settings.statIndicators.length)
      obj.settings.statIndicators = base.settings.statIndicators;
    if (!Array.isArray(obj.settings.statFields) || !obj.settings.statFields.length)
      obj.settings.statFields = base.settings.statFields;
    /* Un espace créé avant le changement de code garde l'ancien par défaut :
       on le met à jour, sauf si l'enseignant en avait choisi un autre. */
    if (String(obj.settings.kioskCode || '').trim() === KIOSK_CODE_ANCIEN) {
      obj.settings.kioskCode = KIOSK_CODE;
    }
    obj.classes = obj.classes || {};
    obj.lessons = obj.lessons || {};
    obj.grids = obj.grids || {};
    obj.bank = obj.bank || {};
    obj.bankFolders = obj.bankFolders || {};
    obj.ui = Object.assign({}, base.ui, obj.ui || {});
    obj.version = 2;
    return obj;
  }

  function save(immediate) {
    state.savedAt = new Date().toISOString();
    clearTimeout(saveTimer);
    var doIt = function () {
      try {
        localStorage.setItem(KEY, JSON.stringify(state));
        if (!lastSaveOk) {
          lastSaveOk = true;
          notify('✓ Sauvegarde à nouveau possible : tout est enregistré.');
          emit();
        }
      } catch (e) {
        console.error(e);
        var etait = lastSaveOk;
        lastSaveOk = false;
        if (etait) {
          var info = storageInfo();
          var part = info.total ? Math.round(info.images / info.total * 100) : 0;
          notify('⚠ Stockage plein : rien n\'est enregistré depuis maintenant. ' +
            (info.nbImages
              ? 'Les images occupent ' + part + ' % de l\'espace (' + info.nbImages + ' images) — ' +
                'Réglages → Stockage propose de les alléger en un clic.'
              : 'Exporte ta sauvegarde JSON, puis allège l\'espace depuis Réglages → Stockage.'));
          emit();
        }
      }
      if (APP.cloud && APP.cloud.isOn && APP.cloud.isOn()) APP.cloud.push(state);
    };
    if (immediate) doIt(); else saveTimer = setTimeout(doIt, 250);
  }
